                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
    /api/news/v1/get-report-media:
        get:
            tags:
                - NewsService
            summary: GetReportMedia
            description: |-
                GetReportMedia polls a media check started with CheckReportMedia. Operators only.
                 Requires the X-Trust-Review-Key header (the server's TRUST_REVIEW_SECRET), not an API key; without it the response is 401.
            operationId: GetReportMedia
            security:
                - TrustReviewKey: []
            parameters:
                - name: job_id
                  in: query
                  description: Job id returned by CheckReportMedia.
                  required: true
                  example: "media:1717200000000:0123456789abcdef0123456789abcdef"
                  schema:
                    type: string
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "error": ""
                                "result":
                                    "bytes": 482113
                                    "caveats":
                                        - "Content credentials say who signed a file and what they declared about it. They are not a judgment that the media is genuine."
                                        - "An earliest copy is when a search provider's crawler first saw the image on a page, not when or where it was first published."
                                    "credentials":
                                        "actions":
                                            - "action": "c2pa.created"
                                              "digitalSourceType": "http://cv.iptc.org/newscodes/digitalsourcetype/digitalCapture"
                                              "softwareAgent": "Example Camera App"
                                            - "action": "c2pa.cropped"
                                              "digitalSourceType": ""
                                              "softwareAgent": "Example Editor"
                                        "claimGenerator": "Example Camera App 2.1"
                                        "contentChangedAfterSigning": false
                                        "declaresAiGeneration": false
                                        "failureCodes":
                                            []
                                        "ingredientCount": 1
                                        "signedAt": "2026-10-15T08:30:00Z"
                                        "signer": "Example Newsroom (synthetic)"
                                        "signerCommonName": "Example Newsroom Signer"
                                        "signerTrust": "trusted"
                                        "state": "found"
                                        "validationState": "trusted"
                                    "earliest":
                                        "copies":
                                            - "crawlDate": "2026-10-15"
                                              "domain": "example.org"
                                              "pageUrl": "https://example.org/2026/10/15/story"
                                        "provider": "TinEye"
                                        "searchedAt": "2026-10-16T12:00:05.000Z"
                                        "state": "ok"
                                        "totalMatches": 3
                                    "fetchedAt": "2026-10-16T12:00:00.000Z"
                                    "mediaType": "image/jpeg"
                                    "sha256": "9f2c5f0e0b8a4d6c3e1f7a9b2d4c6e8f0a1b3c5d7e9f1a3b5c7d9e1f3a5b7c9d"
                                    "url": "https://example.com/media/synthetic-photo.jpg"
                                "status": "done"
                            schema:
                                $ref: '#/components/schemas/GetMediaProvenanceResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "401":
                    description: Missing or invalid X-Trust-Review-Key, or review is not configured on the server.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
    /api/news/v1/search-claim-headlines:
        get:
            tags:
                - NewsService
            summary: SearchClaimHeadlines
            description: SearchClaimHeadlines returns the fresh headlines from every configured feed that share a claim's words, so the /verify page and verify_claim can build its coverage card.
            operationId: SearchClaimHeadlines
            security: []
            parameters:
                - name: claim
                  in: query
                  description: The claim or headline, up to 300 characters. Empty returns only the counts.
                  required: false
                  example: "example"
                  schema:
                    type: string
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "feedCached": 241
                                "feedTotal": 241
                                "headlines":
                                    - "link": "https://example.com/news/synthetic-example"
                                      "publishedAt": 1768478400000
                                      "source": "Example Feed"
                                      "title": "Synthetic example headline sharing the claim's words"
                                "readAt": "2026-01-15T12:00:00.000Z"
                                "searchedFeeds": 216
                                "searchedHeadlines": 4140
                                "state": "complete"
                            schema:
                                $ref: '#/components/schemas/SearchClaimHeadlinesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
components:
    securitySchemes:
        WorldMonitorKey:
            type: apiKey
            in: header
            name: X-WorldMonitor-Key
            description: User-issued WorldMonitor API key.
        ApiKeyHeader:
            type: apiKey
            in: header
            name: X-Api-Key
            description: Alias header for the WorldMonitor API key (X-WorldMonitor-Key).
        BearerAuth:
            type: http
            scheme: bearer
            description: 'Bearer token: a Clerk-issued JWT for browser session flows, passed as Authorization: Bearer <token>.'
        TrustReviewKey:
            type: apiKey
            in: header
            name: X-Trust-Review-Key
            description: Operator review key (the server TRUST_REVIEW_SECRET). Required by the error-report review operations; a WorldMonitor API key does not authorize them.
    schemas:
        JmespathProjectionError:
            description: Returned when a REST jmespath projection is invalid or exceeds the expression/output byte limits.
            properties:
                _jmespath_error:
                    description: Projection error discriminator and details.
                    type: string
                original_keys:
                    description: Top-level keys or shape of the unprojected response.
                    items:
                        type: string
                    type: array
            required:
                - _jmespath_error
                - original_keys
            type: object
        UnauthorizedError:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable error message.
            required:
                - error
            description: Returned when the API key is missing, malformed, or lacks current API access.
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        BillingVerificationError:
            type: object
            description: "Returned with HTTP 503 when paid access cannot be confirmed right now: the billing provider is re-verifying a recently expired subscription, or the entitlement backend is unreachable. Retryable — honor Retry-After."
            properties:
                error:
                    type: string
                    description: Human-readable billing-verification failure reason.
                code:
                    type: string
                    enum:
                        - renewal_verification_pending
                        - renewal_verification_failed
                        - entitlement_verification_unavailable
                    description: Machine-readable billing-verification state, mirrored in the X-Billing-Verification response header.
                requiredTier:
                    type: integer
                    format: int32
                    description: Minimum entitlement tier required for this endpoint, when the denial came from a tier gate.
            required:
                - error
                - code
        InvalidRequestBodyError:
            type: object
            description: Returned when a JSON POST request body is empty or malformed.
            properties:
                message:
                    type: string
                    description: Invalid request body
            required:
                - message
        GatewayError:
            type: object
            description: Returned by gateway infrastructure errors before an RPC handler runs, such as origin, routing, method, authentication, or quota checks.
            properties:
                error:
                    oneOf:
                        - type: string
                        - type: object
                          additionalProperties: true
                    description: Gateway error reason or structured gateway failure details.
            required:
                - error
        RateLimitError:
            type: object
            description: Returned when a gateway or handler rate limit rejects the request.
            properties:
                error:
                    type: string
                    description: Human-readable rate-limit failure reason.
            required:
                - error
        ForbiddenError:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable entitlement failure reason.
                code:
                    type: string
                    enum:
                        - subscription_lapsed
                    description: Machine-readable denial code, present when the 403 is a billing-provider-confirmed subscription lapse (mirrored in the X-Billing-Verification response header).
                requiredTier:
                    type: integer
                    format: int32
                    description: Minimum entitlement tier required for this endpoint.
                currentTier:
                    type: integer
                    format: int32
                    description: Caller entitlement tier when known.
                planKey:
                    type: string
                    description: Caller plan key when known.
            required:
                - error
            description: Returned when a PRO-gated endpoint denies access because the caller has no resolved authenticated user, entitlements cannot be verified, or the caller lacks the required entitlement tier.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        SummarizeArticleRequest:
            type: object
            properties:
                provider:
                    type: string
                    minLength: 1
                    description: 'LLM provider: "ollama", "openrouter"'
                headlines:
                    type: array
                    items:
                        type: string
                        minItems: 1
                        description: |-
                            Headlines to summarize. Up to 10 raw headlines are used for request
                             identity/cache matching; the LLM prompt uses up to 5 unique, non-empty
                             sanitized headline/body pairs.
                    minItems: 1
                mode:
                    type: string
                    description: 'Summarization mode: "brief", "analysis", "translate", "" (default).'
                geoContext:
                    type: string
                    description: Geographic signal context to include in the prompt.
                variant:
                    type: string
                    description: 'Variant: "full", "tech", or target language for translate mode.'
                lang:
                    type: string
                    description: Output language code, default "en".
                systemAppend:
                    type: string
                    description: Optional system prompt append for analytical framework instructions.
                bodies:
                    type: array
                    items:
                        type: string
                        description: |-
                            Optional article bodies paired 1:1 with `headlines`. When bodies[i] is
                             non-empty, the prompt interleaves it as grounding context under
                             headlines[i]; when empty, behavior is identical to headline-only today.
                             Callers may supply a shorter array; missing entries are treated as empty.
                             Each body is subject to the same sanitisation as headlines before reaching
                             the LLM prompt.
            required:
                - provider
            description: SummarizeArticleRequest specifies parameters for LLM article summarization.
        SummarizeArticleResponse:
            type: object
            properties:
                summary:
                    type: string
                    description: The generated summary text.
                model:
                    type: string
                    description: Model identifier used for generation.
                provider:
                    type: string
                    description: Provider that produced the result (or "cache").
                tokens:
                    type: integer
                    format: int32
                    description: Token count from the LLM response.
                fallback:
                    type: boolean
                    description: Whether the client should try the next provider in the fallback chain.
                error:
                    type: string
                    description: Error message if the request failed.
                errorType:
                    type: string
                    description: Error type/name (e.g. "TypeError").
                status:
                    type: string
                    enum:
                        - SUMMARIZE_STATUS_UNSPECIFIED
                        - SUMMARIZE_STATUS_SUCCESS
                        - SUMMARIZE_STATUS_CACHED
                        - SUMMARIZE_STATUS_SKIPPED
                        - SUMMARIZE_STATUS_ERROR
                    description: SummarizeStatus indicates the outcome of a summarization request.
                statusDetail:
                    type: string
                    description: Human-readable detail for non-success statuses (skip reason, etc.).
            description: SummarizeArticleResponse contains the LLM summarization result.
        GetSummarizeArticleCacheRequest:
            type: object
            properties:
                cacheKey:
                    type: string
                    description: Deterministic cache key computed by buildSummaryCacheKey().
            description: GetSummarizeArticleCacheRequest looks up a pre-computed summary by cache key.
        ListFeedDigestRequest:
            type: object
            properties:
                variant:
                    type: string
                    description: 'Digest variant: full, tech, finance, happy, commodity. Unsupported site variants, including energy, currently fall back to full.'
                lang:
                    type: string
                    description: ISO 639-1 language code of a supported digest language (en, fr, ar, etc.). Unsupported codes are rejected with 400.
        ListFeedDigestResponse:
            type: object
            properties:
                categories:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/CategoryBucket'
                    description: Per-category buckets — keys match category names from feed config
                feedStatuses:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Per-feed status — only non-ok states emitted; absent key implies ok.
                         Values: empty (feed returned 0 items), timeout (timed out during fetch),
                         all-undated (every parsed item lacked a usable date), partial-undated
                         (some parsed items lacked a usable date).
                generatedAt:
                    type: string
                    description: ISO 8601 timestamp of when this digest was generated
                coverage:
                    $ref: '#/components/schemas/DigestCoverage'
        CategoriesEntry:
            type: object
            properties:
                key:
                    type: string
                value:
                    $ref: '#/components/schemas/CategoryBucket'
        FeedStatusesEntry:
            type: object
            properties:
                key:
                    type: string
                value:
                    type: string
        CategoryBucket:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/NewsItem'
        NewsItem:
            type: object
            properties:
                source:
                    type: string
                    minLength: 1
                    description: Source feed name.
                title:
                    type: string
                    minLength: 1
                    description: Article headline.
                link:
                    type: string
                    description: Article URL.
                publishedAt:
                    type: integer
                    format: int64
                    description: 'Publication time, as Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                isAlert:
                    type: boolean
                    description: Whether this article triggered an alert condition.
                threat:
                    $ref: '#/components/schemas/ThreatClassification'
                location:
                    $ref: '#/components/schemas/GeoCoordinates'
                locationName:
                    type: string
                    description: Human-readable location name.
                importanceScore:
                    type: integer
                    format: int32
                    description: |-
                        Composite importance score. The base 0-100 score uses severity × 55% +
                         source tier × 20% + corroboration × 15% + recency × 10%, then may add an
                         18-point diplomacy/flashpoint boost and 4 points per entity-level
                         corroborating source, capped at five sources. The final score can exceed
                         100; with current boosts it is approximately capped at 138.
                corroborationCount:
                    type: integer
                    format: int32
                    description: |-
                        Number of distinct sources that reported the same story in this digest
                         cycle. "Same story" is determined by edit-tolerant story-identity
                         clustering (headlines describing one event with different wording,
                         ordering, source suffixes, truncation, or morphology corroborate each
                         other) — not exact-title matching. See shared/story-identity.js.
                storyMeta:
                    $ref: '#/components/schemas/StoryMeta'
                snippet:
                    type: string
                    description: |-
                        Cleaned article description from the RSS/Atom <description> /
                         <content:encoded> / <summary> / <content> tag: HTML-stripped,
                         entity-decoded, whitespace-normalised, clipped to 400 chars. Empty string
                         when unavailable or indistinguishable from the headline — consumers must
                         fall back to the headline for display/LLM grounding in that case.
                tickers:
                    type: array
                    items:
                        type: string
                        maxItems: 8
                        description: |-
                            Equity ticker symbols mentioned by the story, extracted at ingest from
                             cashtags ($AAPL) and the curated company dictionary
                             (shared/stocks.json). Uppercase symbols, deduplicated, capped at 8.
                             Empty when no tracked ticker is mentioned. See shared/ticker-extract.js.
                    maxItems: 8
                credibilityScore:
                    type: integer
                    format: int32
                    description: |-
                        Credibility score (0-100), distinct from importance_score. Measures
                         source reliability / truthfulness, not newsworthiness. The base score
                         uses source tier × 30% + propaganda risk × 50% + independent
                         corroboration × 20%. High propaganda-risk sources (state-controlled
                         media) are capped at 40 so a highly newsworthy RT/TASS story still
                         scores low. Third-party bias/factuality ratings are reserved and not
                         currently applied. See docs/methodology/news-credibility.mdx.
            required:
                - source
                - title
            description: NewsItem represents a single news article from RSS feed aggregation.
        ThreatClassification:
            type: object
            properties:
                level:
                    type: string
                    enum:
                        - THREAT_LEVEL_UNSPECIFIED
                        - THREAT_LEVEL_LOW
                        - THREAT_LEVEL_MEDIUM
                        - THREAT_LEVEL_HIGH
                        - THREAT_LEVEL_CRITICAL
                    description: ThreatLevel represents the assessed threat level of a news event.
                category:
                    type: string
                    description: Event category.
                confidence:
                    type: number
                    maximum: 1
                    minimum: 0
                    format: double
                    description: Confidence score (0.0 to 1.0).
                source:
                    type: string
                    description: |-
                        Classification source — "keyword", "keyword-historical-downgrade", or
                         "llm".
            description: ThreatClassification represents an AI-assessed threat level for a news item.
        GeoCoordinates:
            type: object
            properties:
                latitude:
                    type: number
                    maximum: 90
                    minimum: -90
                    format: double
                    description: Latitude in decimal degrees (-90 to 90).
                longitude:
                    type: number
                    maximum: 180
                    minimum: -180
                    format: double
                    description: Longitude in decimal degrees (-180 to 180).
            description: GeoCoordinates represents a geographic location using WGS84 coordinates.
        StoryMeta:
            type: object
            properties:
                firstSeen:
                    type: integer
                    format: int64
                    description: 'Epoch ms when the story first appeared in any digest cycle.. Warning: Values > 2^53 may lose precision in JavaScript'
                mentionCount:
                    type: integer
                    format: int32
                    description: Total number of digest cycles in which this story appeared.
                sourceCount:
                    type: integer
                    format: int32
                    description: |-
                        Number of unique sources reporting this story in the CURRENT digest
                         cycle; 1 for unclustered items.
                phase:
                    type: string
                    enum:
                        - STORY_PHASE_UNSPECIFIED
                        - STORY_PHASE_BREAKING
                        - STORY_PHASE_DEVELOPING
                        - STORY_PHASE_SUSTAINED
                        - STORY_PHASE_FADING
                    description: StoryPhase represents the lifecycle stage of a tracked news story.
            description: StoryMeta carries cross-cycle persistence data attached to each news item.
        DigestCoverage:
            type: object
            properties:
                state:
                    type: string
                    description: |-
                        complete | partial | stale | unavailable.
                         complete: every configured category had at least one completed eligible
                           feed and the build did not hit the global deadline.
                         partial: content exists, but a category had no completed feed or the
                           build hit the global deadline.
                         stale: accepted older content is served after a failed or gate-held attempt
                           (durable last-good serving, #7084).
                         unavailable: no eligible content could be served.
                attemptedAt:
                    type: string
                    description: ISO 8601 time of the latest build attempt (attempt identity).
                itemsServed:
                    type: integer
                    format: int32
                    description: Items served in this response, after every gate.
                publisherCount:
                    type: integer
                    format: int32
                    description: |-
                        Distinct publishers among the served items (normalized source labels,
                         current cycle only — not feed-label counts, not historical sets).
                feedTotal:
                    type: integer
                    format: int32
                    description: |-
                        Eligible feeds configured for this variant+language, and how many
                         completed (with or without items).
                feedCompleted:
                    type: integer
                    format: int32
                categoryTotal:
                    type: integer
                    format: int32
                    description: Configured categories, and how many had at least one completed feed.
                categoryCompleted:
                    type: integer
                    format: int32
                categoryStates:
                    type: object
                    additionalProperties:
                        type: string
                    description: 'Per-category state: ok (a feed completed) | missing (none did).'
                droppedFeedCap:
                    type: integer
                    format: int32
                    description: |-
                        Per-gate drop counts, named by gate position in the pipeline:
                         feed cap, undated-item, freshness floor, category cap.
                droppedUndated:
                    type: integer
                    format: int32
                droppedFreshness:
                    type: integer
                    format: int32
                droppedCategoryCap:
                    type: integer
                    format: int32
                servedStale:
                    type: boolean
                    description: |-
                        Durable last-good serving (#7084): true exactly when accepted older
                         content is replayed after a failed or gate-held attempt. The content counts
                         above still describe the served body; attempted_at names that latest
                         attempt, so it and generated_at diverge on a replay.
                staleAgeSeconds:
                    type: integer
                    format: int32
                    description: |-
                        Age of the served content since acceptance, in seconds (0 when fresh).
                         Bounded at 21600 (six hours): past that window the service reports
                         state=unavailable rather than serving older content.
                staleReason:
                    type: string
                    description: 'Closed stale reason: empty-rebuild | build-error | gate-held (empty when fresh).'
            description: |-
                Content vs attempt state for one digest response (#7085). generated_at
                 keeps the CONTENT identity (when the served items were produced);
                 attempted_at keeps the latest BUILD identity — the two diverge when
                 stale content is served after a failed or gate-held attempt (#7084).
        CategoryStatesEntry:
            type: object
            properties:
                key:
                    type: string
                value:
                    type: string
        ListCountryHeadlinesRequest:
            type: object
            properties:
                countryCodes:
                    type: array
                    items:
                        type: string
                        description: ISO 3166-1 alpha-2 codes. Repeated query parameter, at most 250 countries.
                    maxItems: 250
                    minItems: 1
            required:
                - countryCodes
            description: ListCountryHeadlinesRequest selects countries from the full English RSS pool.
        ListCountryHeadlinesResponse:
            type: object
            properties:
                countries:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/CountryHeadlineBucket'
                    description: Requested country codes with matching headlines; absent countries had no match.
                state:
                    type: string
                    description: complete | partial | unavailable. A failed revocation read is unavailable.
                feedTotal:
                    type: integer
                    format: int32
                    description: Configured full-variant feeds reachable from the English digest.
                feedCached:
                    type: integer
                    format: int32
                    description: Feeds whose parsed cache was available, including cached empty feeds.
                readAt:
                    type: string
                    description: Time the caches were read; article freshness is determined by published_at.
            description: ListCountryHeadlinesResponse describes cache availability independently of country matches.
        CountriesEntry:
            type: object
            properties:
                key:
                    type: string
                value:
                    $ref: '#/components/schemas/CountryHeadlineBucket'
        CountryHeadlineBucket:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/CountryHeadline'
                    maxItems: 5
            description: CountryHeadlineBucket contains at most five distinct article URLs.
        CountryHeadline:
            type: object
            properties:
                source:
                    type: string
                    description: 'Publisher name: trusted origin publisher or registered feed name.'
                title:
                    type: string
                    description: Headline that names the requested country.
                link:
                    type: string
                    description: HTTPS article URL.
                publishedAt:
                    type: integer
                    format: int64
                    description: 'Publisher publication time in Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
            description: CountryHeadline is a dated article from a configured RSS feed, before dashboard category caps.
        ListLabelChangesRequest:
            type: object
            properties:
                storyId:
                    type: string
                    maxLength: 64
                    description: Story identity hash (64 hex characters). Empty lists changes across all stories.
                limit:
                    type: integer
                    maximum: 200
                    minimum: 0
                    format: int32
                    description: Maximum changes returned, newest first. 0 uses the default of 50; at most 200.
            description: ListLabelChangesRequest selects recent corroboration label changes, optionally for one story.
        ListLabelChangesResponse:
            type: object
            properties:
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/LabelChange'
                state:
                    type: string
                    description: ok | unavailable. Unavailable means the log could not be read, not that it is empty.
                retentionDays:
                    type: integer
                    format: int32
                    description: Retention window in days.
                counts:
                    $ref: '#/components/schemas/LabelCounts'
            description: ListLabelChangesResponse lists changes from the last seven days, newest first.
        LabelChange:
            type: object
            properties:
                storyId:
                    type: string
                    description: Story identity hash; empty for a correction that names no story.
                field:
                    type: string
                    description: corroboration (a label moved) | correction (an accepted reader report).
                previous:
                    type: string
                    description: 'Previous state: single-publisher | corroborated; empty for a correction.'
                next:
                    type: string
                    description: 'New state: single-publisher | corroborated; empty for a correction.'
                previousPublishers:
                    type: integer
                    format: int32
                    description: Publisher families behind the previous label; 0 for a correction.
                nextPublishers:
                    type: integer
                    format: int32
                    description: Publisher families behind the new label; 0 for a correction.
                at:
                    type: integer
                    format: int64
                    description: 'Time the change was recorded, Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                trigger:
                    type: string
                    description: 'What recorded it: digest (automatic) | report (an accepted error report).'
                reason:
                    type: string
                    description: Plain-language reason, in English.
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/LabelChangePublisher'
                title:
                    type: string
                    description: Story headline when the change was recorded.
                link:
                    type: string
                    description: |-
                        Representative article URL. Empty when it failed the publisher link gate,
                         was revoked after the change was recorded, or the revocation set could not
                         be read.
                credibilityScore:
                    type: integer
                    format: int32
                    description: Story CRED score 0-100 when the change was recorded; -1 when unknown.
            description: |-
                LabelChange records one story moving between single-publisher and corroborated
                 coverage, or one correction a reviewer accepted from a reader report.
        LabelChangePublisher:
            type: object
            properties:
                name:
                    type: string
                    description: Curated publisher name, or the feed label when no family is curated.
                tier:
                    type: integer
                    format: int32
                    description: Declared source tier 1-4; 0 when no feed label declares one.
            description: LabelChangePublisher is one publisher family behind the new label.
        LabelCounts:
            type: object
            properties:
                at:
                    type: integer
                    format: int64
                    description: 'When the digest counted, Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                stories:
                    type: integer
                    format: int32
                    description: Stories counted.
                corroborated:
                    type: integer
                    format: int32
                    description: Two or more publisher families, not all tier 4.
                singlePublisher:
                    type: integer
                    format: int32
                    description: One publisher family.
                tier4Only:
                    type: integer
                    format: int32
                    description: Two or more families, every one a declared tier-4 outlet.
                unknown:
                    type: integer
                    format: int32
                    description: No evidence to judge.
            description: LabelCounts is how many stories in the latest full English digest carry each label.
        SubmitErrorReportRequest:
            type: object
            properties:
                message:
                    type: string
                    maxLength: 2000
                    minLength: 10
                    description: What is wrong, in the reader's words.
                storyId:
                    type: string
                    maxLength: 64
                    description: Story identity hash the report concerns, when known (64 hex characters).
                url:
                    type: string
                    maxLength: 2048
                    description: Article or WorldMonitor URL the report concerns, when known.
                contact:
                    type: string
                    maxLength: 320
                    description: Optional email for a reply. Never published.
                website:
                    type: string
                    description: 'Honeypot. Leave empty: a filled value is accepted and discarded.'
            description: SubmitErrorReportRequest is a reader's report that a WorldMonitor label or story is wrong. Stored for review; never applied automatically.
        SubmitErrorReportResponse:
            type: object
            properties:
                status:
                    type: string
                    description: received | queue-full.
                reportId:
                    type: string
                    description: Report id, empty unless received.
            description: SubmitErrorReportResponse acknowledges a stored report.
        ListErrorReportsRequest:
            type: object
            properties:
                status:
                    type: string
                    maxLength: 16
                    description: pending (default) | reviewed.
            description: ListErrorReportsRequest selects reports for review. Requires the X-Trust-Review-Key header.
        ListErrorReportsResponse:
            type: object
            properties:
                reports:
                    type: array
                    items:
                        $ref: '#/components/schemas/ErrorReport'
                state:
                    type: string
                    description: ok | unavailable.
            description: ListErrorReportsResponse lists reports, oldest pending first or newest reviewed first.
        ErrorReport:
            type: object
            properties:
                id:
                    type: string
                    description: Report id.
                status:
                    type: string
                    description: pending | accepted | rejected.
                message:
                    type: string
                    description: Reader's message.
                storyId:
                    type: string
                    description: Story identity hash, if given.
                url:
                    type: string
                    description: URL, if given.
                contact:
                    type: string
                    description: Reply email, if given.
                createdAt:
                    type: integer
                    format: int64
                    description: 'Submission time, Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                reviewedAt:
                    type: integer
                    format: int64
                    description: 'Review time, Unix epoch milliseconds; 0 while pending.. Warning: Values > 2^53 may lose precision in JavaScript'
                publicNote:
                    type: string
                    description: Operator's public note, published with an accepted report.
            description: ErrorReport is one stored report as an operator sees it.
        ReviewErrorReportRequest:
            type: object
            properties:
                reportId:
                    type: string
                    maxLength: 64
                    minLength: 1
                    description: Report id.
                decision:
                    type: string
                    maxLength: 16
                    description: accept | reject.
                publicNote:
                    type: string
                    maxLength: 500
                    description: 'Public note. Required to accept: it is what the label log publishes.'
            description: ReviewErrorReportRequest accepts or rejects one report. Requires the X-Trust-Review-Key header.
        ReviewErrorReportResponse:
            type: object
            properties:
                report:
                    $ref: '#/components/schemas/ErrorReport'
            description: ReviewErrorReportResponse returns the reviewed report.
        SearchFactChecksRequest:
            type: object
            properties:
                claim:
                    type: string
                    maxLength: 300
                    description: The claim or headline, up to 300 characters.
            description: SearchFactChecksRequest names the claim to look up published fact-checks for.
        SearchFactChecksResponse:
            type: object
            properties:
                factChecks:
                    type: array
                    items:
                        $ref: '#/components/schemas/FactCheck'
                state:
                    type: string
                    description: ok | unavailable | not-configured. Only ok means the search ran; an empty list is then no published fact-check found.
                caveat:
                    type: string
                    description: Fixed reminder that ratings are the fact-checkers' own and never change the coverage result.
            description: SearchFactChecksResponse lists published fact-checks of claims similar to the one searched.
        FactCheck:
            type: object
            properties:
                publisher:
                    type: string
                    description: The fact-checker's name as it publishes it.
                site:
                    type: string
                    description: The IFCN-allowlisted domain the link belongs to.
                rating:
                    type: string
                    description: The fact-checker's own rating, verbatim. WorldMonitor does not rate claims.
                reviewedAt:
                    type: string
                    description: When the fact-check was published, ISO 8601.
                url:
                    type: string
                    description: Link to the fact-check.
                title:
                    type: string
                    description: The fact-check's headline; empty when the feed gives none.
                claimReviewed:
                    type: string
                    description: 'The claim the fact-checker rated: similar to the claim searched, not necessarily the same.'
            description: FactCheck is one rating an IFCN-verified fact-checker published about a similar claim, cited with attribution.
        CheckMediaProvenanceRequest:
            type: object
            properties:
                url:
                    type: string
                    maxLength: 2048
                    minLength: 1
                    description: Public http(s) URL of the image or video file, up to 2048 characters. The worker fetches it; private and local addresses are refused.
            required:
                - url
            description: CheckMediaProvenanceRequest names the image or video to check.
        MediaCheckJob:
            type: object
            properties:
                jobId:
                    type: string
                    description: Generated job id of the form `media:{epoch_ms}:{32 hex}`.
                status:
                    type: string
                    description: Always "pending" at enqueue time.
                statusUrl:
                    type: string
                    description: Server-computed URL to poll for the result.
            description: MediaCheckJob is an accepted media check. A successful enqueue returns HTTP 202 Accepted with a Location header pointing at the status endpoint; treat any 2xx as success.
        GetMediaProvenanceRequest:
            type: object
            properties:
                jobId:
                    type: string
                    maxLength: 64
                    minLength: 1
                    description: Job id returned by the check.
            required:
                - jobId
            description: GetMediaProvenanceRequest polls one media check.
        GetMediaProvenanceResponse:
            type: object
            properties:
                status:
                    type: string
                    description: pending | done | failed.
                result:
                    $ref: '#/components/schemas/MediaProvenance'
                error:
                    type: string
                    description: Why the check failed, in plain English, when status is failed.
            description: GetMediaProvenanceResponse is the state of one media check.
        MediaProvenance:
            type: object
            properties:
                url:
                    type: string
                    description: The URL submitted.
                mediaType:
                    type: string
                    description: Detected media type, e.g. image/jpeg, video/mp4.
                bytes:
                    type: integer
                    format: int64
                    description: 'File size in bytes.. Warning: Values > 2^53 may lose precision in JavaScript'
                sha256:
                    type: string
                    description: SHA-256 of the file, hex.
                fetchedAt:
                    type: string
                    description: When the file was fetched, ISO 8601.
                credentials:
                    $ref: '#/components/schemas/MediaCredentials'
                earliest:
                    $ref: '#/components/schemas/MediaEarliestAppearance'
                caveats:
                    type: array
                    items:
                        type: string
                        description: Fixed reminders shown with every result.
            description: MediaProvenance is the result of one media check.
        MediaCredentials:
            type: object
            properties:
                state:
                    type: string
                    description: 'found | none | unreadable. none is common: most sites remove credentials on upload, and it says nothing about editing.'
                signer:
                    type: string
                    description: Organisation on the signing certificate; empty when the certificate names none.
                signerCommonName:
                    type: string
                    description: Common name on the signing certificate.
                signerTrust:
                    type: string
                    description: trusted | untrusted | unknown. trusted means the certificate chains to a configured C2PA trust anchor.
                claimGenerator:
                    type: string
                    description: Camera, phone or app that wrote the credentials.
                signedAt:
                    type: string
                    description: Signing time from a timestamp authority, ISO 8601; empty when the credentials carry none.
                actions:
                    type: array
                    items:
                        $ref: '#/components/schemas/MediaCredentialAction'
                declaresAiGeneration:
                    type: boolean
                    description: True when an action declares a generative-AI digital source type. Reported from the credentials, never detected by WorldMonitor.
                ingredientCount:
                    type: integer
                    format: int32
                    description: Number of source files (ingredients) the credentials list.
                validationState:
                    type: string
                    description: valid | invalid | trusted, the C2PA validation state; empty when no credentials were found.
                contentChangedAfterSigning:
                    type: boolean
                    description: 'True only when validation reports that the file no longer matches the signed hash: it changed after signing.'
                failureCodes:
                    type: array
                    items:
                        type: string
                        description: C2PA validation failure codes, verbatim.
            description: MediaCredentials is what the file's C2PA content credentials say. WorldMonitor reports them; it does not judge the media.
        MediaCredentialAction:
            type: object
            properties:
                action:
                    type: string
                    description: C2PA action, e.g. c2pa.created, c2pa.edited, c2pa.cropped.
                softwareAgent:
                    type: string
                    description: Software or device the credentials name for the action; empty when none.
                digitalSourceType:
                    type: string
                    description: IPTC digital source type URI the credentials declare; empty when none.
            description: MediaCredentialAction is one action the content credentials declare, as written by the signer.
        MediaEarliestAppearance:
            type: object
            properties:
                state:
                    type: string
                    description: ok | unsupported-media | not-configured | cap-reached | unavailable. ok with no copies means the provider has not seen the image.
                provider:
                    type: string
                    description: Search provider, e.g. TinEye.
                copies:
                    type: array
                    items:
                        $ref: '#/components/schemas/MediaEarliestCopy'
                totalMatches:
                    type: integer
                    format: int32
                    description: Matches the provider reported in total.
                searchedAt:
                    type: string
                    description: When the search ran, ISO 8601. A cached search shows when it first ran.
            description: MediaEarliestAppearance is the earliest copies a reverse image search has seen.
        MediaEarliestCopy:
            type: object
            properties:
                domain:
                    type: string
                    description: Domain of the page.
                pageUrl:
                    type: string
                    description: Page that showed the image.
                crawlDate:
                    type: string
                    description: When the search provider's crawler first saw the image there, YYYY-MM-DD. Not a publication date.
            description: MediaEarliestCopy is one place an earliest-copy search found the image, oldest first.
        CheckReportMediaRequest:
            type: object
            properties:
                reportId:
                    type: string
                    maxLength: 64
                    minLength: 1
                    description: Report id; the check uses the link the reader submitted with it.
            required:
                - reportId
            description: CheckReportMediaRequest names the reader report whose link to check. Operators only.
        GetReportMediaRequest:
            type: object
            properties:
                jobId:
                    type: string
                    maxLength: 64
                    minLength: 1
                    description: Job id returned by CheckReportMedia.
            required:
                - jobId
            description: GetReportMediaRequest polls a media check an operator started. Operators only.
        SearchClaimHeadlinesRequest:
            type: object
            properties:
                claim:
                    type: string
                    maxLength: 300
                    description: The claim or headline, up to 300 characters. Empty returns only the counts.
            description: SearchClaimHeadlinesRequest names the claim to search fresh headlines for.
        SearchClaimHeadlinesResponse:
            type: object
            properties:
                headlines:
                    type: array
                    items:
                        $ref: '#/components/schemas/ClaimHeadline'
                searchedHeadlines:
                    type: integer
                    format: int32
                    description: Fresh headlines searched.
                searchedFeeds:
                    type: integer
                    format: int32
                    description: Feeds those headlines came from.
                feedTotal:
                    type: integer
                    format: int32
                    description: Configured full-variant English feeds.
                feedCached:
                    type: integer
                    format: int32
                    description: Feeds whose parsed cache was available.
                state:
                    type: string
                    description: complete | partial | unavailable. Unavailable searched nothing.
                readAt:
                    type: string
                    description: When the feed caches were read, ISO 8601.
            description: SearchClaimHeadlinesResponse holds the headlines that share the claim's words, for building its coverage card.
        ClaimHeadline:
            type: object
            properties:
                source:
                    type: string
                    description: Registered feed name.
                title:
                    type: string
                link:
                    type: string
                    description: Article URL; empty when the ingest gate removed it.
                publishedAt:
                    type: integer
                    format: int64
                    description: 'Publication time in Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
            description: ClaimHeadline is one fresh headline from a configured feed.
