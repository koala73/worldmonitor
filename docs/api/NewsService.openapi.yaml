    /api/news/v1/list-label-changes:
        get:
            tags:
                - NewsService
            summary: ListLabelChanges
            description: ListLabelChanges returns stories whose corroboration label moved between single-publisher and corroborated in the last seven days, with the publishers behind each change.
            operationId: ListLabelChanges
            security: []
            parameters:
                - name: story_id
                  in: query
                  description: Story identity hash (64 hex characters). Empty lists changes across all stories.
                  required: false
                  example: "example-id"
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Maximum changes returned, newest first. 0 uses the default of 50; at most 200.
                  required: false
                  example: 25
                  schema:
                    type: integer
                    format: int32
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "changes":
                                    - "at": 1767182400000
                                      "credibilityScore": 72
                                      "field": "corroboration"
                                      "link": "https://example.com/news/synthetic-example"
                                      "next": "corroborated"
                                      "nextPublishers": 2
                                      "previous": "single-publisher"
                                      "previousPublishers": 1
                                      "reason": "2 publisher families now carry this story (was 1)."
                                      "sources":
                                          - "name": "Example Wire (synthetic)"
                                            "tier": 1
                                          - "name": "Example Daily (synthetic)"
                                            "tier": 2
                                      "storyId": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                                      "title": "Synthetic example story"
                                      "trigger": "digest"
                                "counts":
                                    "at": 1767182400000
                                    "corroborated": 64
                                    "singlePublisher": 51
                                    "stories": 120
                                    "tier4Only": 3
                                    "unknown": 2
                                "retentionDays": 7
                                "state": "ok"
                            schema:
                                $ref: '#/components/schemas/ListLabelChangesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
    /api/news/v1/submit-error-report:
        post:
            parameters:
                - name: Idempotency-Key
                  in: header
                  description: Optional client-generated idempotency key. Retrying a POST with the same key and an identical request body replays the original response (only the status, body, and Content-Type are reproduced) instead of re-executing; reusing the key with a different body is rejected with 422. For mutations this avoids duplicating the side effect, while for batch-read POSTs it replays a cached snapshot that can be up to 24 hours stale. Keys are scoped per authenticated caller (falling back to the source IP for unauthenticated endpoints) and retained for 24 hours.
                  required: false
                  example: "4f8b9c2e-1a3d-4b6f-8e0a-2c5d7f9b1e34"
                  schema:
                    type: string
                    minLength: 1
                    maxLength: 255
                    pattern: "^[\\x21-\\x7E]{1,255}$"
            tags:
                - NewsService
            summary: SubmitErrorReport
            description: SubmitErrorReport stores a reader's report that a label or story is wrong, for an operator to review. No account required; rate-limited; never applied automatically.
            operationId: SubmitErrorReport
            security: []
            requestBody:
                content:
                    application/json:
                        example:
                            "contact": "example"
                            "message": "Example WorldMonitor observation."
                            "storyId": "example-id"
                            "url": "https://example.com/worldmonitor"
                        schema:
                            $ref: '#/components/schemas/SubmitErrorReportRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    headers:
                        Idempotency-Key:
                            schema:
                                type: string
                            description: The idempotency key echoed from the request. Present only when the client opted into idempotency.
                        Idempotent-Replayed:
                            schema:
                                type: boolean
                            description: true when this response was replayed from an earlier request with the same key, false on the first (original) request. Present only when the client opted into idempotency.
                    content:
                        application/json:
                            example:
                                "reportId": "example-id"
                                "status": "example"
                            schema:
                                $ref: '#/components/schemas/SubmitErrorReportResponse'
                "400":
                    description: Validation error, invalid Idempotency-Key header, or malformed JSON request body
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - type: object
                                      required:
                                        - error
                                        - message
                                      properties:
                                        error:
                                            type: string
                                        message:
                                            type: string
                                    - $ref: '#/components/schemas/InvalidRequestBodyError'
                "409":
                    description: A request with this Idempotency-Key is still being processed
                    headers:
                        Idempotency-Key:
                            schema:
