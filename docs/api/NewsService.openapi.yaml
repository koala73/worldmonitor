    /api/news/v1/list-country-headlines:
        get:
            tags:
                - NewsService
            summary: ListCountryHeadlines
            description: ListCountryHeadlines reads fresh country reporting from existing RSS caches without fetching publishers or applying dashboard category caps.
            operationId: ListCountryHeadlines
            parameters:
                - name: country_codes
                  in: query
                  description: ISO 3166-1 alpha-2 codes. Repeated query parameter, at most 250 countries.
                  required: true
                  style: form
                  explode: true
                  example:
                      - "US"
                  schema:
                    type: array
                    maxItems: 250
                    minItems: 1
                    items:
                      type: string
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "countries":
                                    "exampleKey":
                                        "items":
                                            - "link": "https://example.com/worldmonitor"
