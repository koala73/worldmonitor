components:
    securitySchemes:
        WorldMonitorKey:
            type: apiKey
            in: header
            name: X-WorldMonitor-Key
            description: User-issued WorldMonitor API key.
        ApiKeyHeader:
            type: apiKey
            in: header
            name: X-Api-Key
            description: Alias header for the WorldMonitor API key (X-WorldMonitor-Key).
        BearerAuth:
            type: http
            scheme: bearer
            description: 'Bearer token: a Clerk-issued JWT for browser session flows, passed as Authorization: Bearer <token>.'
    schemas:
        JmespathProjectionError:
            description: Returned when a REST jmespath projection is invalid or exceeds the expression/output byte limits.
            properties:
                _jmespath_error:
                    description: Projection error discriminator and details.
                    type: string
                original_keys:
                    description: Top-level keys or shape of the unprojected response.
                    items:
                        type: string
                    type: array
            required:
                - _jmespath_error
                - original_keys
            type: object
        UnauthorizedError:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable error message.
            required:
                - error
            description: Returned when the API key is missing, malformed, or lacks current API access.
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        BillingVerificationError:
            type: object
            description: "Returned with HTTP 503 when paid access cannot be confirmed right now: the billing provider is re-verifying a recently expired subscription, or the entitlement backend is unreachable. Retryable — honor Retry-After."
            properties:
                error:
                    type: string
                    description: Human-readable billing-verification failure reason.
                code:
                    type: string
                    enum:
                        - renewal_verification_pending
                        - renewal_verification_failed
                        - entitlement_verification_unavailable
                    description: Machine-readable billing-verification state, mirrored in the X-Billing-Verification response header.
                requiredTier:
                    type: integer
                    format: int32
                    description: Minimum entitlement tier required for this endpoint, when the denial came from a tier gate.
            required:
                - error
                - code
        InvalidRequestBodyError:
            type: object
            description: Returned when a JSON POST request body is empty or malformed.
            properties:
                message:
                    type: string
                    description: Invalid request body
            required:
                - message
        GatewayError:
            type: object
            description: Returned by gateway infrastructure errors before an RPC handler runs, such as origin, routing, method, authentication, or quota checks.
            properties:
                error:
                    oneOf:
                        - type: string
                        - type: object
                          additionalProperties: true
                    description: Gateway error reason or structured gateway failure details.
            required:
                - error
        RateLimitError:
            type: object
            description: Returned when a gateway or handler rate limit rejects the request.
            properties:
                error:
                    type: string
                    description: Human-readable rate-limit failure reason.
            required:
                - error
        ForbiddenError:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable entitlement failure reason.
                code:
                    type: string
                    enum:
                        - subscription_lapsed
                    description: Machine-readable denial code, present when the 403 is a billing-provider-confirmed subscription lapse (mirrored in the X-Billing-Verification response header).
                requiredTier:
                    type: integer
                    format: int32
                    description: Minimum entitlement tier required for this endpoint.
                currentTier:
                    type: integer
                    format: int32
                    description: Caller entitlement tier when known.
                planKey:
                    type: string
                    description: Caller plan key when known.
            required:
                - error
            description: Returned when a PRO-gated endpoint denies access because the caller has no resolved authenticated user, entitlements cannot be verified, or the caller lacks the required entitlement tier.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        GetResilienceScoreRequest:
            type: object
            properties:
                countryCode:
                    type: string
                    description: ISO 3166-1 alpha-2 country code to score.
            required:
                - countryCode
        GetResilienceScoreResponse:
            type: object
            properties:
                countryCode:
                    type: string
                overallScore:
                    type: number
                    format: double
                level:
                    type: string
                domains:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResilienceDomain'
                trend:
                    type: string
                change30d:
                    type: number
                    format: double
                lowConfidence:
                    type: boolean
                imputationShare:
                    type: number
                    format: double
                baselineScore:
                    type: number
                    format: double
                stressScore:
                    type: number
                    format: double
                stressFactor:
                    type: number
                    format: double
                dataVersion:
                    type: string
                scoreInterval:
                    $ref: '#/components/schemas/ScoreInterval'
                pillars:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResiliencePillar'
                schemaVersion:
                    type: string
                    description: |-
                        Phase 2 T2.1/T2.3: "2.0" is the current default (adds pillars; keeps
                         overall_score / baseline_score / etc. populated for backward compat).
                         "1.0" is the legacy opt-out shape (pillars empty) retained for one
                         release cycle. Controlled at response build time by the
                         RESILIENCE_SCHEMA_V2_ENABLED env flag (defaults to "true" → v2).
                headlineEligible:
                    type: boolean
                    description: |-
                        Current headline-ranking eligibility. True only when the country passes
                         the headline gate: coverage >= 0.65 AND (population >= 200k OR
                         coverage >= 0.85) AND !lowConfidence. GetResilienceRanking includes
                         only eligible countries in items[]; scored but ineligible countries
                         remain in greyedOut[]. Raw score endpoints still return the country
                         score when available. Widget and country detail copy should show
                         "Outside headline ranking" when false unless low-confidence is the more
                         specific reason.
        ResilienceDomain:
            type: object
            properties:
                id:
                    type: string
                score:
                    type: number
                    format: double
                weight:
                    type: number
                    format: double
                dimensions:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResilienceDimension'
        ResilienceDimension:
            type: object
            properties:
                id:
                    type: string
                score:
                    type: number
                    format: double
                coverage:
                    type: number
                    format: double
                observedWeight:
                    type: number
                    format: double
                imputedWeight:
                    type: number
                    format: double
                imputationClass:
                    type: string
                    description: |-
                        Four-class imputation taxonomy (Phase 1 T1.7). One of:
                         "stable-absence", "unmonitored", "source-failure", "not-applicable".
                         Empty string when the dimension has any observed data AND is not
                         structurally not-applicable. The "not-applicable" value (plan
                         2026-04-26-001 §U3) is emitted when the dim's construct does not
                         apply to this country (e.g. sovereignFiscalBuffer for non-SWF
                         economies); it is paired with coverage:0 and observed_weight:0 so
                         the dim contributes nothing to the domain mean and is filtered
                         out of user-facing confidence/coverage signals on both server and
                         client. See docs/methodology/country-resilience-index.mdx.
                freshness:
                    $ref: '#/components/schemas/DimensionFreshness'
        DimensionFreshness:
            type: object
            properties:
                lastObservedAtMs:
                    type: string
                    format: int64
                    description: |-
                        Unix milliseconds when the oldest constituent signal in this
                         dimension was last observed (min fetchedAt across INDICATOR_REGISTRY
                         entries for this dimension). 0 when no signal has ever been
                         observed.
                staleness:
                    type: string
                    description: |-
                        Worst staleness level across the dimension's constituent signals,
                         classified by classifyStaleness against each signal's cadence.
                         One of: "fresh", "aging", "stale". Empty string when no signals.
        ScoreInterval:
            type: object
            properties:
                p05:
                    type: number
                    format: double
                p95:
                    type: number
                    format: double
        ResiliencePillar:
            type: object
            properties:
                id:
                    type: string
                    description: '"structural-readiness" | "live-shock-exposure" | "recovery-capacity".'
                score:
                    type: number
                    format: double
                    description: |-
                        Pillar score in [0, 100], mean of member domains weighted by
                         domain.weight * average_dimension_coverage.
                weight:
                    type: number
                    format: double
                    description: 'Pillar weight in the pillar-combined score. Per the plan: 0.40 / 0.35 / 0.25.'
                coverage:
                    type: number
                    format: double
                    description: Coverage in [0, 1], mean of member-domain average dimension coverage.
                domains:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResilienceDomain'
            description: |-
                Phase 2 T2.1/T2.3 of the country-resilience reference-grade upgrade plan.
                 Three-pillar response shape that regroups the 6 ResilienceDomains
                 (economic, infrastructure, energy, social-governance, health-food,
                 recovery) into long-run capacity (structural-readiness), current shock
                 pressure (live-shock-exposure), and recovery capability (recovery-capacity).
                 Pillar scores are real domain-weighted, coverage-scaled aggregates computed
                 from the constituent domains; pillar coverage remains the mean of
                 member-domain average dimension coverage. See _pillar-membership.ts for the mapping.
                 When RESILIENCE_SCHEMA_V2_ENABLED and RESILIENCE_PILLAR_COMBINE_ENABLED
                 are both true, the top-level overall_score on GetResilienceScoreResponse
                 uses the pillar-combined score with the min-pillar penalty term in
                 _shared.ts#penalizedPillarScore. The legacy six-domain weighted aggregate
                 remains the flag-off rollback path.
        GetFoodStocksRequest:
            type: object
            properties:
                countryCode:
                    type: string
                    description: ISO 3166-1 alpha-2, or WORLD. Empty returns the unfiltered snapshot.
                commodity:
                    type: string
                    description: Commodity slug (wheat, corn, rice, soybeans, barley, palmOil). Empty = all.
            description: GetFoodStocksRequest filters the seeded USDA-style food-stocks snapshot.
        GetFoodStocksResponse:
            type: object
            properties:
                records:
                    type: array
                    items:
                        $ref: '#/components/schemas/FoodStockRecord'
                fetchedAt:
                    type: string
                    description: ISO-8601 time the seeder wrote resilience:food-stocks:v1. Empty when unavailable.
                unavailable:
                    type: boolean
                    description: True when the seed is missing or unreadable (not a confirmed zero).
                calorieWeightedStocksToUse:
                    type: number
                    format: double
                    description: Calorie-weighted stocks-to-use for the requested country, or 0 when unknown / unfiltered.
            description: GetFoodStocksResponse is the filtered seed snapshot.
        FoodStockRecord:
            type: object
            properties:
                countryCode:
                    type: string
                    description: ISO 3166-1 alpha-2, or "WORLD" for the global balance sheet.
                commodity:
                    type: string
                    description: 'Commodity slug: wheat, corn, rice, soybeans, barley, palmOil.'
                marketingYear:
                    type: string
                    description: Marketing year label stored verbatim, e.g. "2025/26". Never a calendar year.
                stocksToUse:
                    type: number
                    format: double
                    description: |-
                        Ending stocks divided by total use (0.18 = 18%). Read has_stocks_to_use
                         BEFORE this value: proto3 has no presence for a bare double, so an unknown
                         ratio and a genuine 0% are the same wire value. USDA/PSD estimates ending
                         stocks only for selected countries, so a minor producer routinely reports
                         real production and consumption with no stocks series at all — and 0.0% on
                         a food-security surface reads as famine, not as "not measured".
                hasStocksToUse:
                    type: boolean
                    description: False when stocks_to_use is a placeholder rather than a measurement.
                endingStocksTmt:
                    type: number
                    format: double
                    description: |-
                        Ending stocks in thousand metric tons. Read has_ending_stocks first, for
                         the same reason as stocks_to_use above.
                hasEndingStocks:
                    type: boolean
                    description: False when ending_stocks_tmt is a placeholder rather than a measurement.
                totalUseTmt:
                    type: number
                    format: double
                    description: Total use (consumption + exports) in thousand metric tons.
                productionTmt:
                    type: number
                    format: double
                    description: Production in thousand metric tons. Zero when unknown.
                consumptionTmt:
                    type: number
                    format: double
                    description: Domestic consumption in thousand metric tons. Zero when unknown.
                importsTmt:
                    type: number
                    format: double
                    description: Imports in thousand metric tons. Zero when unknown.
                exportsTmt:
                    type: number
                    format: double
                    description: Exports in thousand metric tons. Zero when unknown.
                unit:
                    type: string
                    description: Unit the raw quantities are stored in, typically "1000 MT".
                source:
                    type: string
                    description: 'Provenance: "psd" or "faostat". FAOSTAT rows never carry stocks.'
            description: One country (or WORLD) × commodity production/stocks balance from the seeded snapshot.
        GetDemographicsCapabilityRequest:
            type: object
            properties:
                countryCode:
                    type: string
                    description: Required ISO 3166-1 alpha-2 country code.
            required:
                - countryCode
        GetDemographicsCapabilityResponse:
            type: object
            properties:
                countryCode:
                    type: string
                available:
                    type: boolean
                    description: True when at least one validated observation exists for the country.
                fetchedAt:
                    type: string
                    description: ISO-8601 time the canonical snapshot was generated.
                stages:
                    type: array
                    items:
                        $ref: '#/components/schemas/DemographicsCapabilityStage'
                ageStructure:
                    $ref: '#/components/schemas/DemographicsAgeStructure'
                education:
                    $ref: '#/components/schemas/DemographicsEducation'
                industrialWorkforce:
                    $ref: '#/components/schemas/DemographicsIndustrialWorkforce'
        DemographicsCapabilityStage:
            type: object
            properties:
                name:
                    type: string
                    description: 'Stable stage name: wpp, education, or ilostat.'
                status:
                    type: string
                    description: Seeder state, normally fresh, retained, or unavailable.
                fetchedAt:
                    type: string
                    description: ISO-8601 time of the data retained for this stage.
                recordCount:
                    type: integer
                    minimum: 0
                    format: int32
                    description: Number of country records retained for the stage.
                newestObservationYear:
                    type: integer
                    minimum: 0
                    format: int32
                    description: Most recent source observation year retained for the stage.
            description: Independent fetch-stage state. One failed stage must not hide healthy groups.
        DemographicsAgeStructure:
            type: object
            properties:
                available:
                    type: boolean
                medianAgeYears:
                    $ref: '#/components/schemas/CapabilityObservation'
                oldAgeDependencyRatioPercent:
                    $ref: '#/components/schemas/CapabilityObservation'
                totalDependencyRatioPercent:
                    $ref: '#/components/schemas/CapabilityObservation'
                workingAgePopulationPeople:
                    $ref: '#/components/schemas/CapabilityObservation'
                workingAgePopulationProjected10yPeople:
                    $ref: '#/components/schemas/CapabilityObservation'
        CapabilityObservation:
            type: object
            properties:
                available:
                    type: boolean
                    description: True only when value, year, source and unit passed the server contract.
                value:
                    type: number
                    format: double
                    description: 'Numeric observation. Read available first: zero is also the proto3 placeholder.'
                year:
                    type: integer
                    minimum: 0
                    format: int32
                    description: Observation year from the source, not the seed run year.
                source:
                    type: string
                    description: Provider or dataset attribution stored with the observation.
                unit:
                    type: string
                    description: Human-readable unit such as "percent", "people", or "years".
            description: CapabilityObservation keeps a measured zero distinct from a missing value.
        DemographicsEducation:
            type: object
            properties:
                available:
                    type: boolean
                tertiaryEnrollmentGrossPercent:
                    $ref: '#/components/schemas/CapabilityObservation'
                stemGraduatesSharePercent:
                    $ref: '#/components/schemas/CapabilityObservation'
                researchersPerMillion:
                    $ref: '#/components/schemas/CapabilityObservation'
        DemographicsIndustrialWorkforce:
            type: object
            properties:
                available:
                    type: boolean
                craftTradesEmploymentPeople:
                    $ref: '#/components/schemas/CapabilityObservation'
                plantMachineOperatorsEmploymentPeople:
                    $ref: '#/components/schemas/CapabilityObservation'
                trainedIndustrialWorkforcePeople:
                    $ref: '#/components/schemas/CapabilityObservation'
                manufacturingEmploymentSharePercent:
                    $ref: '#/components/schemas/CapabilityObservation'
        GetResilienceRankingRequest:
            type: object
        GetResilienceRankingResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResilienceRankingItem'
                greyedOut:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResilienceRankingItem'
                fetchedAt:
                    type: string
                scored:
                    type: integer
                    format: int32
                total:
                    type: integer
                    format: int32
                coverage:
                    type: number
                    format: double
                partial:
                    type: boolean
        ResilienceRankingItem:
            type: object
            properties:
                countryCode:
                    type: string
                overallScore:
                    type: number
                    format: double
                level:
                    type: string
                lowConfidence:
                    type: boolean
                overallCoverage:
                    type: number
                    format: double
                rankStable:
                    type: boolean
                headlineEligible:
                    type: boolean
                    description: |-
                        Current headline-ranking eligibility. True only when the country passes
                         the headline gate: coverage >= 0.65 AND (population >= 200k OR
                         coverage >= 0.85) AND !lowConfidence. GetResilienceRanking includes
                         only eligible countries in items[]; scored but ineligible countries
                         remain in greyedOut[].
        GetResilienceRuntimeManifestRequest:
            type: object
        GetResilienceRuntimeManifestResponse:
            type: object
            properties:
                manifestVersion:
                    type: integer
                    format: int32
                generatedAt:
                    type: string
                deployedCommitSha:
                    type: string
                vercelEnv:
                    type: string
                formulaTag:
                    type: string
                dataVersion:
                    type: string
                flags:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResilienceRuntimeFlag'
                cache:
                    $ref: '#/components/schemas/ResilienceRuntimeCacheState'
                rankingCache:
                    $ref: '#/components/schemas/ResilienceRankingCacheState'
                constructVersions:
                    $ref: '#/components/schemas/ResilienceRuntimeConstructVersions'
                intervals:
                    $ref: '#/components/schemas/ResilienceRuntimeIntervalState'
        ResilienceRuntimeFlag:
            type: object
            properties:
                name:
                    type: string
                enabled:
                    type: boolean
        ResilienceRuntimeCacheState:
            type: object
            properties:
                scorePrefix:
                    type: string
                rankingKey:
                    type: string
                historyPrefix:
                    type: string
                intervalPrefix:
                    type: string
                intervalMethodology:
                    type: string
        ResilienceRankingCacheState:
            type: object
            properties:
                fetchedAt:
                    type: string
                count:
                    type: integer
                    format: int32
                scored:
                    type: integer
                    format: int32
                total:
                    type: integer
                    format: int32
        ResilienceRuntimeConstructVersions:
            type: object
            properties:
                energy:
                    type: string
                    description: 'Safe derived energy construct version. Valid values: "legacy" or "v2".'
                education:
                    type: string
                    description: 'Safe derived education construct version. Valid values: "active" or "rollback".'
        ResilienceRuntimeIntervalState:
            type: object
            properties:
                available:
                    type: boolean
                    description: |-
                        True only when the public sample interval matches the active formula,
                         education construct version, and interval methodology.
                methodology:
                    type: string
                    description: Public methodology tag used to audit scoreInterval/rankStable semantics.
                sampleCountry:
                    type: string
                    description: ISO2 country used for the public availability probe.
                lastObservedAt:
                    type: string
                    description: Latest safe observed timestamp from interval seed-meta or sample payload.
