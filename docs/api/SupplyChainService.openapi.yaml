                    type: integer
                    format: int32
                cargo:
                    type: integer
                    format: int32
                other:
                    type: integer
                    format: int32
                total:
                    type: integer
                    format: int32
                container:
                    type: integer
                    format: int32
                dryBulk:
                    type: integer
                    format: int32
                generalCargo:
                    type: integer
                    format: int32
                roro:
                    type: integer
                    format: int32
                capContainer:
                    type: number
                    format: double
                capDryBulk:
                    type: number
                    format: double
                capGeneralCargo:
                    type: number
                    format: double
                capRoro:
                    type: number
                    format: double
                capTanker:
                    type: number
                    format: double
        FlowEstimate:
            type: object
            properties:
                currentMbd:
                    type: number
                    format: double
                    description: |-
                        Current estimated flow in million barrels/day. Computed as
                         baseline_mbd * flow_ratio.
                baselineMbd:
                    type: number
                    format: double
                    description: |-
                        EIA 2023 annual reference level in million barrels/day for the mapped
                         seven-item live-flow subset.
                flowRatio:
                    type: number
                    format: double
                    description: |-
                        Latest 7-day PortWatch average divided by the preceding rolling baseline
                         window of up to 90 days, clamped to 0.0-1.5.
                disrupted:
                    type: boolean
                    description: |-
                        True when each of the latest 3 daily ratios is below 85% of the same
                         rolling baseline window. Separate from the green/yellow/red status badge.
                source:
                    type: string
                    description: |-
                        Flow source: "portwatch-dwt" when DWT-majority coverage is used,
                         otherwise "portwatch-counts" for vessel-count coverage.
                hazardAlertLevel:
                    type: string
                    description: |-
                        Nearest active GDACS hazard alert level within the configured radius:
                         "RED", "ORANGE", or empty string when no nearby alert applies.
                hazardAlertName:
                    type: string
                    description: |-
                        Name of the nearest active GDACS hazard event within the configured
                         radius, or empty string when no nearby alert applies.
        GetChokepointHistoryRequest:
            type: object
            properties:
                chokepointId:
                    type: string
                    description: Chokepoint identifier whose transit history should be returned.
            required:
                - chokepointId
            description: |-
                GetChokepointHistory returns the transit-count history for a single
                 chokepoint. Loaded lazily on card expand so the main chokepoint-status
                 response can stay compact (no 180-day history per chokepoint).
        GetChokepointHistoryResponse:
            type: object
