                 count 0 with excluded_scored > 0 means the headline is unmeasurable because
                 everything scored was synthetic — the honest signal for a collapsed funnel.
        GetSimulationPackageRequest:
            type: object
            properties:
                runId:
                    type: string
                    description: |-
                        Optional run identifier. Does not select the package — the latest stored package is
                         always returned regardless of this value. When supplied and it differs from the
                         returned package's runId, the response `note` field is populated to warn that per-run
                         filtering is not yet active. Reserved for Phase 3 per-run lookup.
        GetSimulationPackageResponse:
            type: object
            properties:
                found:
                    type: boolean
                runId:
                    type: string
                schemaVersion:
                    type: string
                theaterCount:
                    type: integer
                    format: int32
                generatedAt:
                    type: integer
                    format: int64
                    description: 'Unix timestamp in milliseconds (from Date.now()). Warning: Values > 2^53 may lose precision in JavaScript.. Warning: Values > 2^53 may lose precision in JavaScript'
                note:
                    type: string
                    description: |-
                        Populated when req.runId was supplied but does not match the returned package's runId.
                         Indicates that per-run filtering is not yet active and the latest package was returned instead.
                error:
                    type: string
                    description: |-
                        Populated when the Redis lookup failed. Distinguish from healthy not-found (found=false, error="").
                         Value: "redis_unavailable" on Redis errors.
        GetSimulationOutcomeRequest:
            type: object
            properties:
                runId:
                    type: string
                    examples:
                        - 1789387200000-abc123
                    maxLength: 128
                    pattern: ^([0-9]{13,}-[A-Za-z0-9-]{1,64})?$
                    description: |-
                        Optional run ID (epoch ms, hyphen, 1-64 char suffix; max 128). Returns that
                         run's outcome within 24h retention, processing=true while it is queued, or
                         the latest outcome with a note. Empty returns the latest outcome.
                    example: 1789387200000-abc123
        GetSimulationOutcomeResponse:
            type: object
            properties:
                found:
                    type: boolean
                runId:
                    type: string
                schemaVersion:
                    type: string
                theaterCount:
                    type: integer
                    format: int32
                generatedAt:
                    type: integer
                    format: int64
                    description: 'Unix timestamp in milliseconds (from Date.now()). Warning: Values > 2^53 may lose precision in JavaScript.. Warning: Values > 2^53 may lose precision in JavaScript'
                note:
                    type: string
                    description: |-
                        Populated when req.runId was supplied but does not match the returned outcome's runId,
                         or when the by-run lookup returned a tombstone (Redis transient write failure).
                         Distinguishes "your runId expired beyond 24h retention" from "by-run lookup failed
                         (Redis transient); returned latest" so callers can react differently.
                error:
                    type: string
                    description: |-
                        Populated when the Redis lookup failed. Distinguish from healthy not-found (found=false, error="").
                         Value: "redis_unavailable" on Redis errors.
                theaterSummariesJson:
                    type: string
                    description: |-
                        JSON-encoded array of theater summaries for the UI (populated when found=true).
                         Shape: Array<{ theaterId, theaterLabel, stateKind, topPaths: [{label, summary, confidence, keyActors}], dominantReactions, stabilizers, invalidators }>
                         Parse with JSON.parse() on the client. Empty string when found=false.
                processing:
                    type: boolean
                    description: True when the supplied runId is still queued, as opposed to expired.
                eligibleTheaterCount:
                    type: integer
                    format: int32
                    description: Number of theaters eligible for simulation in the package used by this outcome.
                failedTheaterCount:
                    type: integer
                    format: int32
                    description: Number of eligible theaters that failed before producing a Round 2 result.
                allTheatersFailed:
                    type: boolean
                    description: True when eligible_theater_count > 0 and no theater produced an outcome.
                completionStatus:
                    type: string
                    description: |-
                        Machine-readable completion status. Current values:
                         "completed", "partial", "no_eligible_theaters", or "all_theaters_failed".
        TriggerSimulationRequest:
            type: object
            properties:
                clientVersion:
                    type: string
                    description: Optional client version, such as "mcp-client/0.2". Logged, never stored.
            description: TriggerSimulationRequest enqueues a run for the current simulation package.
        TriggerSimulationResponse:
            type: object
            properties:
                queued:
                    type: boolean
                    description: |-
                        True when the task was newly enqueued; false on idempotency hit or
                         no_package.
                runId:
                    type: string
                    description: |-
                        Server-derived runId from SIMULATION_PACKAGE_LATEST_KEY. Empty
                         string when reason='no_package' (no package pointer was available).
                pkgFingerprint:
                    type: string
                    description: |-
                        Opaque fingerprint of the package key; it changes when the key changes.
                         Empty when reason='no_package'.
                reason:
                    type: string
                    description: |-
                        '' when queued, 'no_package' when no package exists, or 'already-handled'
                         when this cycle's run is already queued or done.
            description: |-
                TriggerSimulationResponse is the HTTP 200 result of an enqueue attempt.
                 Errors return a non-200 status instead.
