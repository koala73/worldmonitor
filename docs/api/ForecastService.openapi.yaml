            description: |-
                Resolution spec that makes a forecast scoreable. kind is "hard" (resolved by
                 comparing metric_key from source_feed to threshold with operator ">=", "<="
                 or "crosses", measured from baseline_value) or "judged" (an LLM judge answers
                 question). kind and deadline are always set; other fields apply per kind.
        GetForecastScorecardRequest:
            type: object
        GetForecastScorecardResponse:
            type: object
