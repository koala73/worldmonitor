    /api/forecast/v1/get-simulation-outcome:
        get:
            tags:
                - ForecastService
            summary: GetSimulationOutcome
            description: |-
                GetSimulationOutcome returns the latest forecast simulation outcome, refreshed
                 about hourly. The response note is set when a supplied runId does not match.
            operationId: GetSimulationOutcome
            parameters:
                - name: runId
                  in: query
                  description: |-
                    Optional run ID (epoch ms, hyphen, 1-64 char suffix; max 128). Returns that
                     run's outcome within 24h retention, processing=true while it is queued, or
                     the latest outcome with a note. Empty returns the latest outcome.
                  required: false
                  "schema":
                      "type": "string"
                      "maxLength": 128
                      "pattern": "^([0-9]{13,}-[A-Za-z0-9-]{1,64})?$"
                      "example": "1789387200000-abc123"
                  example: "1789387200000-abc123"
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "allTheatersFailed": true
                                "completionStatus": "example"
                                "eligibleTheaterCount": 1
                                "error": "example"
                                "failedTheaterCount": 1
                            schema:
                                $ref: '#/components/schemas/GetSimulationOutcomeResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
