    /api/company-monitoring/v1/list-monitored-companies:
        get:
            tags:
                - CompanyMonitoringService
            summary: ListMonitoredCompanies
            description: 'Lists account-scoped monitored companies at a signed snapshot boundary. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.'
            operationId: ListMonitoredCompanies
            parameters:
                - name: lifecycle
                  in: query
                  description: Accepted values are active, paused, and removed.
                  required: false
                  style: form
                  explode: true
                  example:
                      - "active"
                  schema:
                    type: array
                    items:
                        type: "string"
                        pattern: "^(?:active|paused|removed|MONITORED_COMPANY_LIFECYCLE_(?:ACTIVE|PAUSED|REMOVED))$"
                        description: "Accepted values are active, paused, and removed."
                - name: coverage
                  in: query
                  description: Accepted values are awaiting_first_scan, adequate, partial, stale, unavailable, and needs_confirmation.
                  required: false
                  style: form
                  explode: true
                  example:
                      - "awaiting_first_scan"
                  schema:
                    type: array
                    items:
                        type: "string"
                        pattern: "^(?:awaiting_first_scan|adequate|partial|stale|unavailable|needs_confirmation|COMPANY_COVERAGE_STATE_(?:AWAITING_FIRST_SCAN|ADEQUATE|PARTIAL|STALE|UNAVAILABLE|NEEDS_CONFIRMATION))$"
                        description: "Accepted values are awaiting_first_scan, adequate, partial, stale, unavailable, and needs_confirmation."
                - name: page_size
                  in: query
                  description: Maximum rows to return, from 1 through 100; zero requests the server default.
                  required: false
                  example: 25
                  schema:
                    type: integer
                    format: int32
                - name: cursor
                  in: query
                  description: Signed opaque cursor bound to the account, filters, mode, expiry, and snapshot generation; never a storage identifier.
                  required: false
                  example: "cmc1.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                  schema:
                    type: string
                    pattern: '^cmc1\.[A-Za-z0-9_-]{16,1000}[A-Za-z0-9_-]{0,536}\.[A-Za-z0-9_-]{43}$'
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "companies":
                                    - "canonicalUrl": "https://example.com/worldmonitor"
                                      "claims":
                                          - "allowedUses":
                                              - "COMPANY_CLAIM_ALLOWED_USE_DISCOVERY"
                                            "claimId": "cm_claim_01ARZ3NDEKTSV4RRFFQ69G5FAV"
                                            "expiresAt": "2026-01-15T12:00:00Z"
                                            "provenance": "example"
                                            "trustState": "COMPANY_CLAIM_TRUST_STATE_DECLARED"
                                      "companyId": "cm_company_01ARZ3NDEKTSV4RRFFQ69G5FAV"
                                      "coverage": "COMPANY_COVERAGE_STATE_AWAITING_FIRST_SCAN"
                                      "createdAt": "2026-01-15T12:00:00Z"
                                "nextCursor": "cmc1.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                                "snapshot":
                                    "pollCursor": "cmc1.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                                    "snapshotAsOf": "example"
                                    "snapshotGeneration": "1717200000000"
                            schema:
                                $ref: '#/components/schemas/ListMonitoredCompaniesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "401":
                    description: Missing or invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                "403":
                    description: API access requires an active subscription (the API key's subscription is inactive or expired).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
