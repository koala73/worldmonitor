    /api/company-monitoring/v1/list-company-event-impacts:
        get:
            tags:
                - CompanyMonitoringService
            summary: ListCompanyEventImpacts
            description: 'Lists account-scoped material impacts with independent direction, confidence, and lifecycle fields. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.'
            operationId: ListCompanyEventImpacts
            parameters:
                - name: company_id
                  in: query
                  description: Account-scoped logical company IDs to include; storage identifiers are not accepted.
                  required: false
                  style: form
                  explode: true
                  example:
                      - "cm_company_01ARZ3NDEKTSV4RRFFQ69G5FAV"
                  schema:
                    type: array
                    items:
                        type: "string"
                        pattern: "^cm_company_[0-9A-HJKMNP-TV-Z]{26}$"
                - name: direction
                  in: query
                  description: Accepted values are positive, negative, and mixed.
                  required: false
                  style: form
                  explode: true
                  example:
                      - "positive"
                  schema:
                    type: array
                    items:
                        type: "string"
                        pattern: "^(?:positive|negative|mixed|MATERIAL_IMPACT_DIRECTION_(?:POSITIVE|NEGATIVE|MIXED))$"
                        description: "Accepted values are positive, negative, and mixed."
                - name: lifecycle
                  in: query
                  description: Accepted values are admitted, corrected, and retracted.
                  required: false
                  style: form
                  explode: true
                  example:
                      - "admitted"
                  schema:
                    type: array
                    items:
                        type: "string"
                        pattern: "^(?:admitted|corrected|retracted|MATERIAL_IMPACT_LIFECYCLE_(?:ADMITTED|CORRECTED|RETRACTED))$"
                        description: "Accepted values are admitted, corrected, and retracted."
                - name: page_size
                  in: query
                  description: Maximum rows to return, from 1 through 100; zero requests the server default.
                  required: false
                  example: 25
                  schema:
                    type: integer
                    format: int32
                - name: cursor
                  in: query
                  description: Signed opaque cursor bound to the account, filters, mode, expiry, and snapshot generation; never a storage identifier.
                  required: false
                  example: "cmc1.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
