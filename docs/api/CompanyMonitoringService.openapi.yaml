    /api/company-monitoring/v1/import-monitored-company-batch:
        post:
            tags:
                - CompanyMonitoringService
            summary: ImportMonitoredCompanyBatch
            description: 'Imports up to 100 normalized account-scoped company rows with deterministic per-row outcomes. Requires company_monitoring:write; runtime remains disabled until dependency #6003 passes.'
            operationId: ImportMonitoredCompanyBatch
            requestBody:
                content:
                    application/json:
                        example:
                            "clientImportId": "example-id"
                            "contractVersion": "cm-import-v1"
                            "rows":
                                - "company":
                                    "aliases":
                                        - "example"
                                    "customerReference": "example"
                                    "domains":
                                        - "example.com"
                                    "domicileCountry": "DOMICILE_COUNTRY_US"
                                    "identifiers":
                                        - "example-id"
                                    "locations":
                                        - "example"
                                    "name": "WorldMonitor Analyst"
                                  "ordinal": 0
                        schema:
                            $ref: '#/components/schemas/ImportMonitoredCompanyBatchRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "createdCount": 1
                                "rejectedCount": 1
                                "replayedCount": 1
                                "results":
                                    - "companyId": "cm_company_01ARZ3NDEKTSV4RRFFQ69G5FAV"
                                      "ordinal": 0
                                      "outcome": "COMPANY_IMPORT_ROW_OUTCOME_CREATED"
                                      "reasonCode": "example"
                            schema:
                                $ref: '#/components/schemas/ImportMonitoredCompanyBatchResponse'
                "400":
