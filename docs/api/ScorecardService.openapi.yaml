                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "computedAt": "2026-01-15T12:00:00Z"
                                "methodologyVersion": "example"
                                "scorecards":
                                    - "computedAt": "2026-01-15T12:00:00Z"
                                      "countryCode": "US"
                                      "methodologyVersion": "example"
                                      "pillars":
                                          - "aggregationMethod": "example"
                                            "band": "example"
                                            "excludedMembers":
                                                - "countryCode": "US"
                                                  "reason": "example"
                                            "hasScore": true
                                            "includedMembers":
                                                - "example"
                                "unavailable": false
                                "unavailableReason": "example"
                            schema:
                                $ref: '#/components/schemas/ListFiveFactorScorecardsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "401":
                    description: Missing or invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                "403":
                    description: PRO entitlement access denied.
                    headers:
                        X-Billing-Verification:
                            description: Present when the 403 is a billing-provider-confirmed subscription lapse (value subscription_lapsed, matching the body `code`).
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                "503":
                    description: Service unavailable. Billing-verification responses include code and X-Billing-Verification; other gateway infrastructure failures use the generic GatewayError shape.
                    headers:
                        Retry-After:
                            description: Seconds to wait before retrying (1-60).
                            schema:
                                type: string
                        X-Billing-Verification:
                            description: Billing-verification state that produced this response (matches the body `code`).
                            schema:
                                type: string
                        X-Validation-Mode:
                            description: Present with value degraded when user API-key validation is temporarily unavailable.
                            schema:
                                type: string
                        X-RateLimit-Mode:
                            description: Present with value degraded when a fail-closed rate-limit dependency is unavailable.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/BillingVerificationError'
                                    - $ref: '#/components/schemas/GatewayError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
    /api/scorecard/v1/get-bloc-scorecard:
        get:
            tags:
                - ScorecardService
            summary: GetBlocScorecard
            description: PRO-gated. Requires entitlement tier >= 1.
            operationId: GetBlocScorecard
            security:
                - WorldMonitorKey: []
                - ApiKeyHeader: []
                - BearerAuth: []
            parameters:
                - name: preset
                  in: query
                  description: 'Official bloc preset: eu, nato, asean, or brics. Omit when members is provided.'
                  required: false
                  example: "example"
                  schema:
                    type: string
                - name: members
                  in: query
                  description: Custom ISO 3166-1 alpha-2 country members. Omit when preset is provided.
                  required: false
                  style: form
                  explode: true
                  example:
                      - "US"
                  schema:
                    type: array
                    items:
                        type: string
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "scorecard":
                                    "computedAt": "2026-01-15T12:00:00Z"
                                    "excludedMembers":
                                        - "countryCode": "US"
                                          "reason": "example"
                                    "id": "example-id"
                                    "includedMembers":
                                        - "example"
                                    "label": "example"
                                "unavailable": false
                                "unavailableReason": "example"
                            schema:
                                $ref: '#/components/schemas/GetBlocScorecardResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "401":
                    description: Missing or invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                "403":
                    description: PRO entitlement access denied.
                    headers:
                        X-Billing-Verification:
                            description: Present when the 403 is a billing-provider-confirmed subscription lapse (value subscription_lapsed, matching the body `code`).
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                "503":
                    description: Service unavailable. Billing-verification responses include code and X-Billing-Verification; other gateway infrastructure failures use the generic GatewayError shape.
                    headers:
                        Retry-After:
                            description: Seconds to wait before retrying (1-60).
                            schema:
                                type: string
                        X-Billing-Verification:
                            description: Billing-verification state that produced this response (matches the body `code`).
                            schema:
                                type: string
                        X-Validation-Mode:
                            description: Present with value degraded when user API-key validation is temporarily unavailable.
                            schema:
                                type: string
                        X-RateLimit-Mode:
                            description: Present with value degraded when a fail-closed rate-limit dependency is unavailable.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/BillingVerificationError'
                                    - $ref: '#/components/schemas/GatewayError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
components:
    securitySchemes:
        WorldMonitorKey:
            type: apiKey
            in: header
            name: X-WorldMonitor-Key
            description: User-issued WorldMonitor API key.
        ApiKeyHeader:
            type: apiKey
            in: header
            name: X-Api-Key
            description: Alias header for the WorldMonitor API key (X-WorldMonitor-Key).
        BearerAuth:
            type: http
            scheme: bearer
            description: 'Bearer token: a Clerk-issued JWT for browser session flows, passed as Authorization: Bearer <token>.'
    schemas:
        JmespathProjectionError:
            description: Returned when a REST jmespath projection is invalid or exceeds the expression/output byte limits.
            properties:
                _jmespath_error:
                    description: Projection error discriminator and details.
                    type: string
                original_keys:
                    description: Top-level keys or shape of the unprojected response.
                    items:
                        type: string
                    type: array
            required:
                - _jmespath_error
                - original_keys
            type: object
        UnauthorizedError:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable error message.
            required:
                - error
            description: Returned when the API key is missing, malformed, or lacks current API access.
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        BillingVerificationError:
            type: object
            description: "Returned with HTTP 503 when paid access cannot be confirmed right now: the billing provider is re-verifying a recently expired subscription, or the entitlement backend is unreachable. Retryable — honor Retry-After."
            properties:
                error:
                    type: string
                    description: Human-readable billing-verification failure reason.
                code:
                    type: string
                    enum:
                        - renewal_verification_pending
                        - renewal_verification_failed
                        - entitlement_verification_unavailable
                    description: Machine-readable billing-verification state, mirrored in the X-Billing-Verification response header.
                requiredTier:
                    type: integer
                    format: int32
                    description: Minimum entitlement tier required for this endpoint, when the denial came from a tier gate.
            required:
                - error
                - code
        InvalidRequestBodyError:
            type: object
            description: Returned when a JSON POST request body is empty or malformed.
            properties:
                message:
                    type: string
                    description: Invalid request body
            required:
                - message
        GatewayError:
            type: object
            description: Returned by gateway infrastructure errors before an RPC handler runs, such as origin, routing, method, authentication, or quota checks.
            properties:
                error:
                    oneOf:
                        - type: string
                        - type: object
                          additionalProperties: true
                    description: Gateway error reason or structured gateway failure details.
            required:
                - error
        RateLimitError:
            type: object
            description: Returned when a gateway or handler rate limit rejects the request.
            properties:
                error:
                    type: string
                    description: Human-readable rate-limit failure reason.
            required:
                - error
        ForbiddenError:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable entitlement failure reason.
                code:
                    type: string
                    enum:
                        - subscription_lapsed
                    description: Machine-readable denial code, present when the 403 is a billing-provider-confirmed subscription lapse (mirrored in the X-Billing-Verification response header).
                requiredTier:
                    type: integer
                    format: int32
                    description: Minimum entitlement tier required for this endpoint.
                currentTier:
                    type: integer
                    format: int32
                    description: Caller entitlement tier when known.
                planKey:
                    type: string
                    description: Caller plan key when known.
            required:
                - error
            description: Returned when a PRO-gated endpoint denies access because the caller has no resolved authenticated user, entitlements cannot be verified, or the caller lacks the required entitlement tier.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        GetFiveFactorScorecardRequest:
            type: object
            properties:
                countryCode:
                    type: string
                    description: ISO 3166-1 alpha-2 country code for the requested scorecard.
        GetFiveFactorScorecardResponse:
            type: object
            properties:
                scorecard:
                    $ref: '#/components/schemas/FiveFactorCountryScorecard'
                unavailable:
                    type: boolean
                unavailableReason:
                    type: string
        FiveFactorCountryScorecard:
            type: object
            properties:
                countryCode:
                    type: string
                methodologyVersion:
                    type: string
                computedAt:
                    type: string
                pillars:
                    type: array
                    items:
                        $ref: '#/components/schemas/FiveFactorPillar'
        FiveFactorPillar:
            type: object
            properties:
                pillar:
                    type: string
                hasScore:
                    type: boolean
                score:
                    type: integer
                    format: int32
                subScore:
                    type: number
                    format: double
                band:
                    type: string
                inputCoverage:
                    type: number
                    format: double
                aggregationMethod:
                    type: string
                inputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/ScorecardEvidence'
                insufficientReasons:
                    type: array
                    items:
                        type: string
                includedMembers:
                    type: array
                    items:
                        type: string
                excludedMembers:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExcludedBlocMember'
        ScorecardEvidence:
            type: object
            properties:
                inputId:
                    type: string
                available:
                    type: boolean
                value:
                    type: number
                    format: double
                hasValue:
                    type: boolean
                year:
                    type: integer
                    format: int32
                unit:
                    type: string
                source:
                    type: string
                sourceKey:
                    type: string
                unavailableReason:
                    type: string
                quality:
                    type: string
                observations:
                    type: array
                    items:
                        $ref: '#/components/schemas/ScorecardObservation'
        ScorecardObservation:
            type: object
            properties:
                name:
                    type: string
                value:
                    type: number
                    format: double
                year:
                    type: integer
                    format: int32
                unit:
                    type: string
                source:
                    type: string
                indicatorCode:
                    type: string
        ExcludedBlocMember:
            type: object
            properties:
                countryCode:
                    type: string
                reason:
                    type: string
        ListFiveFactorScorecardsRequest:
            type: object
        ListFiveFactorScorecardsResponse:
            type: object
            properties:
                scorecards:
                    type: array
                    items:
                        $ref: '#/components/schemas/FiveFactorCountryScorecard'
                unavailable:
                    type: boolean
                unavailableReason:
                    type: string
                methodologyVersion:
                    type: string
                computedAt:
                    type: string
        GetBlocScorecardRequest:
            type: object
            properties:
                preset:
                    type: string
                    description: 'Official bloc preset: eu, nato, asean, or brics. Omit when members is provided.'
                members:
                    type: array
                    items:
                        type: string
                        description: Custom ISO 3166-1 alpha-2 country members. Omit when preset is provided.
        GetBlocScorecardResponse:
            type: object
            properties:
                scorecard:
                    $ref: '#/components/schemas/FiveFactorBlocScorecard'
                unavailable:
                    type: boolean
                unavailableReason:
                    type: string
        FiveFactorBlocScorecard:
            type: object
            properties:
                id:
                    type: string
                label:
                    type: string
                methodologyVersion:
                    type: string
                computedAt:
                    type: string
                members:
                    type: array
                    items:
                        type: string
                includedMembers:
                    type: array
                    items:
                        type: string
                excludedMembers:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExcludedBlocMember'
                pillars:
                    type: array
                    items:
                        $ref: '#/components/schemas/FiveFactorPillar'
