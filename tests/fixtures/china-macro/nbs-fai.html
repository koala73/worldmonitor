  <body>
    <p>From January to June 2026, the national investment in fixed assets (excluding rural households) was 22,637 billion yuan, a year-on-year decrease of 5.7% (calculated on a comparable basis).</p>
    <p>On a month-on-month basis, the investment in fixed assets decreased by 0.37% in June.</p>
