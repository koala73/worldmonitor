<div id="ivs_content"><p class="MsoNormal" style="text-indent: 21.0000pt; mso-char-indent-count: 2.0000; text-autospace: ideograph-numeric; mso-pagination: none;"><span style="mso-spacerun: 'yes'; font-family: 宋体; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'; font-size: 10.5000pt; mso-font-kerning: 1.0000pt;"><span style="font-family: Times New Roman;">8</span><span style="font-family: 宋体;">月末，广义货币</span><span style="font-family: Times New Roman;">(M2)</span><span style="font-family: 宋体;">余额</span><span style="font-family: Times New Roman;">356.81</span><span style="font-family: 宋体;">万亿元，同比增长</span><span style="font-family: Times New Roman;">7.5%</span><span style="font-family: 宋体;">。狭义货币</span><span style="font-family: Times New Roman;">(M1)</span><span style="font-family: 宋体;">余额</span><span style="font-family: Times New Roman;">115.77</span><span style="font-family: 宋体;">万亿元，同比增长</span><span style="font-family: Times New Roman;">4.1%</span><span style="font-family: 宋体;">。流通中货币</span><span style="font-family: Times New Roman;">(M0)</span><span style="font-family: 宋体;">余额</span><span style="font-family: Times New Roman;">14.83</span><span style="font-family: 宋体;">万亿元，同比增长</span><span style="font-family: Times New Roman;">11.2%</span><span style="font-family: 宋体;">。前八个月净投放现金</span><span style="font-family: Times New Roman;">7364</span><span style="font-family: 宋体;">亿元。</span></span></p></div>
