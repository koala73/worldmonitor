[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -c /tmp/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worldmonitor-api]
command=node /app/local-api-server.mjs
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; God's Eye View's 24 upstream proxies (OpenSky, CelesTrak, CCTV, AIS, TomTom,
; FIRMS, Overpass, terrain, OpenAI realtime, ...), served under /api/gev/*.
; A separate process from worldmonitor-api on purpose: it is vendored upstream
; code brokering a different set of credentials, and a crash in one should not
; take the other's routes down. nginx routes /api/gev/ here; everything else
; goes to worldmonitor-api. Bundled self-contained by
; scripts/build-gev-api.mjs, so it needs no node_modules.
[program:gev-api]
command=node /app/gev-api-server.mjs
directory=/app
autostart=true
autorestart=true
environment=GEV_API_PORT="46124",GEV_API_HOST="127.0.0.1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
