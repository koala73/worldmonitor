name: Weekly Search Console Snapshot

# Collects the weekly Search Console snapshot (#8606) and opens or updates a
# review PR with it. The snapshot answers which URLs Google declined and why,
# and which families earn impressions per indexed page. The same PR carries
# the Bing Webmaster snapshot (#10024) when BING_WEBMASTER_API_KEY is set, and
# the Umami referral snapshot when UMAMI_API_USERNAME and UMAMI_API_PASSWORD are.
# It also asks AI models a fixed set of buyer questions through answerrank and
# records how often they name World Monitor (answerrank/<date>.json), when
# OPENROUTER_API_KEY, ANTHROPIC_API_KEY and EXA_API_KEY are set. That runs in
# its own read-only job, because it executes third-party code; the collect job
# takes its snapshot as an artifact. A significant drop since the last
# comparable week opens an issue, so a regression does not hide inside a PR
# that merges itself.
# Last, it regenerates the AI-visibility baseline and scorecard from whichever
# snapshots this run wrote, so no export is supplied by hand.
#
# Gated on the credential. Until the owner creates the service account and adds
# GSC_SERVICE_ACCOUNT_JSON plus GSC_PROPERTY, the guard job reports that the run
# was skipped and the collect job never starts. A missing secret is a pending
# prerequisite, not a failure, so this workflow stays green in the meantime.
#
# It opens the PR with REVIEW_PR_TOKEN and arms auto-merge, so the PR merges
# itself once the required checks pass.

on:
  schedule:
    - cron: '17 5 * * 2'
  workflow_dispatch:

permissions: {}

env:
  # The pinned answerrank commit, recorded in each AI-answer snapshot. A
  # different commit starts a new comparison series. The collect job checks
  # the artifact against it too.
  ANSWERRANK_REVISION: 7bcc853840cf05a92eed6926a3d012fef371753a

concurrency:
  group: seo-gsc-weekly
  cancel-in-progress: false

jobs:
  guard:
    if: (github.event_name != 'schedule' || github.repository == 'koala73/worldmonitor')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      week_pr: ${{ steps.week.outputs.pr }}
    steps:
      - name: Check for the Search Console credential
        id: check
        env:
          # Secrets cannot be read from a job-level condition, so the gate is a
          # step that publishes a plain output the collect job depends on.
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
        run: |
          if [ -z "${GSC_SERVICE_ACCOUNT_JSON:-}" ] || [ -z "${GSC_PROPERTY:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping: GSC_SERVICE_ACCOUNT_JSON and GSC_PROPERTY are not both configured. See issue 8606 for the owner prerequisites."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Find this week's PR
        id: week
        if: steps.check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.REVIEW_PR_TOKEN }}
        run: |
          # Same rule as the collect job: an open or merged PR from this
          # repository means this week is done, so the AI-answer job spends
          # nothing on a rerun. It lives here because the answerrank job runs
          # third-party code and gets no PR access.
          branch="automation/seo-gsc-$(date -u +%G-W%V)"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100&head=${GITHUB_REPOSITORY_OWNER}:${branch}" \
            --jq '[.[] | select(.state == "open" or .merged_at != null)][0].number // empty')
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"

  # Runs answerrank, which is third-party code, with a read-only token and no
  # credential left in the checkout. Its only output is the snapshot artifact.
  answerrank:
    needs: guard
    permissions:
      contents: read
    if: ${{ (needs.guard.outputs.enabled == 'true') && (github.event_name != 'schedule' || github.repository == 'koala73/worldmonitor') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      date: ${{ steps.plan.outputs.date }}
      state: ${{ steps.done.outputs.state || steps.plan.outputs.state }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Plan the AI-answer run
        id: plan
        env:
          WEEK_PR: ${{ needs.guard.outputs.week_pr }}
          # Read only to test presence. The install step that runs third-party
          # code never sees them.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          if [ -z "${OPENROUTER_API_KEY:-}" ] || [ -z "${ANTHROPIC_API_KEY:-}" ] || [ -z "${EXA_API_KEY:-}" ]; then
            echo "state=no-keys" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the AI-answer snapshot: OPENROUTER_API_KEY, ANTHROPIC_API_KEY and EXA_API_KEY are not all configured."
            exit 0
          fi
          # The guard job found this week's PR, if any (see "Find this week's PR").
          if [ -n "${WEEK_PR:-}" ]; then
            echo "state=week-done" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the AI-answer run: PR ${WEEK_PR} already covers this week."
            exit 0
          fi
          echo "state=run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.state == 'run'
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        if: steps.plan.outputs.state == 'run'
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.plan.outputs.state == 'run'
        with:
          python-version: '3.13'
      - name: Install answerrank
        if: steps.plan.outputs.state == 'run'
        # No secrets in this step. answerrank has no releases, so it is fetched
        # by commit, and every dependency is a hash-pinned wheel from
        # inputs/requirements.txt, which is part of the series digest.
        run: |
          python -m venv "$RUNNER_TEMP/answerrank"
          "$RUNNER_TEMP/answerrank/bin/pip" install --quiet --require-hashes --only-binary :all: --no-deps \
            -r docs/research/seo-ai-visibility/answerrank/inputs/requirements.txt
          src="$RUNNER_TEMP/answerrank-src"
          git init --quiet "$src"
          git -C "$src" fetch --quiet --depth 1 https://github.com/misbahsy/answerrank.git "$ANSWERRANK_REVISION"
          git -C "$src" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$ANSWERRANK_REVISION"
          printf '#!/bin/sh\nPYTHONPATH="%s/src" exec "%s/bin/python" -m answerrank "$@"\n' "$src" "$RUNNER_TEMP/answerrank" > "$RUNNER_TEMP/answerrank-bin"
          chmod +x "$RUNNER_TEMP/answerrank-bin"
          "$RUNNER_TEMP/answerrank-bin" --help > /dev/null
      - name: Collect the AI-answer snapshot
        if: steps.plan.outputs.state == 'run'
        # About 200 model calls at concurrency 1: roughly 30 minutes and $8.
        timeout-minutes: 50
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SNAPSHOT_DATE: ${{ steps.plan.outputs.date }}
        run: ANSWERRANK_BIN="$RUNNER_TEMP/answerrank-bin" node scripts/seo-answerrank-collect.mjs --live --date "$SNAPSHOT_DATE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.plan.outputs.state == 'run'
        with:
          name: answerrank-snapshot
          path: |
            docs/research/seo-ai-visibility/answerrank/${{ steps.plan.outputs.date }}.json
            docs/research/seo-ai-visibility/answerrank/${{ steps.plan.outputs.date }}.md
          if-no-files-found: error
          retention-days: 14
      - name: Mark the snapshot collected
        id: done
        if: steps.plan.outputs.state == 'run'
        run: echo "state=collected" >> "$GITHUB_OUTPUT"

  collect:
    # !cancelled(): a failed AI-answer job must not stop the Search Console
    # PR, but a cancelled run stops here.
    needs: [guard, answerrank]
    # Only this job pushes the weekly branch and opens its PR.
    permissions:
      contents: write
      pull-requests: write
      # Only for the issue opened when AI-answer visibility declines.
      issues: write
    if: ${{ !cancelled() && (needs.guard.outputs.enabled == 'true') && (github.event_name != 'schedule' || github.repository == 'koala73/worldmonitor') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      branch: ${{ steps.reconcile.outputs.branch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # A workflow_dispatch can target a feature branch; publication always
          # branches from main so the review PR stays free of unrelated commits.
          ref: refs/heads/main
      - name: Reconcile the weekly review branch
        id: reconcile
        env:
          # A PR opened with the Actions token gets no CI, so the required
          # checks never report and the PR waits for a human. REVIEW_PR_TOKEN
          # opens it with CI and arms auto-merge; review-pr-token-check.yml
          # alarms before it expires.
          GH_TOKEN: ${{ secrets.REVIEW_PR_TOKEN }}
        run: |
          # ISO year-week keys the branch, so a rerun in the same week updates
          # that week rather than opening a second PR.
          period=$(date -u +%G-W%V)
          branch="automation/seo-gsc-${period}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          # Only an open or merged PR means this week is done. A closed one was
          # rejected, so the week is collected again.
          # A fork PR can carry the same head branch name, so the lookup asks
          # GitHub only for heads in this repository's owner; filtering forks
          # out of a fixed-size page would let enough fork PRs hide this one.
          existing_pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100&head=${GITHUB_REPOSITORY_OWNER}:${branch}" \
            --jq '[.[] | select(.state == "open" or .merged_at != null)][0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Search Console PR ${existing_pr} already exists for ${period}."
            # Re-arm auto-merge in case the run that opened the PR failed to.
            # A merged, closed or draft PR is left alone.
            if [ "$(gh pr view "$existing_pr" --json state,isDraft,isCrossRepository --jq '.state == "OPEN" and (.isDraft | not) and (.isCrossRepository | not)')" = "true" ]; then
              gh pr merge --auto --squash "$existing_pr"
            fi
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.reconcile.outputs.skip != 'true'
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        if: steps.reconcile.outputs.skip != 'true'
        run: npm ci --ignore-scripts
      - name: Collect the snapshot
        id: collect
        if: steps.reconcile.outputs.skip != 'true'
        env:
          # The collector reads these through loadEnvFile, which falls through
          # to process.env, and never prints either value. The snapshot writer
          # refuses to emit a file containing the property identifier.
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
        run: node scripts/seo-gsc-collect.mjs --live
      - name: Collect the Bing Webmaster snapshot
        id: bing
        if: steps.collect.outcome == 'success'
        # Bing is a second source in the same PR, not a gate on it: a missing
        # key skips this step and a Bing failure leaves the Search Console
        # snapshot to ship on its own.
        continue-on-error: true
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          if [ -z "${BING_WEBMASTER_API_KEY:-}" ]; then
            echo "::notice::Skipping Bing: BING_WEBMASTER_API_KEY is not configured. See issue 10024."
            exit 0
          fi
          node scripts/seo-bing-collect.mjs --live
      - name: Collect the Umami referral snapshot
        id: umami
        if: steps.collect.outcome == 'success'
        # Optional and non-blocking, like Bing. The self-hosted instance takes
        # one to two minutes per 28-day query, so this step has its own bound.
        continue-on-error: true
        timeout-minutes: 25
        env:
          UMAMI_API_USERNAME: ${{ secrets.UMAMI_API_USERNAME }}
          UMAMI_API_PASSWORD: ${{ secrets.UMAMI_API_PASSWORD }}
        run: |
          if [ -z "${UMAMI_API_USERNAME:-}" ] || [ -z "${UMAMI_API_PASSWORD:-}" ]; then
            echo "::notice::Skipping Umami: UMAMI_API_USERNAME and UMAMI_API_PASSWORD are not both configured. See issue 10024."
            exit 0
          fi
          node scripts/seo-umami-collect.mjs --live
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: answerrank_download
        if: steps.collect.outcome == 'success' && needs.answerrank.outputs.state == 'collected'
        continue-on-error: true
        with:
          name: answerrank-snapshot
          path: ${{ runner.temp }}/answerrank-artifact
      - name: Add the AI-answer snapshot
        id: answerrank_add
        if: steps.answerrank_download.outcome == 'success'
        # The artifact comes from the job that ran third-party code, so none of
        # it is copied. --accept rebuilds the snapshot from its measured fields
        # (every count type-checked; labels, digest, revision and judge matched
        # against the committed inputs), recomputes the comparison against the
        # committed earlier weeks, and writes its own markdown.
        continue-on-error: true
        env:
          SNAPSHOT_DATE: ${{ needs.answerrank.outputs.date }}
        run: |
          src="$RUNNER_TEMP/answerrank-artifact"
          test "$(find "$src" -type f | wc -l)" -eq 2
          node scripts/seo-answerrank-collect.mjs --accept "$src/${SNAPSHOT_DATE}.json" --date "$SNAPSHOT_DATE"
      - name: Regenerate the AI-visibility baseline and scorecard
        id: baseline
        if: steps.collect.outcome == 'success'
        # Derived from the snapshots above, so it needs no credential. A failure
        # writes neither file and leaves the snapshots to ship on their own.
        continue-on-error: true
        run: node scripts/seo-weekly-baseline.mjs --date "$(date -u +%F)"
      - name: Verify the snapshot contract
        if: steps.collect.outcome == 'success'
        run: |
          node --import tsx --test --test-concurrency=1 \
            tests/seo-gsc-collector.test.mjs \
            tests/seo-bing-collector.test.mjs \
            tests/seo-umami-collector.test.mjs \
            tests/seo-answerrank-collector.test.mjs \
            tests/seo-url-taxonomy.test.mjs \
            tests/seo-weekly-baseline.test.mjs
      - name: Open the weekly snapshot PR
        id: pr
        if: steps.collect.outcome == 'success'
        env:
          # Same token as the reconcile step, for the same reasons.
          GH_TOKEN: ${{ secrets.REVIEW_PR_TOKEN }}
          BRANCH_NAME: ${{ steps.reconcile.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BING_OUTCOME: ${{ steps.bing.outcome }}
          UMAMI_OUTCOME: ${{ steps.umami.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          ANSWERRANK_RESULT: ${{ needs.answerrank.result }}
          ANSWERRANK_STATE: ${{ needs.answerrank.outputs.state }}
          ANSWERRANK_ADD_OUTCOME: ${{ steps.answerrank_add.outcome }}
          ANSWERRANK_DATE: ${{ needs.answerrank.outputs.date }}
        run: |
          snapshot_date=$(date -u +%F)
          git switch -c "$BRANCH_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An optional source that skipped or failed writes no directory, and
          # git add refuses a missing pathspec, so stage only what exists.
          for source in gsc bing umami answerrank baselines scorecards; do
            if [ -d "docs/research/seo-ai-visibility/${source}" ]; then
              git add "docs/research/seo-ai-visibility/${source}"
            fi
          done
          if git diff --cached --quiet; then
            echo "::notice::The collector produced no change to commit."
            exit 0
          fi
          git commit -m "chore(seo): Search Console snapshot ${snapshot_date} (#8606)"
          # The branch belongs to this workflow and is rebuilt from main on every
          # run. A branch left behind by a run whose PR step failed, or by a
          # closed PR, is replaced rather than rejected as non-fast-forward.
          git push --force --set-upstream origin "$BRANCH_NAME"
          if [ "$BING_OUTCOME" = "failure" ]; then
            bing_note="The Bing Webmaster collection failed in this run, so this PR carries the Search Console snapshot only. See the run log."
          elif [ -f "docs/research/seo-ai-visibility/bing/${snapshot_date}.json" ]; then
            bing_note="Also carries the Bing Webmaster snapshot. Its totals come from daily site rows; its query and page sums are top-100-per-week, not totals."
          else
            bing_note="No Bing Webmaster snapshot this week: BING_WEBMASTER_API_KEY is not configured."
          fi
          if [ "$UMAMI_OUTCOME" = "failure" ]; then
            umami_note="The Umami referral collection failed in this run. See the run log."
          elif [ -f "docs/research/seo-ai-visibility/umami/${snapshot_date}.json" ]; then
            umami_note="Also carries the Umami referral snapshot: visitors by channel and by referrer family over the 28 complete days before the run. Channel and referrer rows overlap, so their sums are not totals."
          else
            umami_note="No Umami referral snapshot this week: UMAMI_API_USERNAME and UMAMI_API_PASSWORD are not both configured."
          fi
          answerrank_file="docs/research/seo-ai-visibility/answerrank/${ANSWERRANK_DATE}.json"
          if [ "$ANSWERRANK_ADD_OUTCOME" = "success" ] && [ -f "$answerrank_file" ]; then
            answerrank_note=$(jq -r '"AI-answer snapshot: World Monitor named in \(.overall.mentions) of \(.overall.answers) model answers; change since \(.comparison.previousDate // "the last comparable week"): \(.comparison.verdict). See answerrank/\(.date).md."' "$answerrank_file")
          elif [ "$ANSWERRANK_STATE" = "no-keys" ]; then
            answerrank_note="No AI-answer snapshot this week: OPENROUTER_API_KEY, ANTHROPIC_API_KEY and EXA_API_KEY are not all configured."
          else
            answerrank_note="No AI-answer snapshot this week: the AI-answer job ended ${ANSWERRANK_RESULT:-unknown} (state ${ANSWERRANK_STATE:-none}) or its snapshot failed validation. See the run log."
          fi
          if [ "$BASELINE_OUTCOME" = "failure" ]; then
            baseline_note="The AI-visibility baseline and scorecard failed to regenerate in this run, so neither is in this PR. See the run log."
          else
            baseline_note="Also regenerates the AI-visibility baseline and scorecard (baselines/${snapshot_date}.json, scorecards/${snapshot_date}.md) from these snapshots, compared with the previous baseline. A source without a snapshot is unavailable with a reason, never zero, and the AI-answer surfaces are unavailable because the manual panel was dropped (#10024)."
          fi
          pr_url=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore(seo): Search Console snapshot ${snapshot_date} (#8606)" \
            --body "$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s' \
              "Weekly Search Console snapshot. Per-URL index state and per-family search performance, collected from the API rather than transcribed from the UI." \
              "Read the HTML indexability headline, not the raw coverage count: render subresources and machine-readable twins are bucketed separately on purpose. Shares are measured over inspected rows and are never projected onto a reported total." \
              "$bing_note" \
              "$umami_note" \
              "$answerrank_note" \
              "$baseline_note" \
              "Collected in ${RUN_URL}. Auto-merge is armed: this PR merges itself once the required checks pass.")")
          echo "$pr_url"
          gh pr merge --auto --squash "$pr_url"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
      - name: Open an issue when AI-answer visibility declines
        # !cancelled(): a failed PR step must not swallow the alert; a
        # cancelled run posts nothing. A rerun in a week whose PR already
        # exists skips collection, so it retries the alert from that week's
        # saved snapshot instead; the marker in the issue keeps a retry from
        # reporting the same week twice.
        if: ${{ !cancelled() && steps.reconcile.outcome == 'success' && (steps.answerrank_add.outcome == 'success' || steps.reconcile.outputs.skip == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          SNAPSHOT_DATE: ${{ needs.answerrank.outputs.date }}
          SKIPPED: ${{ steps.reconcile.outputs.skip }}
          BRANCH_NAME: ${{ steps.reconcile.outputs.branch }}
        run: |
          dir="docs/research/seo-ai-visibility/answerrank"
          if [ "$SKIPPED" = "true" ]; then
            # The week's snapshot is on the weekly branch while its PR is open,
            # and already in this main checkout once the PR has merged.
            if git fetch --quiet origin "$BRANCH_NAME" 2>/dev/null; then
              git checkout --quiet FETCH_HEAD -- "$dir" 2>/dev/null || true
            fi
            file=$(find "$dir" -maxdepth 1 -name '20*.json' | sort | tail -n 1)
            if [ -z "$file" ] || [ "$(date -u -d "$(basename "$file" .json)" +%G-W%V)" != "$(date -u +%G-W%V)" ]; then
              exit 0
            fi
          else
            file="${dir}/${SNAPSHOT_DATE}.json"
          fi
          if [ ! -f "$file" ] || [ "$(jq -r '.comparison.verdict' "$file")" != "declined" ]; then
            exit 0
          fi
          title="AI-answer visibility declined"
          marker="<!-- answerrank-alert:$(jq -r '.date' "$file") -->"
          # Anyone can open an issue or comment on this public repository, so
          # only this workflow's own issues and comments count: exact title,
          # authored by github-actions[bot]. The author filter is also in the
          # search itself, so outside issues with the same title cannot push
          # the bot's issues past the result limit.
          # Each read is a plain assignment so that, under bash -e, a failed
          # read stops the step instead of reading as "not reported yet" and
          # posting the same week twice.
          issues=$(gh issue list --state all --search "\"${title}\" in:title author:app/github-actions" --limit 100 --json number,title,state,author)
          own=$(jq -r --arg title "$title" '.[] | select(.title == $title and .author.login == "app/github-actions") | .number' <<< "$issues")
          for number in $own; do
            thread=$(gh issue view "$number" --json body,comments)
            text=$(jq -r '([.body] + [.comments[] | select(.author.login == "github-actions") | .body]) | join("\n")' <<< "$thread")
            if grep -qF "$marker" <<< "$text"; then
              echo "::notice::The decline in $(basename "$file") was already reported in issue ${number}."
              exit 0
            fi
          done
          body=$(jq -r --arg pr "${PR_URL:-the weekly snapshot PR}" --arg marker "$marker" '
            def pct: if . == null then "n/a" else (. * 1000 | round) as $t | "\($t / 10 | floor).\($t % 10)%" end;
            def line($label; $c): if $c == null then "- \($label): not compared" else "- \($label): \($c.before | pct) → \($c.after | pct) (z = \($c.z)), \($c.verdict)" end;
            "The weekly answerrank run on \(.date) shows a significant drop since \(.comparison.previousDate).\n\n"
            + line("Named in model answers"; .comparison.mentions) + "\n"
            + line("Cited in web-search answers"; .comparison.citations) + "\n\n"
            + "Details: docs/research/seo-ai-visibility/answerrank/\(.date).md, in \($pr).\n\n" + $marker
          ' "$file")
          existing=$(jq -r --arg title "$title" '[.[] | select(.title == $title and .author.login == "app/github-actions" and .state == "OPEN")][0].number // empty' <<< "$issues")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
  # Dispatches Deploy Gate for the new PR directly rather than waiting on the
  # workflow_run event or the gate's 30-minute sweep.
  deploy-gate:
    needs: collect
    if: (github.event_name != 'schedule' || github.repository == 'koala73/worldmonitor')
    permissions:
      actions: write
      contents: read
      pull-requests: read
