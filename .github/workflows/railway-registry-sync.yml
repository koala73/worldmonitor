name: Railway Registry Sync

# The repository registry is the desired production configuration. This job
# applies that state from the exact merged main checkout, then verifies it with
# a separate Viewer identity. The six-hourly health workflow still detects
# out-of-band dashboard edits.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/railway-registry-sync.yml
      - scripts/audit-railway-watch-paths.mjs
      - scripts/railway-native-autodeploy-fleet.json
      - 'scripts/railway-*.mjs'
      - scripts/railway-services.json
      - scripts/run-railway-registry-sync.mjs
  workflow_dispatch:

concurrency:
  group: railway-registry-sync-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile registry to live configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ingestion-acceptance-production
      deployment: false
    steps:
      - name: Start config-reconciliation run budget
        run: echo "RAILWAY_CONFIG_AUDIT_JOB_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - id: install-railway
        name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.30.1

      - name: Reconcile registry-managed Railway configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_RECONCILE_DEPLOY_TOKEN_V2 }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: node scripts/run-railway-registry-sync.mjs --mode apply

      - name: Verify live configuration with the Viewer identity
        if: >-
          always()
          && steps.checkout.outcome == 'success'
          && steps.setup-node.outcome == 'success'
          && steps.install-railway.outcome == 'success'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_VIEWER_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: node scripts/run-railway-registry-sync.mjs --mode verify
