name: Zapier tests

on:
  pull_request:
    paths:
      - 'integrations/zapier/**'
      - 'shared/event-triggers.json'
      - '.github/workflows/zapier-tests.yml'
      - 'tests/package-test-command-paths.test.mjs'
  push:
    branches: [main]
    paths:
      - 'integrations/zapier/**'
      - 'shared/event-triggers.json'
      - '.github/workflows/zapier-tests.yml'
      - 'tests/package-test-command-paths.test.mjs'

permissions:
  contents: read

concurrency:
  group: zapier-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zapier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/zapier
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/zapier/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
