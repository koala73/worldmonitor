name: Refresh Crawlable Live Pulse

# The committed pulse snapshot is published as "Current signal" on every
# country, chokepoint and crisis page, as the forecast scorecard on /accuracy/,
# and as the homepage teaser strip's
# prerendered fallback. build-crawlable-corpus.mjs rejects a snapshot older than
# MAX_LIVE_PULSE_SNAPSHOT_AGE_DAYS (10), so this weekly refresh is what keeps
# the corpus buildable as well as truthful.
#
# Weekly, not monthly: these pages are headed "Approx. 24-hour movement", and a
# monthly cron behind a 45-day ceiling let them ship on six-week-old data
# (#7530). The cadence and that ceiling are one contract — changing either alone
# reopens the gap, and tests/crawlable-corpus.test.mjs asserts they agree.
# Mirrors .github/workflows/resilience-snapshot-refresh.yml.

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
    inputs:
      developments_coverage_ratio:
        description: >-
          Operator override for the developments coverage floor, a ratio in
          (0, 1]. Use it to publish a measured-but-lower week (the first freeze
          after the GDELT materializer redeploys, an index outage) instead of
          losing the capture (#7748). Leave empty for the built-in floor.
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crawlable-pulse-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The freeze fetches five digest variants, tops every under-filled country
    # up from the per-country GDELT index (~190 requests, ~50 minutes if every
    # one hit its 20s timeout), and requests a brief for every country whose
    # grounding clears the floor (#7748). The LLM calls dominate the wall
    # clock (a keyed run took ~20 minutes at 54 briefs; index corroboration
    # can roughly double the attempts), and a timed-out job writes no
    # snapshot at all, so the budget is generous.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # workflow_dispatch can target a feature branch; publication must
          # always branch from main so the review PR stays free of unrelated commits.
          ref: refs/heads/main
      - name: Reconcile the weekly review branch
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ISO year-week, not year-month: the branch key is what makes the
          # run idempotent, so a month-keyed name under a weekly cron would
          # find week 1's PR and skip weeks 2-4 — a weekly schedule that still
          # refreshes monthly (#7530).
          period=$(date -u +%G-W%V)
          branch="automation/crawlable-pulse-${period}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          existing_pr=$(gh pr list --state all --head "$branch" --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Weekly pulse PR #${existing_pr} already exists."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(corpus): refresh crawlable live pulse ${period}" \
              --body "Weekly crawlable live-pulse refresh. Rebuilds the crawlable corpus, root sitemap, llms-full forecast-accuracy section, and the homepage welcome-teaser strip (#7608, #8070)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.reconcile.outputs.skip != 'true'
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        if: steps.reconcile.outputs.skip != 'true'
        run: npm ci --ignore-scripts
      - name: Require WorldMonitor API key
        if: steps.reconcile.outputs.skip != 'true'
        env:
          WORLDMONITOR_API_KEY: ${{ secrets.WORLDMONITOR_API_KEY }}
        run: |
          if [ -z "${WORLDMONITOR_API_KEY:-}" ]; then
            echo "::error::WORLDMONITOR_API_KEY secret is required to freeze the crawlable pulse."
            exit 1
          fi
      - name: Freeze the current pulse
        if: steps.reconcile.outputs.skip != 'true'
        env:
          # Anonymous risk/chokepoint/crisis/headline captures use the minted
          # wm-session. This scheduled refresh requires WORLDMONITOR_API_KEY
          # for per-country intel brief and timeline enrichment on tier-gated
          # routes (#7615).
          API_BASE: https://www.worldmonitor.app
          WORLDMONITOR_API_KEY: ${{ secrets.WORLDMONITOR_API_KEY }}
        run: npm run freeze:crawlable-live-pulse
      - name: Preserve the frozen snapshot
        # The verification below can reject the capture (the developments
        # coverage floor, #7748). A rejected capture must stay inspectable
        # and republishable with the operator override, not vanish with the
        # job: the freeze spent ~190 index requests and ~100 LLM calls on it.
        if: steps.reconcile.outputs.skip != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: crawlable-live-pulse-snapshot
          path: docs/snapshots/crawlable-live-pulse-*.json
          retention-days: 14
          if-no-files-found: error
      - name: Rebuild and verify published artifacts
        if: steps.reconcile.outputs.skip != 'true'
        env:
          # Empty on the schedule; a workflow_dispatch operator can lower the
          # developments coverage floor for one measured week (#7748).
          CRAWLABLE_DEVELOPMENTS_COVERAGE_RATIO: ${{ inputs.developments_coverage_ratio }}
        run: |
          npm run build:crawlable-corpus
          npm run build:sitemap
          # The homepage teaser strip is derived from the same snapshot, so it
          # refreshes on this cadence too. Skipping it would leave the strip
          # publishing headlines and scores this freeze has already superseded —
          # the drift that produced #7608 — and red the unit gate on this PR.
          npm run teasers:welcome
          # The Forecast accuracy section in llms-full is derived from this
          # snapshot (#8070). Skipping the rebuild would leave the corpus quoting
          # last week's Brier after /accuracy/ had already moved.
          npm run build:llms-full
          node --import tsx --test --test-concurrency=1 \
            tests/accuracy-corpus.test.mjs \
            tests/seo-geo-residue.test.mjs \
            tests/crawlable-corpus.test.mjs \
            tests/crawlable-developments.test.mjs \
            tests/crawlable-live-tools.test.mjs \
            tests/country-mention.test.mjs \
            tests/freeze-crawlable-live-pulse.test.mjs \
            tests/welcome-teasers.test.mjs \
            tests/sitemap-generation.test.mjs
      - name: Prune superseded pulse snapshots
        if: steps.reconcile.outputs.skip != 'true'
        run: |
          # Keep only the newest snapshot: resolveLatestLivePulseSnapshotPath
          # reads the highest-dated file, so older ones are dead weight.
          ls -1 docs/snapshots/crawlable-live-pulse-*.json \
            | sort -r \
            | tail -n +2 \
            | xargs -r git rm --quiet
      - name: Open the weekly pulse PR
        if: steps.reconcile.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.reconcile.outputs.branch }}
        run: |
          snapshot_date=$(date -u +%F)
          snapshot_path="docs/snapshots/crawlable-live-pulse-${snapshot_date}.json"
          git switch -c "$BRANCH_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$snapshot_path" public/sitemap.xml public/sitemap-main.xml public/llms-full.txt pro-test/src/generated/teasers.json pro-test/welcome.html pro-test/index.html
          git commit -m "chore(corpus): refresh crawlable live pulse ${snapshot_date}"
          # Route lastmod dates come from committed material sources.
          npm run build:sitemap
          git add public/sitemap.xml public/sitemap-main.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore(corpus): align pulse sitemap dates ${snapshot_date}"
          fi
          node scripts/build-sitemap.mjs --check
          git push --set-upstream origin "$BRANCH_NAME"
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore(corpus): refresh crawlable live pulse ${snapshot_date}" \
            --body "Weekly crawlable live-pulse refresh. Rebuilds the crawlable corpus, root sitemap, llms-full forecast-accuracy section, and the homepage welcome-teaser strip (#7608, #8070)."
