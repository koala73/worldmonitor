name: Issue UI Evidence

# Closes UI reports from outside the maintainer set that arrive without a
# screenshot, and reopens them once one is attached. Issue forms cannot
# require an attachment, so this is the enforcement.
#
# Runs trusted default-branch code: the checkout pins the default branch, and
# the issue title and body reach the script only through the event payload
# file, never through shell interpolation.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-ui-evidence-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/check-issue-ui-evidence.mjs
            scripts/lib/main-module.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check the UI report for an attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-issue-ui-evidence.mjs
