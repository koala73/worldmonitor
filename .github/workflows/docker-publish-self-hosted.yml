name: Publish self-hosted Docker images

# docker-publish.yml publishes ghcr.io/koala73/worldmonitor from
# docker/Dockerfile — a frontend-only nginx image pointed at the hosted
# api.worldmonitor.app backend. It is not the image docker-compose.yml's
# self-hosting stack builds.
#
# This workflow publishes the three images that stack actually needs, built
# from the same Dockerfiles docker-compose.yml already builds locally:
#   worldmonitor-selfhosted -> Dockerfile (nginx + the bundled Node API sidecar)
#   worldmonitor-ais-relay  -> Dockerfile.relay
#   worldmonitor-redis-rest -> docker/Dockerfile.redis-rest
# so self-hosting docker-compose.yml can pull instead of building from source.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: worldmonitor-selfhosted
            dockerfile: Dockerfile
            context: .
          - image: worldmonitor-ais-relay
            dockerfile: Dockerfile.relay
            context: .
          - image: worldmonitor-redis-rest
            dockerfile: docker/Dockerfile.redis-rest
            context: docker

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/koala73/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          # Distinct cache scope per matrix leg: the three images share
          # nothing, so a shared cache-from/cache-to would just thrash
          # between them on every run.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
