name: 'Open Data: Chokepoint Status Snapshot'

# Publishes the public chokepoint status open dataset (/data/v1/chokepoints/)
# from the public GetChokepointStatus endpoint. The snapshot job saves the API
# response and a preview build as an artifact. The publish job writes that
# day's snapshot straight to the Redis archive that api/open-data-chokepoints.js
# serves, so nothing waits on a pull request or a deploy. A manual run is a dry
# run by default: it uploads the artifact and publishes nothing.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: 'Build the snapshot and upload it as an artifact without publishing it'
  pull_request:
    paths:
      - scripts/build-open-data-chokepoints.mjs
      - tests/open-data-chokepoints.test.mjs
      - tests/open-data-chokepoints-archive.test.mjs
      - api/open-data-chokepoints.js
      - .github/workflows/open-data-chokepoints.yml

jobs:
  snapshot:
    if: (github.event_name != 'schedule' || github.repository == 'koala73/worldmonitor')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      snapshot_date: ${{ steps.build.outputs.snapshot_date }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build the chokepoint status snapshot
        id: build
        env:
          API_BASE: https://www.worldmonitor.app
        run: |
          snapshot_date=$(date -u +%F)
          echo "snapshot_date=${snapshot_date}" >> "$GITHUB_OUTPUT"
          node scripts/build-open-data-chokepoints.mjs \
            --out "$RUNNER_TEMP/open-data/chokepoints" \
            --date "$snapshot_date" \
            --save-input "$RUNNER_TEMP/open-data/response.json"
      - name: Verify the generator
        run: node --test tests/open-data-chokepoints.test.mjs tests/open-data-chokepoints-archive.test.mjs
      - name: Show the snapshot
        run: cat "$RUNNER_TEMP/open-data/chokepoints/latest.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: open-data-chokepoints
          path: ${{ runner.temp }}/open-data
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: snapshot
    if: (github.event_name != 'schedule' || github.repository == 'koala73/worldmonitor') && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: open-data-chokepoints
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # A dispatch can target a feature branch; the publisher always runs from main.
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: open-data-chokepoints
          path: ${{ runner.temp }}/open-data
      - name: Publish the snapshot to the open-data archive
        env:
          SNAPSHOT_DATE: ${{ needs.snapshot.outputs.snapshot_date }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node scripts/build-open-data-chokepoints.mjs \
            --publish-redis \
            --input "$RUNNER_TEMP/open-data/response.json" \
            --date "$SNAPSHOT_DATE"
