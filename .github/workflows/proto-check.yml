name: Proto Generation Check

on:
  pull_request:
    paths:
      - 'proto/**'
      - 'src/generated/**'
      - 'docs/api/**'
      - 'scripts/generate-request-validation.mjs'
      - 'Makefile'
      - '.github/workflows/proto-check.yml'

# Default-deny. Fork inspection and internal generation have deliberately
# different trust boundaries, so each job grants only what it needs.
permissions: {}

# A generated commit updates the PR head and starts a clean follow-up run. Do
# not let an older run race a newer head and push stale artifacts afterward.
concurrency:
  group: proto-freshness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proto-breaking:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fork PRs must receive compatibility feedback, but their Makefile is
      # untrusted. Replace it with the reviewed main copy before invoking any
      # make target; buf then treats the PR's proto files as data only.
      - name: Restore the trusted main Makefile
        run: git show origin/main:Makefile > Makefile

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # setup-go v6 uses GOTOOLCHAIN=local; match the pinned sebuf toolchain requirement.
          go-version: '1.26'
          cache: false

      - name: Cache buf
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin
          key: buf-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install buf
        run: make install-buf
        env:
          GOPROXY: direct

      - name: Check for breaking proto changes
        run: make breaking

  fork-artifact-check:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # SECURITY: this checkout contains untrusted fork content. This job may
      # inspect paths, but must never execute the fork's Makefile,
      # buf.gen.yaml, generated code, package scripts, or binaries.
      - name: Checkout fork PR merge commit for path inspection only
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require generated artifacts when codegen inputs change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA"...HEAD -- proto src/generated docs/api scripts/generate-request-validation.mjs Makefile || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No proto or generated artifact changes detected."
            exit 0
          fi

          echo "Changed proto/codegen paths:"
          echo "$CHANGED_FILES"

          INPUT_CHANGED=$(printf '%s\n' "$CHANGED_FILES" | grep -E '^(proto/|Makefile$|scripts/generate-request-validation\.mjs$)' || true)
          GENERATED_CHANGED=$(printf '%s\n' "$CHANGED_FILES" | grep -E '^(src/generated/|docs/api/)' || true)

          if [ -n "$INPUT_CHANGED" ] && [ -z "$GENERATED_CHANGED" ]; then
            echo ""
            echo "============================================================"
            echo "ERROR: Codegen inputs changed without committed generated artifacts."
            echo "This PR comes from a fork, so CI will not execute the fork's"
            echo "Makefile, buf.gen.yaml, generator configuration, or generated code."
            echo "Run 'make generate' locally and commit any changes under:"
            echo "  - src/generated/"
            echo "  - docs/api/"
            echo "A maintainer can run the full freshness check from an internal branch."
            echo "============================================================"
            exit 1
          fi

          echo "Fork PR artifact-presence check passed without executing fork code."

  internal-auto-generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
      generated-sha: ${{ steps.commit.outputs.generated-sha }}
    steps:
      - name: Checkout the exact internal PR head without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # setup-go v6 uses GOTOOLCHAIN=local; match the pinned sebuf toolchain requirement.
          go-version: '1.26'
          cache: false

      - name: Cache Go binaries (buf, protoc plugins)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin
          key: go-bin-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install buf and protoc plugins
        run: make install-buf install-plugins
        env:
          GOPROXY: direct
          GOPRIVATE: github.com/SebastienMelki

      - name: Run proto generation
        run: make generate

      - name: Reject generator writes outside generated artifact directories
        run: |
          if ! git diff --quiet -- . ':(exclude)src/generated/**' ':(exclude)docs/api/**' || \
             ! git diff --cached --quiet -- . ':(exclude)src/generated/**' ':(exclude)docs/api/**'; then
            echo "ERROR: make generate modified tracked files outside src/generated/ and docs/api/."
            git diff --stat -- . ':(exclude)src/generated/**' ':(exclude)docs/api/**'
            git diff --cached --stat -- . ':(exclude)src/generated/**' ':(exclude)docs/api/**'
            exit 1
          fi

          UNEXPECTED_UNTRACKED=$(git ls-files --others --exclude-standard -- . ':(exclude)src/generated/**' ':(exclude)docs/api/**')
          if [ -n "$UNEXPECTED_UNTRACKED" ]; then
            echo "ERROR: make generate created files outside the generated artifact directories:"
            echo "$UNEXPECTED_UNTRACKED"
            exit 1
          fi

      # GITHUB_TOKEN is exposed only after generator code has finished. The
      # checkout deliberately did not persist it in .git/config. A normal,
      # non-force push also fails closed if the PR head moved during this run.
      - name: Commit generated artifacts to the internal PR branch
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git check-ref-format "refs/heads/$PR_HEAD_REF"

          if git diff --quiet -- src/generated/ docs/api/ && \
             git diff --cached --quiet -- src/generated/ docs/api/ && \
             [ -z "$(git ls-files --others --exclude-standard src/generated/ docs/api/)" ]; then
            echo "Proto-generated artifacts are already current on the PR branch."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "generated-sha=$EXPECTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
            gh api "repos/$REPOSITORY/statuses/$EXPECTED_HEAD_SHA" --method POST \
              --field state=success \
              --field context=proto-generated-followup \
              --field description='Generated artifacts are current on this SHA'
            exit 0
          fi

          REMOTE_HEAD=$(git ls-remote origin "refs/heads/$PR_HEAD_REF" | awk '{print $1}')
          if [ "$REMOTE_HEAD" != "$EXPECTED_HEAD_SHA" ]; then
            echo "ERROR: PR head moved from $EXPECTED_HEAD_SHA to $REMOTE_HEAD; refusing a stale generated commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/ docs/api/
          git commit -m "chore(proto): update generated artifacts"
          GENERATED_SHA=$(git rev-parse HEAD)

          BASIC_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $BASIC_AUTH" \
            push origin "HEAD:refs/heads/$PR_HEAD_REF"

          # GITHUB_TOKEN pushes do not create push-triggered workflow runs.
          # GitHub does emit a PR synchronize event for an updated PR; keep a
          # visible pending status on the new SHA until that clean run lands.
          gh api "repos/$REPOSITORY/statuses/$GENERATED_SHA" --method POST \
            --field state=pending \
            --field context=proto-generated-followup \
            --field description='Waiting for CI on the generated commit'

          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "generated-sha=$GENERATED_SHA" >> "$GITHUB_OUTPUT"

  internal-merge-freshness:
    needs: internal-auto-generate
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.internal-auto-generate.outputs.pushed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout internal PR merge commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # setup-go v6 uses GOTOOLCHAIN=local; match the pinned sebuf toolchain requirement.
          go-version: '1.26'
          cache: false

      - name: Cache Go binaries (buf, protoc plugins)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin
          key: go-bin-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install buf and protoc plugins
        run: make install-buf install-plugins
        env:
          GOPROXY: direct
          GOPRIVATE: github.com/SebastienMelki

      - name: Run proto generation against merge commit
        run: make generate

      - name: Verify generated artifacts are fresh against the merge result
        run: |
          if ! git diff --exit-code -- src/generated/ docs/api/; then
            echo ""
            echo "============================================================"
            echo "ERROR: Generated artifacts are stale against the PR merge result."
            echo "Rebase the PR branch on the latest main branch and retry."
            echo "============================================================"
            exit 1
          fi

          UNTRACKED=$(git ls-files --others --exclude-standard src/generated/ docs/api/)
          if [ -n "$UNTRACKED" ]; then
            echo "ERROR: Untracked generated files found against the PR merge result:"
            echo "$UNTRACKED"
            exit 1
          fi

          echo "Generated artifacts are fresh against the PR merge result."

  # Preserve the historical check name for branch protection and reduce the
  # three trust-specific jobs to one explicit pass/fail result.
  proto-freshness:
    if: always()
    needs:
      - fork-artifact-check
      - internal-auto-generate
      - internal-merge-freshness
    runs-on: ubuntu-latest
    permissions: {}
    env:
      INTERNAL_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      FORK_RESULT: ${{ needs.fork-artifact-check.result }}
      GENERATE_RESULT: ${{ needs.internal-auto-generate.result }}
      MERGE_RESULT: ${{ needs.internal-merge-freshness.result }}
      GENERATED_PUSHED: ${{ needs.internal-auto-generate.outputs.pushed }}
    steps:
      - name: Publish aggregate proto freshness result
        run: |
          if [ "$INTERNAL_PR" != "true" ]; then
            [ "$FORK_RESULT" = "success" ] || {
              echo "Fork artifact-presence check did not pass: $FORK_RESULT"
              exit 1
            }
            exit 0
          fi

          [ "$GENERATE_RESULT" = "success" ] || {
            echo "Internal generation did not pass: $GENERATE_RESULT"
            exit 1
          }

          if [ "$GENERATED_PUSHED" = "true" ]; then
            echo "Generated commit pushed. A clean follow-up run is now required on the new PR head."
            exit 0
          fi

          [ "$MERGE_RESULT" = "success" ] || {
            echo "Merge-result freshness did not pass: $MERGE_RESULT"
            exit 1
          }

          echo "Proto-generated artifacts are current on both the PR head and merge result."
