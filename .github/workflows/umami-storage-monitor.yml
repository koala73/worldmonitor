name: Umami Storage Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: umami-storage-monitor-${{ github.ref }}
  # This is a read-only point-in-time probe. A newer sample is more useful than
  # a stale runner-less job, which would otherwise own the group indefinitely.
  cancel-in-progress: true

permissions:
  contents: read
  # Read the previous run's growth-history artifact.
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ingestion-acceptance-production
      deployment: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.30.1

      # The history travels as an artifact, not an Actions cache entry. The
      # repository cache sits at its 10 GB cap, and GitHub evicted this history
      # (on 2026-09-12, every entry) so the growth trend kept restarting. Take
      # the newest of this workflow's recent runs on the same branch that
      # uploaded one; cancelled runs upload nothing, so fall through to older.
      - name: Restore bounded storage history
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          # A lost history only suspends the projection; the capacity check
          # itself must still run, so a GitHub API failure warns, not fails.
          # The branch goes in as a field so gh encodes it; a name containing
          # `&` would otherwise add its own query parameter.
          if ! run_ids=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/umami-storage-monitor.yml/runs" \
            -f "branch=$BRANCH" -F per_page=20 \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id"); then
            echo "::warning::Could not list earlier monitor runs; the growth trend starts over."
            exit 0
          fi
          for run_id in $run_ids; do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name umami-storage-state --dir .cache 2>/dev/null; then
              echo "Restored storage history from run $run_id."
              exit 0
            fi
          done
          echo "::warning::No stored Umami storage history found; the growth trend starts over."

      - name: Verify Railway production context
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_PRODUCTION_TOKEN is required for the read-only storage monitor."
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "::error::RAILWAY_PROJECT_ID is required for the read-only storage monitor."
            exit 1
          fi
          railway status --project "$RAILWAY_PROJECT_ID" --environment production --json > /dev/null

      - name: Read Umami Postgres volume usage
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          railway volume --project "$RAILWAY_PROJECT_ID" --environment production list --json > .cache/railway-volumes.json

      - name: Check capacity and projected headroom
        env:
          UMAMI_POSTGRES_SERVICE_NAME: Postgres Umami
        run: node scripts/check-umami-storage.mjs --input .cache/railway-volumes.json --state .cache/umami-storage-state.json

      # Persist the sample the step above just wrote, before anything that can
      # fail the job runs. check-umami-storage.mjs writes its state file and
      # only then sets a non-zero exit code, so this saves the newest sample
      # even on a critical-capacity run. That state already carries the whole
      # trend window, so the artifact only has to outlive the gap until the
      # next successful run.
      - name: Persist bounded storage history
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: umami-storage-state
          path: .cache/umami-storage-state.json
          include-hidden-files: true
          # A re-run keeps the run id, and a second artifact with this name in
          # the same run is rejected unless it replaces the first attempt's.
          overwrite: true
          if-no-files-found: warn
          retention-days: 7

      # Both runner steps run even when an earlier step failed, because
      # capacity is the lagging symptom of a dead runner and a critical volume
      # must never be the reason the actionable alarm goes unread.
      - name: Read retention runner deployments
        if: ${{ !cancelled() }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          railway deployment list --project "$RAILWAY_PROJECT_ID" --environment production \
            --service umami-retention --limit 1000 --json > .cache/railway-retention-deployments.json

      - name: Check the retention runner is retiring rows
        if: ${{ !cancelled() }}
        run: node scripts/check-umami-retention-runner.mjs --input .cache/railway-retention-deployments.json
