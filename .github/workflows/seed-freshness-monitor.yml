name: Seed Freshness Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Transition publication must finish before the next observation can classify
# the same incident; the publisher's checkedAt fence then rejects delayed writes.
concurrency:
  group: seed-freshness-monitor
  cancel-in-progress: false

permissions:
  contents: read
  # Per-source statuses live on a historical operational anchor. They never
  # become part of the deployable main revision's check suite.
  statuses: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ingestion-acceptance-production
      deployment: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The scheduled gate can fall back to the newest recent gated main
          # ancestor. That first-parent walk needs full history but no blobs.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Require green main for scheduled acceptance
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          # One commit is roughly 6 minutes of gate latency, so 25 spans far more
          # merge traffic than the 15-minute schedule can outrun. The age bound is
          # the real limit: past it, "main has not been gated in 6 hours" is itself
          # the fault, and monitoring from that revision would hide it.
          GATED_ANCESTOR_LIMIT: '25'
          GATED_ANCESTOR_MAX_AGE_SECONDS: '21600'
        run: |
          set -o pipefail
          # GitHub guarantees newest-first status history. Preserve that order:
          # updated_at has only second resolution, so sorting can invert ties.
          gate_state() {
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/commits/$1/statuses?per_page=100" |
              jq -r 'flatten | map(select(.context == "gate")) | first | .state // "missing"'
          }
          head_state=$(gate_state "$GITHUB_SHA")
          echo "gate_state=$head_state"
          if [ "$head_state" = "success" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "Exact main revision passed repository gates."
            exit 0
          fi
          # Any non-success head falls through: pending/missing is the normal
          # post-merge race (deploy gate ~6 minutes, this cron every 15), and
          # failure/error is a verdict the `gate` status already owns. Echoing
          # that verdict here reds the ingestion monitor without looking at
          # seeds. Walk instead. This is not a skip: the probe still runs
          # against a revision the repository gates accepted.

          now=$(date +%s)
          while read -r sha committed; do
            if [ -z "$sha" ] || [ "$sha" = "$GITHUB_SHA" ]; then continue; fi
            if [ "$(gate_state "$sha")" != "success" ]; then continue; fi
            age=$(( now - committed ))
            if [ "$age" -gt "$GATED_ANCESTOR_MAX_AGE_SECONDS" ]; then
              echo "::error::Cannot establish ingestion operational acceptance: main gate is $head_state and the newest gated ancestor $sha is ${age}s old (limit ${GATED_ANCESTOR_MAX_AGE_SECONDS}s)."
              exit 1
            fi
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "Head gate is $head_state; monitoring the newest gated main revision $sha (${age}s old)."
            exit 0
          done <<EOF
          $(git log --first-parent -n "$GATED_ANCESTOR_LIMIT" --format='%H %ct' "$GITHUB_SHA")
          EOF
          echo "::error::Cannot establish ingestion operational acceptance: main gate is $head_state and none of the last $GATED_ANCESTOR_LIMIT main revisions has a successful gate."
          exit 1

      # Separate from the gate step on purpose: that step stays a pure read, which
      # is how tests/seed-freshness-workflow.test.mjs executes its bash.
      - name: Check out the gated main revision
        if: ${{ steps.gate.outputs.sha != '' && steps.gate.outputs.sha != github.sha }}
        env:
          GATED_SHA: ${{ steps.gate.outputs.sha }}
        run: git checkout --detach "$GATED_SHA"

      # This workflow owns only ingestion/data acceptance. Deployment
      # configuration and image drift have their own six-hourly read-only workflow.
      - name: Check ingestion operational acceptance
        id: acceptance
        if: ${{ !cancelled() && steps.gate.conclusion != 'failure' }}
        # The probe remains strict and exits non-zero for every active problem.
        # The next step decides whether that problem is a new transition or the
        # same durable incident already attached to the operational anchor.
        continue-on-error: true
        run: node scripts/check-seed-freshness.mjs --json-output "$RUNNER_TEMP/seed-freshness-observation.json"

      - name: Publish ingestion operational transitions
        if: ${{ !cancelled() && steps.gate.conclusion != 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_ACCEPTANCE_SHA: ${{ steps.gate.outputs.sha || github.sha }}
          SEED_ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          # PR #6876 introduced the transition publisher. Its historical merge
          # commit is an ancestor of every supported monitored revision and is
          # never a future deployment candidate.
          SEED_STATUS_SHA: b93afd05d0f4ea2c465e79fd064e87fc1f9fb2f3
          SEED_STATUS_WRITER_LOGIN: github-actions[bot]
        run: |
          # During the first post-merge race, the newest gated ancestor can
          # predate this lifecycle. Wait for the new revision to pass `gate`
          # instead of turning that expected bootstrap state into an alarm.
          if [ ! -f scripts/update-seed-health-statuses.mjs ]; then
            if [ "$SEED_ACCEPTANCE_OUTCOME" != "success" ]; then
              echo "::error::Ingestion operational acceptance failed on gated revision $SEED_ACCEPTANCE_SHA, and no transition publisher is available to classify the failure."
              exit 1
            fi
            echo "Transition publisher is not active on gated revision $SEED_ACCEPTANCE_SHA; waiting for a gated activation revision."
            exit 0
          fi
          status_args=()
          if grep -q -- "'status-sha':" scripts/update-seed-health-statuses.mjs; then
            status_args=(--status-sha "$SEED_STATUS_SHA")
          else
            echo "Gated revision $SEED_ACCEPTANCE_SHA predates anchored statuses; using its compatible transition publisher until the activation revision is gated."
          fi
          node scripts/update-seed-health-statuses.mjs \
            --sha "$SEED_ACCEPTANCE_SHA" \
            "${status_args[@]}" \
            --report "$RUNNER_TEMP/seed-freshness-observation.json"
