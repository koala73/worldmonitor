name: Seed Freshness Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# The drift check queries every service serially, so a slow run can outlast the
# 15-minute interval. Superseding is correct for a read-only probe: the newer
# run reads newer state and answers the same question better.
concurrency:
  group: seed-freshness-monitor
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Was 5, which predates the deploy-drift step: that step alone makes one
    # service-list plus one deployment-list call per service (77 in production),
    # each a CLI auth + GraphQL round trip. Per-call timeouts bound a hung call;
    # this bounds the run.
    timeout-minutes: 20
    environment:
      name: ingestion-acceptance-production
      deployment: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The deploy-drift check answers "is this service running head, or
          # something newer that landed while we were running" with
          # `git merge-base --is-ancestor`, which needs the commits to exist
          # locally. A depth-1 checkout has neither the grace window's history
          # nor the newer commit, and every such question then answers "cannot
          # prove it" — correct but noisy on any run that overlaps a merge.
          fetch-depth: 50

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Require green main for scheduled acceptance
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # GitHub guarantees newest-first status history. Preserve that order:
          # updated_at has only second resolution, so sorting can invert ties.
          gate_state=$(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses?per_page=100" |
              jq -r 'flatten | map(select(.context == "gate")) | first | .state // "missing"'
          )
          echo "gate_state=$gate_state"
          if [ "$gate_state" != "success" ]; then
            echo "::error::Cannot establish ingestion operational acceptance because main gate is $gate_state."
            exit 1
          fi
          echo "Exact main revision passed repository gates."

      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.30.1

      - name: Verify Railway production context
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_PRODUCTION_TOKEN is required for the read-only production config audit."
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "::error::RAILWAY_PROJECT_ID Actions environment variable is required for the production config audit."
            exit 1
          fi
          railway status --project "$RAILWAY_PROJECT_ID" --environment production --json > /dev/null
          echo "Project-scoped Railway token is valid for the expected production context."

      - name: Audit Railway ingestion deployment controls
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        run: node scripts/audit-railway-watch-paths.mjs

      # `if` is an explicit gate reference, not decoration. With default success()
      # semantics this step was SKIPPED on every run from 2026-08-03 onward
      # because the config audit above failed on one service's watch paths —
      # so a single unrelated drift silently switched off data-freshness
      # monitoring for the whole fleet. Each probe now reports independently and
      # the only thing that can stop it is the fail-closed green-main gate.
      - name: Check ingestion operational acceptance
        if: ${{ !cancelled() && steps.gate.conclusion != 'failure' }}
        run: node scripts/check-seed-freshness.mjs

      # Last, and independently gated for the same reason compact health is.
      #
      # The audit above proves no service CAN silently skip a merge; this proves
      # none actually did. Both are needed: a cleared filter does nothing for a
      # webhook that stopped delivering (#6064), and this check catches that
      # without knowing why.
      - name: Check Railway deploy drift against main
        if: ${{ !cancelled() && steps.gate.conclusion != 'failure' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        run: |
          set -o pipefail
          # Pick up commits merged since the checkout so a service that already
          # built one of them reads as ahead rather than behind.
          git fetch --quiet --depth=50 origin main || true
          node scripts/check-railway-deploy-drift.mjs
