name: Publish MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}
    environment: mcp-registry-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
          MCP_PUBLISHER_VERSION: v1.7.9
        run: |
          curl --fail --location --silent --show-error \
            --connect-timeout 15 \
            --max-time 90 \
            --retry 3 \
            --retry-delay 2 \
            --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Prepare registry manifest
        run: node scripts/prepare-mcp-registry-manifest.mjs registry-server.json

      - name: Validate server manifest
        run: ./mcp-publisher validate registry-server.json

      - name: Authenticate to MCP Registry
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          test -n "${MCP_REGISTRY_PRIVATE_KEY}"
          ./mcp-publisher login http \
            --domain worldmonitor.app \
            --private-key "${MCP_REGISTRY_PRIVATE_KEY}"

      - name: Publish server
        run: ./mcp-publisher publish registry-server.json
