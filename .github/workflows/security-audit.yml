name: Security Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

# See test.yml. The nightly audit and any manual dispatch land in a group of
# one via `github.run_id`, so a PR push can never evict a running scan
# (#8443).
concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit-lockfile:
    name: audit-lockfile
    runs-on: ubuntu-latest
    # Eight bounded audits plus setup and verdict upload.
    timeout-minutes: 85
    env:
      # Authenticate advisory lookups used to date findings for the grace clock.
      GITHUB_TOKEN: ${{ github.token }}
      AUDIT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      # The daily sweep must fail when a lockfile or advisory age is unavailable.
      AUDIT_FAIL_ON_OUTAGE: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The introduced-vs-inherited split needs the base commit in the object
      # DB. checkout leaves a shallow merge ref, so fetch just that one commit.
      - name: Fetch base commit
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Audit package-lock.json
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AUDIT_STATUS_FILE: ${{ runner.temp }}/audit-status/root.txt
        run: |
          mkdir -p "${{ runner.temp }}/audit-status"
          node .github/scripts/audit-production-dependencies.mjs \
            --workspace "." \
            --package-json "package.json" \
            --lockfile "package-lock.json"
      - name: Audit scripts/package-lock.json
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AUDIT_STATUS_FILE: ${{ runner.temp }}/audit-status/scripts.txt
        run: |
          mkdir -p "${{ runner.temp }}/audit-status"
          node .github/scripts/audit-production-dependencies.mjs \
            --workspace "scripts" \
            --package-json "scripts/package.json" \
            --lockfile "scripts/package-lock.json"
      - name: Audit consumer-prices-core/package-lock.json
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AUDIT_STATUS_FILE: ${{ runner.temp }}/audit-status/consumer-prices-core.txt
        run: |
          mkdir -p "${{ runner.temp }}/audit-status"
          node .github/scripts/audit-production-dependencies.mjs \
            --workspace "consumer-prices-core" \
            --package-json "consumer-prices-core/package.json" \
            --lockfile "consumer-prices-core/package-lock.json"
      - name: Audit blog-site/package-lock.json
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AUDIT_STATUS_FILE: ${{ runner.temp }}/audit-status/blog-site.txt
        run: |
          mkdir -p "${{ runner.temp }}/audit-status"
          node .github/scripts/audit-production-dependencies.mjs \
            --workspace "blog-site" \
            --package-json "blog-site/package.json" \
            --lockfile "blog-site/package-lock.json"
      - name: Audit pro-test/package-lock.json
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AUDIT_STATUS_FILE: ${{ runner.temp }}/audit-status/pro-test.txt
        run: |
          mkdir -p "${{ runner.temp }}/audit-status"
          node .github/scripts/audit-production-dependencies.mjs \
            --workspace "pro-test" \
            --package-json "pro-test/package.json" \
            --lockfile "pro-test/package-lock.json"
      - name: Audit docker/runtime-package-lock.json
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AUDIT_STATUS_FILE: ${{ runner.temp }}/audit-status/docker-runtime.txt
        run: |
          mkdir -p "${{ runner.temp }}/audit-status"
          node .github/scripts/audit-production-dependencies.mjs \
            --workspace "docker" \
            --package-json "docker/runtime-package.json" \
            --lockfile "docker/runtime-package-lock.json"
      - name: Audit workers/railway-reconcile-control/package-lock.json
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AUDIT_STATUS_FILE: ${{ runner.temp }}/audit-status/railway-reconcile-control.txt
        run: |
          mkdir -p "${{ runner.temp }}/audit-status"
          node .github/scripts/audit-production-dependencies.mjs \
            --workspace "workers/railway-reconcile-control" \
            --package-json "workers/railway-reconcile-control/package.json" \
            --lockfile "workers/railway-reconcile-control/package-lock.json"
      - name: Audit demos/verification-desk/package-lock.json
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AUDIT_STATUS_FILE: ${{ runner.temp }}/audit-status/verification-desk.txt
        run: |
          mkdir -p "${{ runner.temp }}/audit-status"
          node .github/scripts/audit-production-dependencies.mjs \
            --workspace "demos/verification-desk" \
            --package-json "demos/verification-desk/package.json" \
            --lockfile "demos/verification-desk/package-lock.json"
      # always(): a blocking finding must still publish its verdict, otherwise
      # the aggregate cannot tell it apart from a job that never ran.
      - name: Upload audit verdict
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: audit-status-lockfiles
          path: ${{ runner.temp }}/audit-status/*.txt
          if-no-files-found: ignore
          retention-days: 1

  audit-rust:
    name: audit-rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Cache pinned advisory tool
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned advisory tool
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        env:
          AUDIT_STATUS_FILE: ${{ runner.temp }}/rust.txt
          AUDIT_FAIL_ON_OUTAGE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: node .github/scripts/audit-rust-dependencies.mjs
      - name: Upload Rust verdict
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: audit-status-rust
          path: ${{ runner.temp }}/rust.txt
          if-no-files-found: ignore
          retention-days: 1

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    needs: [audit-lockfile, audit-rust]
    if: ${{ always() }}
    steps:
      - name: Download audit verdicts
        id: verdicts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: audit-status-*
          merge-multiple: true
          path: audit-status
      - name: Verify lockfile audits passed
        env:
          AUDIT_RESULT: ${{ needs.audit-lockfile.result }}
          RUST_RESULT: ${{ needs.audit-rust.result }}
          # Names must match the audit-lockfile steps exactly; the
          # ci-workflow-coverage test asserts they do.
          AUDIT_NAMES: 'root scripts consumer-prices-core blog-site pro-test docker-runtime railway-reconcile-control verification-desk'
          FAIL_ON_OUTAGE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          # On a run this workflow's concurrency group evicted (#8443), this
          # branch is the expected outcome and it reddens a SHA that has
          # already been superseded. Branch protection reads the head SHA, so
          # nothing acts on it. Keep the exit 1: an audit job cancelled for any
          # other reason has genuinely not audited every lockfile.
          if [ "$AUDIT_RESULT" = "cancelled" ]; then
            echo "::error::The dependency audit job was cancelled before every production lockfile was audited."
            exit 1
          fi

          if [ "$RUST_RESULT" = "cancelled" ]; then
            echo "::error::Rust advisory audit was cancelled."
            exit 1
          fi
          rust_status=$(cat audit-status/rust.txt 2>/dev/null || echo missing)
          case "$rust_status" in
            failed) echo "::error::Rust advisory audit failed; see audit-rust."; exit 1 ;;
            clean) ;;
            warning) echo "::warning::Rust audit has recorded decisions, no-fix advisories or maintenance notices; see audit-rust." ;;
            unavailable)
              echo "::warning::Rust dependencies were NOT audited ($rust_status); see audit-rust."
              if [ "$FAIL_ON_OUTAGE" = "1" ]; then exit 1; fi ;;
            missing) echo "::error::Rust audit produced no verdict; inspect tool setup and audit-rust before retrying."; exit 1 ;;
            *) echo "::error::Unknown Rust audit verdict: $rust_status"; exit 1 ;;
          esac

          missing=""
          failed=""
          for name in $AUDIT_NAMES; do
            file="audit-status/${name}.txt"
            if [ ! -f "$file" ]; then
              missing="${missing} ${name}"
            elif grep -q '^failed$' "$file"; then
              failed="${failed} ${name}"
            fi
          done

          # A real verdict always wins over an incomplete matrix.
          if [ -n "$failed" ]; then
            echo "::error::Production dependency audit reported blocking advisories for:${failed}. Open the audit-lockfile job for the specific advisory and why it blocks."
            exit 1
          fi

          if [ -n "$missing" ]; then
            echo "::warning title=Audit did not complete::No audit verdict was produced for:${missing}. The job failed BEFORE it could audit anything (e.g. 'Failed to resolve action download info'), so this is a CI/runner outage, not a dependency finding."
            if [ "$FAIL_ON_OUTAGE" = "1" ]; then
              echo "::error::The scheduled sweep requires every production lockfile to be audited; re-run once the runner recovers."
              exit 1
            fi
            exit 0
          fi

          if [ "$AUDIT_RESULT" != "success" ]; then
            echo "::warning::The audit job reported '${AUDIT_RESULT}', but every lockfile published a passing verdict; the failure was outside the audit step."
          fi
          echo "Every npm production lockfile was audited with no blocking advisories; Rust status: $rust_status."
