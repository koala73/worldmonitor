name: Lint Code

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    # Distinct check-run name — see the note in typecheck.yml (#5822). The job
    # id stays `changes` so `needs: changes` below keeps resolving.
    name: lint-changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --paginate --jq '.[].filename')
          CODE=$(echo "$FILES" | grep -vcE '\.md$|^docs/|^src-tauri/|^CHANGELOG\.md$|^LICENSE$|\.github/workflows/(build-desktop|docker-publish)\.yml$' || echo 0)
          echo "code=$( [ "$CODE" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

  biome:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:unicode
      - run: npm run lint
      - run: npm run lint:boundaries
      - run: npm run lint:api-contract
      - run: npm run sync:bootstrap-tier-keys:check
      - run: npm run lint:rate-limit-policies
      - run: npm run lint:premium-fetch
      - run: npm run security:vite-env-secrets
      - name: Markdown lint
        run: npm run lint:md
      - name: Version sync check
        run: npm run version:check

  public-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm run lint:public-docs

  mintlify-slugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/enforce-mintlify-reserved-slugs.mjs

  doc-anchors:
    # Nothing else catches a dead in-page anchor. mintlify-slugs above guards
    # only the reserved /mcp slug, `mint validate` passes in strict mode with
    # dead anchors present, and `mint broken-links` never checks fragments.
    # The export is the ground truth: Mintlify's slug rules are not safely
    # reproducible by hand (it strips ASCII parens but keeps full-width ones,
    # and keeps `&` and em-dashes), so the checker reads the ids it emitted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Export rendered docs
        working-directory: docs
        # Pinned: an unpinned global install would let a Mintlify release
        # change slugging under us and red this gate with no repo change.
        # Bump deliberately, and re-read the rules in check-doc-anchors.mjs
        # when you do.
        run: |
          npm i -g mint@4.2.860
          mint export --output "$RUNNER_TEMP/docs-export.zip"
      - name: Unpack export
        run: unzip -q "$RUNNER_TEMP/docs-export.zip" -d "$RUNNER_TEMP/docs-export"
      - name: Every in-page anchor resolves
        run: node scripts/check-doc-anchors.mjs "$RUNNER_TEMP/docs-export"
