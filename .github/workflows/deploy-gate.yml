name: Deploy Gate
run-name: Deploy Gate ${{ github.event.workflow_run.head_sha || github.event.inputs.sha || github.event_name }}

# Checks whether all required PR smoke gates have passed for the same commit SHA.
# Posts a commit status on the PR's head SHA so branch protection can see it.
#
# Also runs on a 30-minute schedule (and on demand) as a self-healing sweep
# (#5479): event-driven evaluation alone can strand a PR — the check-runs API
# can serve stale reads (~1 min normally, longer during GitHub degradation),
# and the last workflow_run event for a SHA is the last time anything
# re-evaluates. For 24 hours after a pending status is published, the sweep
# re-evaluates it. Older pending heads remain blocked and are listed in the
# run summary for a branch update or exact-SHA dispatch. Failed gates stay
# blocked until a workflow event or dispatch evaluates them again. Successes
# with an old required-check contract are always invalidated (#5851).

on:
  workflow_run:
    workflows: ["Test", "Typecheck", "Lint Code", "Security Audit", "Stacked Merge Guard", "Proto Generation Check"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: Evaluate this commit SHA instead of sweeping open PRs
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      discovery: ${{ steps.plan.outputs.discovery }}
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: plan
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.sha }}
        run: bash -e .github/scripts/deploy-gate.sh discover

  invalidate:
    needs: discover
    if: ${{ needs.discover.result == 'success' && needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: deploy-gate-${{ matrix.sha }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - env:
          SHA: ${{ matrix.sha }}
          RESULT_PATH: ${{ runner.temp }}/invalidation/result.json
        run: |
          mkdir -p "$(dirname "$RESULT_PATH")"
          bash -e .github/scripts/deploy-gate.sh invalidate
      - if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deploy-gate-invalidate-${{ github.run_attempt }}-${{ matrix.sha }}
          path: ${{ runner.temp }}/invalidation/result.json
          if-no-files-found: error
          retention-days: 1

  recover:
    needs: [discover, invalidate]
    if: ${{ always() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      invalidation_failed: ${{ steps.plan.outputs.invalidation_failed }}
      protocol_failed: ${{ steps.plan.outputs.protocol_failed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - if: ${{ needs.discover.outputs.count != '0' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deploy-gate-invalidate-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/invalidations
      - id: plan
        env:
          DISCOVERY: ${{ needs.discover.outputs.discovery }}
          RESULTS_DIR: ${{ runner.temp }}/invalidations
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash -e .github/scripts/deploy-gate.sh recover

  evaluate:
    needs: recover
    if: ${{ always() && needs.recover.result == 'success' && needs.recover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.recover.outputs.matrix) }}
    concurrency:
      group: deploy-gate-${{ matrix.sha }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check required PR gates passed for this SHA
        env:
          SHA: ${{ matrix.sha }}
          CHECK_ATTEMPTS: ${{ matrix.check_attempts }}
        run: bash -e .github/scripts/deploy-gate.sh evaluate

  gate:
    needs: [discover, invalidate, recover, evaluate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate deploy gate execution
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in jobs.items() if job["result"] in ("failure", "cancelled")]
          for phase, planner in (("invalidate", "discover"), ("evaluate", "recover")):
              if jobs[phase]["result"] == "skipped" and not (
                  jobs[planner]["result"] == "success"
                  and jobs[planner]["outputs"].get("count") == "0"
              ):
                  failed.append(phase)
          for phase in ("discover", "recover"):
              if jobs[phase]["result"] != "success":
                  failed.append(phase)
          for flag in ("invalidation_failed", "protocol_failed"):
              if jobs["recover"]["outputs"].get(flag) != "false":
                  failed.append(flag)
          if failed:
              print("::error::Deploy Gate execution failed: " + ", ".join(sorted(set(failed))))
              sys.exit(1)
          PY
