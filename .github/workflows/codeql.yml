name: CodeQL

on:
  # PRs are not scanned: CodeQL does not gate merges, and a full JS/TS scan takes
  # ~10 minutes. Findings surface on main minutes after merge instead.
  push:
    branches: [main]
  schedule:
    # Sunday: all six languages, whatever pushes selected during the week.
    - cron: '23 3 * * 0'
  workflow_dispatch:

# Pushes share one group: a running scan is never cancelled and a newer push replaces
# a pending one, so a burst of merges coalesces into one running and one pending scan. Scheduled and manual scans get their own
# group, so a push cannot replace them.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    if: (github.event_name != 'schedule' || github.repository == 'koala73/worldmonitor')
    name: codeql-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      languages: ${{ steps.select.outputs.languages }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: select
        with:
          script: |
            const all = ['actions', 'go', 'javascript-typescript', 'python', 'ruby', 'rust'];
            const emit = languages => core.setOutput('languages', JSON.stringify(languages));
            if (context.eventName !== 'push') {
              emit(all);
              return;
            }
            try {
              // Diff from the last successful scan, not from the push's `before`: a newer push
              // replaces a pending run, and the replaced push's changes must still be scanned.
              const { data: { workflow_runs: [last] } } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'codeql.yml', branch: 'main', event: 'push', status: 'success', per_page: 1,
              });
              if (!last?.head_sha) throw new Error('No earlier successful push scan on main');
              const { data: diff } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${last.head_sha}...${context.sha}`,
              });
              // The compare API lists at most 300 files; never trust a capped or non-linear diff.
              if (diff.status !== 'ahead' || !diff.files?.length || diff.files.length >= 300) {
                throw new Error(`Diff since ${last.head_sha} is ${diff.status} with ${diff.files?.length ?? 0} files`);
              }
              const paths = diff.files.flatMap(file => [file.filename, ...(file.previous_filename ? [file.previous_filename] : [])]);
              if (paths.some(path => typeof path !== 'string' || !path.length)) {
                throw new Error('Invalid changed file paths');
              }
              if (paths.some(path => /^\.github\/(workflows\/codeql\.yml$|codeql[/.])/.test(path))) {
                emit(all);
                return;
              }
              const patterns = {
                actions: /(^\.github\/workflows\/.*\.ya?ml$|(^|\/)action\.ya?ml$)/,
                go: /(\.go$|(^|\/)go\.(mod|sum|work)(\.sum)?$)/,
                'javascript-typescript': /(\.[cm]?[jt]sx?$|\.vue$|\.html?$|(^|\/)(package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?|tsconfig[^/]*\.json)$)/,
                python: /(\.pyi?$|(^|\/)(pyproject\.toml|requirements[^/]*\.txt|Pipfile(\.lock)?|poetry\.lock|uv\.lock)$)/,
                ruby: /(\.(rb|erb|gemspec)$|(^|\/)(Gemfile(\.lock)?|Rakefile)$)/,
                rust: /(\.rs$|(^|\/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?)$|(^|\/)\.cargo\/)/,
              };
              emit(all.filter(language => paths.some(path => patterns[language].test(path))));
            } catch (error) {
              core.warning(`Scanning all languages: ${error.message}`);
              emit(all);
            }

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: ${{ (needs.changes.outputs.languages != '[]') && (github.event_name != 'schedule' || github.repository == 'koala73/worldmonitor') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.language == 'go'
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}

  # codeql-action saves an overlay-base database (~1.3 GB for JS) under a new key on every
  # default-branch run and never deletes old ones. PRs restore only the newest per group,
  # and cache eviction is least-recently-accessed, so stale bases push out hot caches.
  prune-overlay-bases:
    needs: analyze
    if: ${{ (!cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (github.event_name != 'schedule' || github.repository == 'koala73/worldmonitor') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
      - run: node .github/scripts/prune-codeql-overlay-bases.mjs --ref "$GITHUB_REF"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
