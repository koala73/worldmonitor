name: CodeQL

on:
  # Not on PRs or pushes: CodeQL does not gate merges, and a full scan costs ~30
  # runner-minutes, most of it JS/TS. Scanning every push ran ~21 times a day
  # (~790 runner-minutes) and held runner slots merges were queueing for; a
  # finding surfaces after the next daily scan instead.
  schedule:
    # Daily, all six languages.
    - cron: '23 3 * * *'
  workflow_dispatch:

# Scheduled and manual scans use separate groups, and neither cancels a running scan.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: (github.event_name != 'schedule' || github.repository == 'koala73/worldmonitor')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, go, javascript-typescript, python, ruby, rust]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.language == 'go'
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}

  # codeql-action saves an overlay-base database (~1.3 GB for JS) under a new key on every
  # default-branch run and never deletes old ones. PRs restore only the newest per group,
  # and cache eviction is least-recently-accessed, so stale bases push out hot caches.
  prune-overlay-bases:
    needs: analyze
    if: ${{ (!cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (github.event_name != 'schedule' || github.repository == 'koala73/worldmonitor') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
      - run: node .github/scripts/prune-codeql-overlay-bases.mjs --ref "$GITHUB_REF"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
