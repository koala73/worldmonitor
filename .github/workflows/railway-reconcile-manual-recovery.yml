name: Railway Reconcile Manual Recovery
run-name: Railway recovery · ${{ inputs.decision }} · run ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      decision:
        description: Closed operator decision
        required: true
        type: choice
        options:
          - resolve_pre_mutation_hold
          - accept_observed_convergence
          - authorize_current_main_retry
      prior_id:
        description: Exact prior attempt or dispatch-hold ID
        required: true
        type: string
      expected_current_head:
        description: Exact 40-character current main SHA
        required: true
        type: string
      approver:
        description: Independent audit approver identity; environment protection verifies it externally
        required: true
        type: string
      reason:
        description: Sanitized 10-240 character audit reason
        required: true
        type: string
      evidence_json:
        description: Closed decision-specific evidence JSON
        required: true
        type: string

permissions:
  contents: read
  actions: read
  statuses: read

jobs:
  reject_non_main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject non-main recovery invocation
        run: |
          echo "::error::Railway reconciliation recovery must run from refs/heads/main"
          exit 1

  proof:
    name: Read-only recovery proof
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ingestion-acceptance-production-verification
      deployment: false
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      proof: ${{ steps.proof.outputs.proof }}
    steps:
      - name: Reject retry authorization before lease-aware cutover
        if: inputs.decision == 'authorize_current_main_retry' && vars.RAILWAY_RECONCILE_CUTOVER_ACTIVE != 'true'
        run: |
          echo "::error::The lease-aware target workflow cutover is not active."
          exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          ref: refs/heads/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned Railway Viewer CLI
        if: inputs.decision != 'resolve_pre_mutation_hold'
        run: npm install --global @railway/cli@5.30.1
      - name: Prove exact green main, inactive old work, and read-only Railway state
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_RECONCILE_VIEWER_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RECOVERY_DECISION: ${{ inputs.decision }}
          RECOVERY_PRIOR_ID: ${{ inputs.prior_id }}
          RECOVERY_EXPECTED_HEAD: ${{ inputs.expected_current_head }}
          RECOVERY_REASON: ${{ inputs.reason }}
          RECOVERY_ACTOR: ${{ github.actor }}
          RECOVERY_APPROVER: ${{ inputs.approver }}
          RECOVERY_EVIDENCE_JSON: ${{ inputs.evidence_json }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: node scripts/resolve-railway-reconcile-control.mjs proof

  resolve:
    name: Protected operator resolution
    needs: [proof]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # GitHub does not expose the approving reviewer identity as a trustworthy
    # workflow expression. The required approver input is an audit assertion,
    # not a claim that YAML discovered the live reviewer. Required reviewers,
    # prevent-self-review, and live reviewer identity/evidence are an
    # EXTERNAL PROVISIONING GATE. YAML proves only the environment target.
    environment:
      name: ingestion-acceptance-production-breakglass
      deployment: false
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      dispatch_authorized: ${{ steps.resolve.outputs.dispatch_authorized }}
      expected_head: ${{ steps.resolve.outputs.expected_head }}
      recovery_attempt_id: ${{ steps.resolve.outputs.recovery_attempt_id }}
      superseding_generation: ${{ steps.resolve.outputs.superseding_generation }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          ref: refs/heads/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned Railway Viewer CLI
        if: inputs.decision != 'resolve_pre_mutation_hold'
        run: npm install --global @railway/cli@5.30.1
      - name: Record immutable operator resolution
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_RECONCILE_CONTROL_URL: ${{ vars.RAILWAY_RECONCILE_CONTROL_URL }}
          RAILWAY_RECONCILE_OPERATOR_HMAC: ${{ secrets.RAILWAY_RECONCILE_OPERATOR_HMAC }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_RECONCILE_VIEWER_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RECOVERY_PROOF: ${{ needs.proof.outputs.proof }}
          RECOVERY_DECISION: ${{ inputs.decision }}
          RECOVERY_PRIOR_ID: ${{ inputs.prior_id }}
          RECOVERY_EXPECTED_HEAD: ${{ inputs.expected_current_head }}
          RECOVERY_REASON: ${{ inputs.reason }}
          RECOVERY_ACTOR: ${{ github.actor }}
          RECOVERY_APPROVER: ${{ inputs.approver }}
          RECOVERY_EVIDENCE_JSON: ${{ inputs.evidence_json }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: node scripts/resolve-railway-reconcile-control.mjs resolve

  dispatch-retry:
    name: Dispatch ordinary lease-aware retry
    needs: [resolve]
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && needs.resolve.outputs.dispatch_authorized == 'true' && vars.RAILWAY_RECONCILE_CUTOVER_ACTIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      statuses: read
    outputs:
      workflow_run_id: ${{ steps.verify.outputs.workflow_run_id }}
      run_attempt: ${{ steps.verify.outputs.run_attempt }}
    steps:
      # This write-capable job has no checkout, third-party action, control
      # credential, or Railway secret.
      - name: Revalidate exact main and green gate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ needs.resolve.outputs.expected_head }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Authorized head is not an exact commit SHA."
            exit 1
          fi
          ref_response=$(mktemp)
          status_response=$(mktemp)
          trap 'rm -f "$ref_response" "$status_response"' EXIT
          if ! ref_status=$(curl --fail-with-body --silent --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --output "$ref_response" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main"); then
            echo "::error::Exact main preflight was unreadable."
            exit 1
          fi
          if [ "$ref_status" != '200' ]; then
            echo "::error::Exact main preflight did not return HTTP 200."
            exit 1
          fi
          actual_head=$(jq -er '.object.sha' "$ref_response")
          if [ "$actual_head" != "$EXPECTED_HEAD" ]; then
            echo "::error::Main moved after operator retry authorization."
            exit 1
          fi
          if ! gate_status=$(curl --fail-with-body --silent --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --output "$status_response" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/status?per_page=100"); then
            echo "::error::Exact gate preflight was unreadable."
            exit 1
          fi
          if [ "$gate_status" != '200' ]; then
            echo "::error::Exact gate preflight did not return HTTP 200."
            exit 1
          fi
          if ! jq -e '
              (.statuses | type) == "array"
              and ([.statuses[] | select(.context == "gate")] | length) == 1
              and ([.statuses[] | select(.context == "gate")][0].state == "success")
            ' "$status_response" >/dev/null; then
            echo "::error::The authorized head no longer has one exact green gate status."
            exit 1
          fi

      - name: Dispatch correlated superseding generation
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ needs.resolve.outputs.expected_head }}
          RECOVERY_ATTEMPT_ID: ${{ needs.resolve.outputs.recovery_attempt_id }}
          SUPERSEDING_GENERATION: ${{ needs.resolve.outputs.superseding_generation }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_HEAD"
          test -n "$RECOVERY_ATTEMPT_ID"
          test -n "$SUPERSEDING_GENERATION"
          payload=$(jq -nc \
            --arg head "$EXPECTED_HEAD" \
            --arg recovery "$RECOVERY_ATTEMPT_ID" \
            '{ref:"main",return_run_details:true,inputs:{dryRun:false,recovery_attempt_id:$recovery,expected_head_sha:$head}}')
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          if ! http_status=$(curl --fail-with-body --silent --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'Content-Type: application/json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --data "$payload" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/railway-deploy-trigger.yml/dispatches"); then
            echo "::error::GitHub dispatch did not return a definitive response; the durable hold remains unresolved."
            exit 1
          fi
          if [ "$http_status" != '200' ]; then
            echo "::error::GitHub dispatch did not return the required 200 run-details response; the durable hold remains unresolved."
            exit 1
          fi
          if ! workflow_run_id=$(jq -er '
              if type == "object"
                and (.workflow_run_id | type) == "number"
                and .workflow_run_id > 0
                and .workflow_run_id == (.workflow_run_id | floor)
              then (.workflow_run_id | tostring)
              else error("invalid workflow dispatch response")
              end
            ' "$response_file"); then
            echo "::error::GitHub accepted the dispatch but its exact workflow_run_id could not be identified; the durable hold remains unresolved."
            exit 1
          fi
          if [[ ! "$workflow_run_id" =~ ^[1-9][0-9]{0,23}$ ]]; then
            echo "::error::GitHub returned an invalid workflow_run_id; the durable hold remains unresolved."
            exit 1
          fi
          echo "dispatched_workflow_run_id=$workflow_run_id" >> "$GITHUB_OUTPUT"

      - name: Verify exact dispatched Railway run
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ needs.resolve.outputs.expected_head }}
          WORKFLOW_RUN_ID: ${{ steps.dispatch.outputs.dispatched_workflow_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Authorized head is not an exact commit SHA."
            exit 1
          fi
          if [[ ! "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]{0,23}$ ]]; then
            echo "::error::Dispatched workflow run ID is invalid."
            exit 1
          fi
          run_response=$(mktemp)
          trap 'rm -f "$run_response"' EXIT
          if ! run_status=$(curl --fail-with-body --silent --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --output "$run_response" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID"); then
            echo "::error::The exact dispatched run could not be read; the durable hold remains unresolved."
            exit 1
          fi
          if [ "$run_status" != '200' ]; then
            echo "::error::The exact dispatched run did not return HTTP 200; the durable hold remains unresolved."
            exit 1
          fi
          if ! jq -e \
              --arg run_id "$WORKFLOW_RUN_ID" \
              --arg expected_head "$EXPECTED_HEAD" '
              type == "object"
              and ((.id | tostring) == $run_id)
              and (.event == "workflow_dispatch")
              and (.head_branch == "main")
              and (.head_sha == $expected_head)
              and (.run_attempt == 1)
              and ((.path | type) == "string")
              and ((.path | split("@")[0]) == ".github/workflows/railway-deploy-trigger.yml")
            ' "$run_response" >/dev/null; then
            echo "::error::GitHub returned a run that does not exactly match the authorized target."
            exit 1
          fi
          echo "workflow_run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=1" >> "$GITHUB_OUTPUT"

  bind-dispatched-run:
    name: Bind exact dispatched run to recovery hold
    needs: [resolve, dispatch-retry]
    if: github.ref == 'refs/heads/main' && needs.resolve.outputs.dispatch_authorized == 'true' && vars.RAILWAY_RECONCILE_CUTOVER_ACTIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ingestion-acceptance-production-watchdog
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.expected_head }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Bind exact dispatched run to durable hold
        env:
          RAILWAY_RECONCILE_CONTROL_URL: ${{ vars.RAILWAY_RECONCILE_CONTROL_URL }}
          RAILWAY_RECONCILE_WATCHDOG_HMAC: ${{ secrets.RAILWAY_RECONCILE_WATCHDOG_HMAC }}
          EXPECTED_HEAD: ${{ needs.resolve.outputs.expected_head }}
          RECOVERY_ATTEMPT_ID: ${{ needs.resolve.outputs.recovery_attempt_id }}
          WORKFLOW_RUN_ID: ${{ needs.dispatch-retry.outputs.workflow_run_id }}
          RUN_ATTEMPT: ${{ needs.dispatch-retry.outputs.run_attempt }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { RailwayReconcileControlClient } from './scripts/railway-reconcile-control-client.mjs';

          const runAttempt = Number(process.env.RUN_ATTEMPT);
          if (!/^[0-9a-f]{40}$/i.test(process.env.EXPECTED_HEAD ?? '')) {
            throw new Error('expected head must be an exact commit SHA');
          }
          if (!/^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$/.test(process.env.RECOVERY_ATTEMPT_ID ?? '')) {
            throw new Error('recovery attempt id is invalid');
          }
          if (!/^[1-9][0-9]{0,23}$/.test(process.env.WORKFLOW_RUN_ID ?? '')) {
            throw new Error('workflow run id is invalid');
          }
          if (runAttempt !== 1) throw new Error('manual recovery must bind run attempt 1');

          const client = new RailwayReconcileControlClient({
            baseUrl: process.env.RAILWAY_RECONCILE_CONTROL_URL,
            role: 'watchdog',
            secret: process.env.RAILWAY_RECONCILE_WATCHDOG_HMAC,
          });
          const response = await client.bindRun({
            recoveryAttemptId: process.env.RECOVERY_ATTEMPT_ID,
            headSha: process.env.EXPECTED_HEAD,
            runId: process.env.WORKFLOW_RUN_ID,
            runAttempt,
          });
          const hold = response.data?.dispatchHold;
          if (response.outcome !== 'DISPATCH_RUN_BOUND'
            || hold?.state !== 'RUN_BOUND'
            || hold?.recoveryAttemptId !== process.env.RECOVERY_ATTEMPT_ID
            || hold?.headSha !== process.env.EXPECTED_HEAD
            || hold?.runId !== process.env.WORKFLOW_RUN_ID
            || hold?.runAttempt !== runAttempt) {
            throw new Error('controller did not confirm the exact RUN_BOUND transition');
          }
          console.log('RUN_BOUND');
          NODE
