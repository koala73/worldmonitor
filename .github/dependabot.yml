version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Daily, not weekly. Version bumps are grouped into one PR, and the
    # minor/patch case is auto-merged by
    # .github/workflows/dependabot-auto-merge.yml once the required checks
    # pass, so a shorter interval shortens the delay before a fix lands without
    # adding review work. A group carrying a major still waits for a human.
    schedule:
      interval: "daily"
    # The default is 5, and it caps VERSION updates only — the same distinction
    # the npm block below relies on, read the other way round. Every action in
    # this repository is SHA-pinned across dozens of workflows, so the queue
    # fills easily. Once the cap is reached Dependabot stops opening version PRs
    # silently, naming nothing. 99, not 0: zero does not mean "no limit", it
    # switches version updates off entirely, which is what the npm and cargo
    # blocks use it for on purpose.
    open-pull-requests-limit: 99
    groups:
      # One PR for every action version bump instead of one per action.
      #
      # No `update-types` filter, deliberately. Restricting the group to
      # minor/patch reads as though majors would then arrive as their own PRs.
      # They would not: dependabot-core's DependencyGroup#contains? matches on
      # patterns / exclude-patterns / dependency-type and never reads
      # update-types, so once this group has an open PR every action it matches
      # is marked handled — majors included — and no individual PR is raised for
      # them at all (dependabot/dependabot-core#14202; the fix, #16113, is open
      # and unmerged). With `patterns: ["*"]` the group matches every action, so
      # on a daily interval that suppression would be close to permanent.
      #
      # Majors therefore ride in this group, and it is
      # .github/workflows/dependabot-auto-merge.yml that keeps them away from
      # auto-merge: fetch-metadata reports the HIGHEST semver change across the
      # whole group, so a group containing a major fails that workflow's
      # minor/patch condition and waits for a human. That is the guarantee that
      # actually matters — a major of an action can change what ends up in the
      # manifest it produces (docker/build-push-action and provenance
      # attestations are the live example in docker-publish.yml).
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  # The three docker directories, folded into one entry with `directories:` the
  # way the npm block below already does it. They only ever differed by path:
  # the same `ignore` rule was repeated verbatim in all three, so keeping them
  # apart meant maintaining that rule in triplicate.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker"
      - "/consumer-prices-core"
    # Daily for the same reason as the actions above, and with one extra: the
    # base digests these bumps move are the only thing that makes a rebuilt
    # image genuinely fresher, because every FROM line in the repository is
    # pinned to an immutable digest and tests/ci-workflow-coverage.test.mts
    # requires it. On a weekly interval a base fix could sit unproposed for
    # seven days before the weekly rebuild in docker-publish.yml could even see
    # it.
    schedule:
      interval: "daily"
    # More Dockerfiles live under these three directories than the default cap
    # of 5 allows for, so a slow week of reviews can silently stop new base
    # bumps from being proposed at all.
    open-pull-requests-limit: 99
    ignore:
      # Hold the Node base image at the current LTS major (24). Dependabot still
      # proposes 24.x minor/patch bumps; moving to the next major (25/26) is a
      # deliberate manual step once it reaches LTS. See PR #4709.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Same treatment for the Umami Postgres base (Dockerfile.umami,
      # Dockerfile.umami-retention): a Postgres major is a data-migration
      # decision, never a base-image refresh, and without this rule it would
      # join the group below like any other bump.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      # No `update-types` filter here, and unlike the actions group that is not
      # a workaround: a digest-only bump (`nginx` from `db35bfc` to `72ba65e`,
      # PR #7602) is the common case for these Dockerfiles, and filtering on
      # semver update types would leave it ungrouped. The majors that could
      # otherwise join the group are excluded by the `ignore` rules above.
      docker-base-images:
        applies-to: version-updates
        patterns: ["*"]

  # Every npm manifest in the repo. Without this block Dependabot raises alerts
  # but can never open a fix PR for them, which is how 69 open advisories
  # accumulated while `security-audit.yml` stayed green — the gate only blocks on
  # high-severity PRODUCTION findings, so everything below that floor piles up
  # unattended. Omitted on purpose:
  #   /docker            — its manifest is `runtime-package.json`, a non-standard
  #                        name Dependabot cannot discover. Covered by the audit
  #                        matrix instead.
  #   /cli               — declares no dependencies at all.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/blog-site"
      - "/consumer-prices-core"
      - "/docker/umami/runtime"
      - "/pro-test"
      - "/scripts"
      - "/workers/api-cors-preflight"
      - "/workers/railway-reconcile-control"
    schedule:
      interval: "weekly"
    # Security updates only, on purpose. open-pull-requests-limit caps VERSION
    # updates exclusively — security-update PRs are drawn from a separate
    # internal budget and never consume this one — so 0 switches off routine
    # weekly bumps across eight directories while leaving advisory fixes, and
    # the grouping below (which does apply to them), fully intact. Raising this
    # above 0 is how you would later opt into routine version bumps; do that
    # deliberately, with an `ignore` rule for semver-major, rather than by
    # accident. See PR #7554.
    open-pull-requests-limit: 0
    groups:
      # One PR per directory per advisory batch instead of one per package.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # The desktop app. src-tauri/Cargo.lock has no general advisory scan — there
  # is no `cargo audit` or `cargo-deny` step anywhere under .github/. The one
  # Rust gate, scripts/check-rust-security-floors.mjs, is a hand-maintained
  # allow-list of recorded floors and currently covers exactly one crate
  # (tauri >= 2.11.1), so an advisory against any other crate passes unnoticed.
  # That matters because build-desktop.yml ships signed binaries for five
  # platforms, two of them Linux, where reqwest -> native-tls -> openssl is the
  # live TLS implementation.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    # Same reasoning as the npm entry above: security updates only.
    open-pull-requests-limit: 0
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
