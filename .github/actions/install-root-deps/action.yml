name: Install root dependencies
description: Restore the exact Node 24 dependency tree or install it, then prepare repository inventory.
runs:
  using: composite
  steps:
    - name: Restore root dependencies
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: node-modules
      with:
        path: node_modules
        key: node-modules-v2-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json', 'package.json', '.npmrc', 'vendor/braces/**') }}
    - name: Install root dependencies on cache miss
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
    - name: Save clean root dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: node_modules
        key: ${{ steps.node-modules.outputs.cache-primary-key }}
    - name: Regenerate inventory on cache hit
      if: steps.node-modules.outputs.cache-hit == 'true'
      shell: bash
      run: npm run inventory:facts
