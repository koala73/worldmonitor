syntax = "proto3";

package worldmonitor.sanctions.v1;

import "sebuf/http/annotations.proto";

// LookupSanctionEntityRequest screens the seeded OFAC SDN, OFAC Consolidated, Canada SEMA and US CSL index.
message LookupSanctionEntityRequest {
  // Search a name, up to 10 retained aliases per entity, or an exact IMO identifier (2-200 characters).
  string q = 1 [(sebuf.http.query) = { name: "q" }];
  // Maximum number of matching sanctioned entities to return.
  int32 max_results = 2 [(sebuf.http.query) = { name: "max_results" }];
}

// SanctionEntityMatch is a compact entity match from the lookup index.
message SanctionEntityMatch {
  string id = 1;
  string name = 2;
  string entity_type = 3;
  repeated string country_codes = 4;
  repeated string programs = 5;
}

// LookupSanctionEntityResponse contains seeded matches ranked by token-set Jaro-Winkler score.
// A match is a lead to confirm with the issuing agency, not legal advice.
message LookupSanctionEntityResponse {
  repeated SanctionEntityMatch results = 1;
  int32 total = 2;
  // Comma-separated lists searched; "seeded" when q is rejected before lookup;
  // "unavailable" when no valid index records are available.
  string source = 3;
}
