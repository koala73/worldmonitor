syntax = "proto3";

package worldmonitor.sanctions.v1;

// CountrySanctionsPressure summarizes designation volume and recent additions by country.
message CountrySanctionsPressure {
  string country_code = 1;
  string country_name = 2;
  int32 entry_count = 3;
  int32 new_entry_count = 4;
  // Assets with a direct country association only. Zero does not mean this
  // country has no sanctioned vessels; flag counts are in flagRegistries.
  int32 vessel_count = 5;
  // Assets with a direct country association only; registry counts are in
  // ListSanctionsPressureResponse.flagRegistries, not this field.
  int32 aircraft_count = 6;
}
