syntax = "proto3";

package worldmonitor.forecast.v1;

import "sebuf/http/annotations.proto";

message ForecastSignal {
  string type = 1;
  string value = 2;
  double weight = 3;
}

message CascadeEffect {
  string domain = 1;
  string effect = 2;
  double probability = 3;
}

message CalibrationInfo {
  string market_title = 1;
  double market_price = 2;
  double drift = 3;
  string source = 4;
  // Probability before the market blend.
  optional double internal_probability = 5;
  // Probability after the market blend and domain cap.
  optional double market_blended_probability = 6;
}

message Perspectives {
  string strategic = 1;
  string regional = 2;
  string contrarian = 3;
}

// kind and operator are strings, not enums, so a new value never needs a
// proto migration to land in the 45-day history.

// Resolution spec that makes a forecast scoreable. kind is "hard" (resolved by
// comparing metric_key from source_feed to threshold with operator ">=", "<="
// or "crosses") or "judged" (an LLM judge answers question). kind and deadline
// are always set; other fields apply per kind. baseline_value applies only to
// "crosses" specs. A judged spec's threshold is absent, never 0.
message ResolutionSpec {
  string kind = 1;
  optional string metric_key = 2;
  optional string operator = 3;
  optional double threshold = 4;
  optional double baseline_value = 5;
  optional string window = 6;
  int64 deadline = 7 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  optional string source_feed = 8;
  optional string question = 9;
}

// Deprecated (#8967): newly seeded payloads omit it; a payload cached
// before the change may carry it until the next seed-forecasts run. The
// seeder keeps these unscored horizon curves internal for horizon scoring.
message Projections {
  double h24 = 1;
  double d7 = 2;
  double d30 = 3;
}

message ForecastCaseEvidence {
  string type = 1;
  string summary = 2;
  double weight = 3;
}

message ForecastActor {
  string id = 1;
  string name = 2;
  string category = 3;
  string role = 4;
  repeated string objectives = 5;
  repeated string constraints = 6;
  repeated string likely_actions = 7;
  double influence_score = 8;
}

message ForecastWorldState {
  string summary = 1;
  repeated string active_pressures = 2;
  repeated string stabilizers = 3;
  repeated string key_unknowns = 4;
}

message ForecastBranchRound {
  int32 round = 1;
  string focus = 2;
  repeated string developments = 3;
  repeated string actor_moves = 4;
  double probability_shift = 5;
}

message ForecastBranch {
  string kind = 1;
  string title = 2;
  string summary = 3;
  string outcome = 4;
  double projected_probability = 5;
  repeated ForecastBranchRound rounds = 6;
}

message ForecastCase {
  repeated ForecastCaseEvidence supporting_evidence = 1;
  repeated ForecastCaseEvidence counter_evidence = 2;
  repeated string triggers = 3;
  repeated string actor_lenses = 4;
  string base_case = 5;
  string escalatory_case = 6;
  string contrarian_case = 7;
  string change_summary = 8;
  repeated string change_items = 9;
  repeated ForecastActor actors = 10;
  ForecastWorldState world_state = 11;
  repeated ForecastBranch branches = 12;
}

message Forecast {
  string id = 1;
  string domain = 2;
  string region = 3;
  string title = 4;
  string scenario = 5;
  string feed_summary = 19;
  double probability = 6;
  double confidence = 7;
  string time_horizon = 8;
  repeated ForecastSignal signals = 9;
  repeated CascadeEffect cascades = 10;
  // "rising", "falling", or "stable" versus the prior snapshot, with a
  // +/-0.05 deadband on the probability delta.
  string trend = 11;
  double prior_probability = 12;
  CalibrationInfo calibration = 13;
  int64 created_at = 14 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  int64 updated_at = 15 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  Perspectives perspectives = 16;
  // Deprecated (#8967): newly seeded payloads omit it; a payload cached
  // before the change may carry it until the next seed-forecasts run.
  // Kept for v1 wire compatibility.
  Projections projections = 17 [deprecated = true];
  ForecastCase case_file = 18;
  // Score delta from the deep simulation pipeline: +0.08 to +0.12, or
  // -0.12 or -0.15; 0 when it has not run.
  double simulation_adjustment = 20;
  // Confidence in [0, 1] of the matched simulation top path; 0 when not set.
  double sim_path_confidence = 21;
  // True when a negative adjustment crossed the 0.50 acceptance threshold.
  bool demoted_by_simulation = 22;
  // Outcome contract for this forecast (see ResolutionSpec); null when the
  // resolution enrichment pass has not run.
  ResolutionSpec resolution = 23;
}
