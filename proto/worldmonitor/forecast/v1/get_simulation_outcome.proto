syntax = "proto3";

package worldmonitor.forecast.v1;

import "sebuf/http/annotations.proto";
import "buf/validate/validate.proto";

message GetSimulationOutcomeRequest {
  // Optional run ID (epoch ms, hyphen, 1-64 char suffix; max 128). Returns that
  // run's outcome within 24h retention, processing=true while it is queued, or
  // the latest outcome with a note. Empty returns the latest outcome.
  string run_id = 1 [
    (sebuf.http.query) = { name: "runId" },
    (buf.validate.field).string.max_len = 128,
    (buf.validate.field).string.pattern = "^([0-9]{13,}-[A-Za-z0-9-]{1,64})?$",
    (sebuf.http.field_examples) = { values: ["1789387200000-abc123"] }
  ];
}

message GetSimulationOutcomeResponse {
  bool found = 1;
  string run_id = 2;
  reserved 3;
  reserved "outcome_key";
  string schema_version = 4;
  int32 theater_count = 5;
  // Unix timestamp in milliseconds.
  int64 generated_at = 6 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // Set when run_id was supplied but the latest outcome is returned instead; the
  // text says why (run expired or not found, or its by-run record failed).
  string note = 7;
  // Populated when the Redis lookup failed. Distinguish from healthy not-found (found=false, error="").
  // Value: "redis_unavailable" on Redis errors.
  string error = 8;
  // JSON-encoded Array<{ theaterId, theaterLabel, stateKind, topPaths: [{label,
  // summary, confidence, keyActors}], dominantReactions, stabilizers,
  // invalidators }>; empty when found=false.
  string theater_summaries_json = 9;
  // True when the supplied runId is still queued, as opposed to expired.
  bool processing = 10;
  // Number of theaters eligible for simulation in the package used by this outcome.
  int32 eligible_theater_count = 11;
  // Number of eligible theaters that failed before producing a Round 2 result.
  int32 failed_theater_count = 12;
  // True when eligible_theater_count > 0 and no theater produced an outcome.
  bool all_theaters_failed = 13;
  // Machine-readable completion status. Current values:
  // "completed", "partial", "no_eligible_theaters", or "all_theaters_failed".
  string completion_status = 14;
}
