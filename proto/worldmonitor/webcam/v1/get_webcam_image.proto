syntax = "proto3";

package worldmonitor.webcam.v1;

import "sebuf/http/annotations.proto";

message GetWebcamImageRequest {
  // Webcam identifier to resolve into image and player URLs.
  string webcam_id = 1 [(sebuf.http.query) = {name: "webcam_id"}];
}

message GetWebcamImageResponse {
  string thumbnail_url = 1;
  string player_url = 2;
  string title = 3;
  string windy_url = 4;
  // Latest image update as an ISO-8601 string; empty if unknown or unavailable.
  string last_updated = 5;
  string error = 6;
  // URL resolution time in Unix milliseconds, not image capture time.
  optional int64 resolved_at = 7 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // snapshot, timelapse or live. A live URL does not confirm the camera is online.
  optional string media_type = 8;
}
