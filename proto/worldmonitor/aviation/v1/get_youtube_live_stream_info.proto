syntax = "proto3";

package worldmonitor.aviation.v1;

import "sebuf/http/annotations.proto";

// GetYoutubeLiveStreamInfoRequest names the YouTube video to look up.
message GetYoutubeLiveStreamInfoRequest {
  // Deprecated: YouTube channel handle or ID. Channel live detection is retired; a channel-only query returns error "channel_live_detection_retired".
  string channel = 1 [deprecated = true, (sebuf.http.query) = {name: "channel"}];
  // YouTube video ID to name.
  string video_id = 2 [(sebuf.http.query) = {name: "video_id"}];
}

// GetYoutubeLiveStreamInfoResponse containing the oEmbed lookup result.
message GetYoutubeLiveStreamInfoResponse {
  // Video ID that was looked up.
  string video_id = 1;
  // Always false: oEmbed does not report whether a video is live.
  bool is_live = 2 [deprecated = true];
  // Deprecated: true only when the oEmbed lookup succeeded, so it now carries exactly error == "".
  bool channel_exists = 3 [deprecated = true];
  // Human-readable channel name.
  string channel_name = 4;
  // Always empty: YouTube manifest URLs are no longer returned.
  string hls_url = 5 [deprecated = true];
  // Video title.
  string title = 6;
  // "channel_live_detection_retired" for a channel-only query, or why the video lookup failed.
  string error = 7;
}
