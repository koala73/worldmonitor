syntax = "proto3";

package worldmonitor.displacement.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";
import "worldmonitor/core/v1/geo.proto";

// IDPs present in one first-level region.
message InternalDisplacementRegion {
  // OCHA P-code. Empty when DTM gave no region.
  string pcode = 1;
  string name = 2;
  int64 idps = 3 [(buf.validate.field).int64.gte = 0, (sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // Absent when the P-code has no OCHA point.
  worldmonitor.core.v1.GeoCoordinates location = 4;
}

// IDPs in one region who fled another region.
message InternalDisplacementFlow {
  string origin_pcode = 1;
  string origin_name = 2;
  string destination_pcode = 3;
  string destination_name = 4;
  int64 idps = 5 [(buf.validate.field).int64.gte = 0, (sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  worldmonitor.core.v1.GeoCoordinates origin_location = 6;
  worldmonitor.core.v1.GeoCoordinates destination_location = 7;
}

// IDPs by reported cause.
message InternalDisplacementReason {
  string reason = 1;
  int64 idps = 2 [(buf.validate.field).int64.gte = 0, (sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
}

// Latest survey round of one IOM DTM operation. Operations in a country can
// overlap; do not add their totals.
message InternalDisplacementOperation {
  // ISO 3166-1 alpha-3.
  string country_code = 1;
  string country_name = 2;
  string operation = 3;
  // YYYY-MM-DD.
  string reporting_date = 4;
  int32 round_number = 5;
  int64 total_idps = 6 [(buf.validate.field).int64.gte = 0, (sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  repeated InternalDisplacementReason reasons = 7;
  repeated InternalDisplacementRegion regions = 8;
  // Largest region-to-region routes, up to 30.
  repeated InternalDisplacementFlow flows = 9;
}

message GetInternalDisplacementRequest {
  // ISO 3166-1 alpha-3, such as SDN. Empty returns all.
  string country_code = 1 [
    (sebuf.http.query) = {name: "country_code"},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Za-z]{3}$"
  ];
}

message GetInternalDisplacementResponse {
  // Operations with a round in the last 18 months, largest first.
  repeated InternalDisplacementOperation operations = 1;
  // Unix ms. 0 when unavailable.
  int64 fetched_at = 2 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // False when the snapshot is unavailable; an empty list then is not zero displacement.
  bool data_available = 3;
}
