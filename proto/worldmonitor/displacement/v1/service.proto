syntax = "proto3";

package worldmonitor.displacement.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/displacement/v1/get_displacement_summary.proto";
import "worldmonitor/displacement/v1/get_internal_displacement.proto";
import "worldmonitor/displacement/v1/get_cross_border_movements.proto";
import "worldmonitor/displacement/v1/get_population_exposure.proto";

// DisplacementService serves displacement and cross-border reports.
service DisplacementService {
  option (sebuf.http.service_config) = {base_path: "/api/displacement/v1"};

  // Global refugee and IDP statistics from UNHCR.
  // Empty/absent summary with fetched_at=0 or data_available=false means the
  // snapshot is unavailable/degraded, not that global displacement is zero.
  rpc GetDisplacementSummary(GetDisplacementSummaryRequest) returns (GetDisplacementSummaryResponse) {
    option (sebuf.http.config) = {path: "/get-displacement-summary", method: HTTP_METHOD_GET};
  }

  // GetInternalDisplacement returns IOM DTM internally displaced persons by admin-1 region from each operation's latest survey round, filterable by ISO3 country.
  rpc GetInternalDisplacement(GetInternalDisplacementRequest) returns (GetInternalDisplacementResponse) {
    option (sebuf.http.config) = {path: "/get-internal-displacement", method: HTTP_METHOD_GET};
  }

  // 200 describes unprojected movements; jmespath returns any JSON (array/scalar/null), with {data, _attribution} if attributed.
  rpc GetCrossBorderMovements(GetCrossBorderMovementsRequest) returns (GetCrossBorderMovementsResponse) {
    option (sebuf.http.config) = {path: "/get-cross-border-movements", method: HTTP_METHOD_GET};
  }

  // GetPopulationExposure lists population and density for 20 priority countries, or estimates people near a point as the average density of the country containing it times the circle area. A point outside those 20 countries gets no exposure.
  rpc GetPopulationExposure(GetPopulationExposureRequest) returns (GetPopulationExposureResponse) {
    option (sebuf.http.config) = {path: "/get-population-exposure", method: HTTP_METHOD_GET};
  }
}
