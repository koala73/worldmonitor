syntax = "proto3";

package worldmonitor.infrastructure.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/core/v1/pagination.proto";
import "worldmonitor/infrastructure/v1/infrastructure.proto";

// ListInternetOutagesRequest specifies filters for retrieving internet outages.
message ListInternetOutagesRequest {
  // Start of time range (inclusive), Unix epoch milliseconds.
  int64 start = 1 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER, (sebuf.http.query) = { name: "start" }];
  // End of time range (inclusive), Unix epoch milliseconds.
  int64 end = 2 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER, (sebuf.http.query) = { name: "end" }];
  // Maximum items per page.
  // Accepted but currently ignored; no-op until this handler supports the parameter.
  int32 page_size = 3 [(sebuf.http.query) = { name: "page_size" }, (sebuf.http.unimplemented) = true];
  // Cursor for next page.
  // Accepted but currently ignored; no-op until this handler supports the parameter.
  string cursor = 4 [(sebuf.http.query) = { name: "cursor" }, (sebuf.http.unimplemented) = true];
  // Optional country filter (ISO 3166-1 alpha-2).
  string country = 5 [(sebuf.http.query) = { name: "country" }];
}

// ListInternetOutagesResponse contains internet outages matching the request.
message ListInternetOutagesResponse {
  // The list of internet outages.
  repeated InternetOutage outages = 1;
  // Pagination metadata.
  worldmonitor.core.v1.PaginationResponse pagination = 2;
  // When the seeder last fetched the outage list from Cloudflare Radar, Unix
  // epoch milliseconds. A retained payload keeps its original time; 0 when unknown
  int64 fetched_at = 3 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
}
