syntax = "proto3";

package worldmonitor.company_monitoring.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/company_monitoring/v1/coverage.proto";
import "worldmonitor/company_monitoring/v1/events.proto";
import "worldmonitor/company_monitoring/v1/portfolio.proto";

// CompanyMonitoringService defines the dark v1 contract for account-scoped private-company monitoring.
// Every RPC requires server-derived account context. The four mutation RPCs require
// company_monitoring:write; the six read RPCs require company_monitoring:read.
service CompanyMonitoringService {
  option (sebuf.http.service_config) = {base_path: "/api/company-monitoring/v1"};

  // Creates an account-scoped monitored-company record. Requires company_monitoring:write; runtime remains disabled until dependency #6003 passes.
  rpc CreateMonitoredCompany(CreateMonitoredCompanyRequest) returns (CreateMonitoredCompanyResponse) {
    option (sebuf.http.config) = {path: "/create-monitored-company", method: HTTP_METHOD_POST};
  }

  // Applies a bounded patch to an account-scoped monitored-company record. Requires company_monitoring:write; runtime remains disabled until dependency #6003 passes.
  rpc UpdateMonitoredCompany(UpdateMonitoredCompanyRequest) returns (UpdateMonitoredCompanyResponse) {
    option (sebuf.http.config) = {path: "/update-monitored-company", method: HTTP_METHOD_POST};
  }

  // Transitions an account-scoped monitored company between active, paused, and removed states. Requires company_monitoring:write; runtime remains disabled until dependency #6003 passes.
  rpc SetMonitoredCompanyState(SetMonitoredCompanyStateRequest) returns (SetMonitoredCompanyStateResponse) {
    option (sebuf.http.config) = {path: "/set-monitored-company-state", method: HTTP_METHOD_POST};
  }

  // Imports up to 100 normalized account-scoped company rows with deterministic per-row outcomes. Requires company_monitoring:write; runtime remains disabled until dependency #6003 passes.
  rpc ImportMonitoredCompanyBatch(ImportMonitoredCompanyBatchRequest) returns (ImportMonitoredCompanyBatchResponse) {
    option (sebuf.http.config) = {path: "/import-monitored-company-batch", method: HTTP_METHOD_POST};
  }

  // Lists account-scoped monitored companies at a signed snapshot boundary. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.
  rpc ListMonitoredCompanies(ListMonitoredCompaniesRequest) returns (ListMonitoredCompaniesResponse) {
    option (sebuf.http.config) = {path: "/list-monitored-companies", method: HTTP_METHOD_GET};
  }

  // Lists account-scoped material impacts with independent direction, confidence, and lifecycle fields. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.
  rpc ListCompanyEventImpacts(ListCompanyEventImpactsRequest) returns (ListCompanyEventImpactsResponse) {
    option (sebuf.http.config) = {path: "/list-company-event-impacts", method: HTTP_METHOD_GET};
  }

  // Polls account-scoped material-impact changes from a signed opaque cursor. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.
  rpc ListCompanyEventChanges(ListCompanyEventChangesRequest) returns (ListCompanyEventChangesResponse) {
    option (sebuf.http.config) = {path: "/list-company-event-changes", method: HTTP_METHOD_GET};
  }

  // Returns one account-scoped material event, its impact, and bounded evidence references. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.
  rpc GetCompanyMaterialEvent(GetCompanyMaterialEventRequest) returns (GetCompanyMaterialEventResponse) {
    option (sebuf.http.config) = {path: "/get-company-material-event", method: HTTP_METHOD_GET};
  }

  // Returns the current coverage state for one account-scoped monitored company. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.
  rpc GetCompanyCoverage(GetCompanyCoverageRequest) returns (GetCompanyCoverageResponse) {
    option (sebuf.http.config) = {path: "/get-company-coverage", method: HTTP_METHOD_GET};
  }

  // Returns account-scoped limits, snapshot generation, access state, and independent feature flags. Requires company_monitoring:read; runtime remains disabled until dependency #6003 passes.
  rpc GetCompanyMonitoringStatus(GetCompanyMonitoringStatusRequest) returns (GetCompanyMonitoringStatusResponse) {
    option (sebuf.http.config) = {path: "/get-company-monitoring-status", method: HTTP_METHOD_GET};
  }
}
