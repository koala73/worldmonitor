syntax = "proto3";

package worldmonitor.news.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

// ListLabelChangesRequest selects recent corroboration label changes, optionally for one story.
message ListLabelChangesRequest {
  // Story identity hash (64 hex characters). Empty lists changes across all stories.
  string story_id = 1 [
    (sebuf.http.query) = { name: "story_id" },
    (buf.validate.field).string.max_len = 64
  ];
  // Maximum changes returned, newest first. 0 uses the default of 50; at most 200.
  int32 limit = 2 [
    (sebuf.http.query) = { name: "limit" },
    (buf.validate.field).int32 = { gte: 0, lte: 200 }
  ];
}

// LabelChangePublisher is one publisher family behind the new label.
message LabelChangePublisher {
  // Curated publisher name, or the feed label when no family is curated.
  string name = 1;
  // Declared source tier 1-4; 0 when no feed label declares one.
  int32 tier = 2;
}

// LabelChange records one story moving between single-publisher and corroborated
// coverage, or one correction a reviewer accepted from a reader report.
message LabelChange {
  // Story identity hash; empty for a correction that names no story.
  string story_id = 1;
  // corroboration (a label moved) | correction (an accepted reader report).
  string field = 2;
  // Previous state: single-publisher | corroborated; empty for a correction.
  string previous = 3;
  // New state: single-publisher | corroborated; empty for a correction.
  string next = 4;
  // Publisher families behind the previous label; 0 for a correction.
  int32 previous_publishers = 5;
  // Publisher families behind the new label; 0 for a correction.
  int32 next_publishers = 6;
  // Time the change was recorded, Unix epoch milliseconds.
  int64 at = 7 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // What recorded it: digest (automatic) | report (an accepted error report).
  string trigger = 8;
  // Plain-language reason, in English.
  string reason = 9;
  // Publishers behind the new label, tier first; at most 12 are listed.
  repeated LabelChangePublisher sources = 10;
  // Story headline when the change was recorded.
  string title = 11;
  // Representative article URL. Empty when it failed the publisher link gate,
  // was revoked after the change was recorded, or the revocation set could not
  // be read.
  string link = 12;
  // Story CRED score 0-100 when the change was recorded; -1 when unknown.
  int32 credibility_score = 13;
}

// ListLabelChangesResponse lists changes from the last seven days, newest first.
message ListLabelChangesResponse {
  // Recorded changes. Coverage, not accuracy: a change to corroborated means more publishers carry the story, not that it was confirmed.
  repeated LabelChange changes = 1;
  // ok | unavailable. Unavailable means the log could not be read, not that it is empty.
  string state = 2;
  // Retention window in days.
  int32 retention_days = 3;
  // Stories in the latest full English digest by label. Absent when no recent count exists.
  LabelCounts counts = 4;
  // Monthly calibration: how each first label held up after 24 hours and 7 days.
  // Served only when story_id is empty; absent before the first publication or when it cannot be read.
  LabelCalibration calibration = 5;
}

// LabelCalibration counts, per month, how stories first seen in the full English
// digest as single-publisher or corroborated were labelled 24 hours and 7 days later. Computed only from the
// logged label history. Coverage, not accuracy: no figure says a story was true or false.
message LabelCalibration {
  // When the table was computed, Unix epoch milliseconds.
  int64 generated_at = 1 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // Version of the published definitions the figures follow.
  int32 definitions_version = 2;
  // Rows with fewer stories than this are low-n: shown with their counts, without a percentage.
  int32 low_n_threshold = 3;
  // Months with at least one finalized cohort day, newest first; at most 13.
  repeated LabelCalibrationMonth months = 4;
  // State of the fact-check column: not-measured.
  string fact_check_status = 5;
  // Why the fact-check column is in that state, in English.
  string fact_check_note = 6;
}

// LabelCalibrationMonth sums the cohort days of one UTC calendar month.
message LabelCalibrationMonth {
  // UTC month, YYYY-MM.
  string month = 1;
  // Cohort days counted: days whose stories have all passed seven days.
  int32 cohort_days = 2;
  // Cohort days left out because a day's event log reached its size cap.
  int32 excluded_days = 3;
  // First counted cohort day, YYYY-MM-DD; empty when none was counted.
  string first_day = 4;
  // Last counted cohort day, YYYY-MM-DD; empty when none was counted.
  string last_day = 5;
  // One row per first label and checkpoint: single-publisher and corroborated, each at 24h and 7d.
  repeated LabelCalibrationRow rows = 6;
}

// LabelCalibrationRow is one first label at one checkpoint. same + changed + other = stories.
message LabelCalibrationRow {
  // First label: single-publisher | corroborated.
  string state = 1;
  // Checkpoint after the first label: 24h | 7d.
  string horizon = 2;
  // Stories first seen with this label in the month: the row's sample size (n).
  // Named `stories`, not `n`: YAML 1.1 reads a bare `n` key as the boolean false.
  int32 stories = 3;
  // Stories with the same label at the checkpoint.
  int32 same = 4;
  // Stories with the other tracked label at the checkpoint: from single-publisher,
  // carried by two or more publisher families; from corroborated, by only one.
  int32 changed = 5;
  // Stories labelled tier-4 only or not enough evidence at the checkpoint.
  int32 other = 6;
}

// LabelCounts is how many stories in the latest full English digest carry each label.
message LabelCounts {
  // When the digest counted, Unix epoch milliseconds.
  int64 at = 1 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // Stories counted.
  int32 stories = 2;
  // Two or more publisher families, not all tier 4.
  int32 corroborated = 3;
  // One publisher family.
  int32 single_publisher = 4;
  // Two or more families, every one a declared tier-4 outlet.
  int32 tier4_only = 5;
  // No evidence to judge.
  int32 unknown = 6;
}
