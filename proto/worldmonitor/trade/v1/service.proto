syntax = "proto3";

package worldmonitor.trade.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/trade/v1/get_trade_restrictions.proto";
import "worldmonitor/trade/v1/get_bilateral_tariff.proto";
import "worldmonitor/trade/v1/get_us_import_duty.proto";
import "worldmonitor/trade/v1/get_tariff_trends.proto";
import "worldmonitor/trade/v1/get_trade_flows.proto";
import "worldmonitor/trade/v1/get_trade_barriers.proto";
import "worldmonitor/trade/v1/get_customs_revenue.proto";
import "worldmonitor/trade/v1/list_comtrade_flows.proto";

// Trade policy intelligence from WTO, World Bank WITS and US Treasury data sources.
service TradeService {
  option (sebuf.http.service_config) = {base_path: "/api/trade/v1"};

  // Get quantitative restrictions and export controls.
  rpc GetTradeRestrictions(GetTradeRestrictionsRequest) returns (GetTradeRestrictionsResponse) {
    option (sebuf.http.config) = {path: "/get-trade-restrictions", method: HTTP_METHOD_GET};
  }

  // Get the MFN applied tariff-rate timeseries (All-products average) for one
  // reporting economy. Not a bilateral or product-level rate.
  rpc GetTariffTrends(GetTariffTrendsRequest) returns (GetTariffTrendsResponse) {
    option (sebuf.http.config) = {path: "/get-tariff-trends", method: HTTP_METHOD_GET};
  }

  // Applied tariff on one HS6 product between two countries (UNCTAD TRAINS).
  rpc GetBilateralTariff(GetBilateralTariffRequest) returns (GetBilateralTariffResponse) {
    option (sebuf.http.config) = {path: "/get-bilateral-tariff", method: HTTP_METHOD_GET};
  }

  // Current US duty on one product from one country (USITC HTS).
  rpc GetUsImportDuty(GetUsImportDutyRequest) returns (GetUsImportDutyResponse) {
    option (sebuf.http.config) = {path: "/get-us-import-duty", method: HTTP_METHOD_GET};
  }

  // Get bilateral merchandise trade flows.
  rpc GetTradeFlows(GetTradeFlowsRequest) returns (GetTradeFlowsResponse) {
    option (sebuf.http.config) = {path: "/get-trade-flows", method: HTTP_METHOD_GET};
  }

  // Get SPS/TBT barrier notifications.
  rpc GetTradeBarriers(GetTradeBarriersRequest) returns (GetTradeBarriersResponse) {
    option (sebuf.http.config) = {path: "/get-trade-barriers", method: HTTP_METHOD_GET};
  }

  // Get US customs duties revenue (Treasury MTS data, seeded by Railway).
  rpc GetCustomsRevenue(GetCustomsRevenueRequest) returns (GetCustomsRevenueResponse) {
    option (sebuf.http.config) = {path: "/get-customs-revenue", method: HTTP_METHOD_GET};
  }

  // List UN Comtrade strategic commodity flows with anomaly detection.
  rpc ListComtradeFlows(ListComtradeFlowsRequest) returns (ListComtradeFlowsResponse) {
    option (sebuf.http.config) = {path: "/list-comtrade-flows", method: HTTP_METHOD_GET};
  }
}
