syntax = "proto3";

package worldmonitor.trade.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";
import "worldmonitor/trade/v1/get_trade_flows.proto";

// Request for a country's monthly merchandise trade by SITC section.
//
// Coverage is seed-backed: Railway pre-fetches the national statistics office
// files and this API serves slices of that history. Only Malaysia ("MY", DOSM
// Monthly Trade by SITC Section) is seeded today. Any other well-formed country
// is answered with unavailable_reason TRADE_FLOW_UNAVAILABLE_REASON_NOT_COVERED,
// so coverage can widen without a contract change.
message GetMonthlySitcTradeRequest {
  // ISO 3166-1 alpha-2 reporter. Empty selects "MY".
  string country = 1 [
    (buf.validate.field).string.pattern = "^([A-Z]{2})?$",
    (sebuf.http.query) = { name: "country" }
  ];
  // SITC sections to return: "0" (food and live animals) through "9", or
  // "overall" (all goods). Empty returns every section. Food-security callers
  // typically ask for 0 (food), 1 (beverages and tobacco) and 4 (animal and
  // vegetable oils and fats).
  repeated string sections = 2 [
    (buf.validate.field).repeated.max_items = 11,
    (buf.validate.field).repeated.items.string.pattern = "^([0-9]|overall)$",
    (sebuf.http.query) = { name: "sections" }
  ];
  // Number of months to return, counted back from the newest seeded month and
  // including it. 0 selects the default of 60; the maximum of 480 covers the
  // full seeded history, which starts in January 1990.
  int32 months = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 480,
    (sebuf.http.query) = { name: "months" }
  ];
}

// One month of trade for one SITC section.
message SitcTradeMonth {
  // Reference month, YYYY-MM.
  string month = 1;
  // Exports in whole units of `currency` (not millions), free on board.
  double exports = 2;
  // Imports in whole units of `currency` (not millions), cost, insurance and freight.
  double imports = 3;
  // Export unit value index (base in `index_base`). Absent before the index
  // series starts (January 2015 for Malaysia) and for the newest month or two
  // that the index release has not yet reached.
  optional double exports_unit_value_index = 4;
  // Export volume index (base in `index_base`). Absent like the unit value index.
  optional double exports_volume_index = 5;
  // Import unit value index (base in `index_base`). Absent like the export indices.
  optional double imports_unit_value_index = 6;
  // Import volume index (base in `index_base`). Absent like the export indices.
  optional double imports_volume_index = 7;
}

// Monthly history for one SITC section, oldest month first.
message SitcTradeSeries {
  // SITC section code "0" through "9", or "overall".
  string section = 1;
  // Publisher's English section label, for example "Food".
  string label = 2;
  // Months in ascending order.
  repeated SitcTradeMonth months = 3;
}

// Response with a country's monthly trade by SITC section.
message GetMonthlySitcTradeResponse {
  // ISO 3166-1 alpha-2 reporter that was resolved, for example "MY".
  string country = 1;
  // ISO 4217 currency of `exports` and `imports`, for example "MYR".
  string currency = 2;
  // Publisher and dataset, for example "DOSM Monthly Trade by SITC Section".
  string source = 3;
  // Publisher dataset page.
  string source_url = 4;
  // Base period of the unit value and volume indices, for example "2010=100".
  string index_base = 5;
  // Newest month with trade values, YYYY-MM. Empty when no series are returned.
  string latest_month = 6;
  // Newest month with unit value and volume indices, YYYY-MM.
  string latest_index_month = 7;
  // When the seed fetched the publisher files, as Unix epoch milliseconds.
  // 0 when no seed was served.
  int64 fetched_at = 8 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // Requested sections in SITC order ("overall" last).
  repeated SitcTradeSeries series = 9;
  // True when series could not be served because of a fault: a covered
  // country whose cache entry is gone, or a cache read that failed. False
  // when series are served and when the country is simply not covered.
  bool upstream_unavailable = 10;
  // UNSPECIFIED when series are served; otherwise why they are not.
  TradeFlowUnavailableReason unavailable_reason = 11;
}
