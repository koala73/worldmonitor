syntax = "proto3";

package worldmonitor.trade.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";
import "worldmonitor/trade/v1/trade_data.proto";

// TariffTrendUnavailableReason says why no datapoints were returned. The
// distinction that matters is NOT_COVERED — a contract answer, nothing is
// broken and a retry cannot help — against every other member, which names a
// fault.
enum TariffTrendUnavailableReason {
  // Datapoints were served.
  TARIFF_TREND_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  // Request codes were malformed. Only reachable where request validation is
  // bypassed; the gateway rejects these with HTTP 400 before the handler runs.
  TARIFF_TREND_UNAVAILABLE_REASON_INVALID_REQUEST = 1;
  // Well-formed, but this reporter/product-sector combination is outside
  // seeded coverage.
  TARIFF_TREND_UNAVAILABLE_REASON_NOT_COVERED = 2;
  // The reporter is inside coverage but its cache entry is absent.
  TARIFF_TREND_UNAVAILABLE_REASON_SEED_MISSING = 3;
  // The coverage manifest could not be read, so neither of the two above can
  // be ruled out.
  TARIFF_TREND_UNAVAILABLE_REASON_COVERAGE_UNKNOWN = 4;
  // The cache read itself failed.
  TARIFF_TREND_UNAVAILABLE_REASON_CACHE_UNAVAILABLE = 5;
  // World Bank WITS could not be reached for a partner or sector request.
  TARIFF_TREND_UNAVAILABLE_REASON_UPSTREAM_UNAVAILABLE = 6;
}

// Request for tariff timeseries data.
//
// Without partner_country or product_sector, this serves the reporter's WTO MFN
// applied average over all products (indicator TP_A_0010), seeded on Railway; a
// reporter outside the seed is reported as uncovered, not fetched.
//
// With either set, it serves the reporter's effectively applied tariff
// (preferences included) on goods from that partner and/or in that product
// group, from World Bank WITS (UNCTAD TRAINS), fetched on demand and cached.
// Both are schedule rates: neither includes unilateral duties such as Section
// 301 (see get-us-import-duty).
message GetTariffTrendsRequest {
  // WTO member code of reporting country, as a 3-digit UN M49 code
  // (for example "840" = United States). Empty selects the "840" default.
  string reporting_country = 1 [
    (buf.validate.field).string.pattern = "^([0-9]{3})?$",
    (sebuf.http.query) = { name: "reporting_country" }
  ];
  // Exporting partner, 3-digit UN M49 code ("000" = World). Empty or "000"
  // with no product_sector selects the MFN series.
  string partner_country = 2 [
    (buf.validate.field).string.pattern = "^([0-9]{3})?$",
    (sebuf.http.query) = { name: "partner_country" }
  ];
  // WITS product group: an HS section such as "84-85_MachElec" or "50-63_TextCloth",
  // or "AgrRaw", "Chemical", "Food", "Fuels", "manuf", "OresMtls", "Textiles",
  // "Transp" (case-insensitive). Empty or "all" means all products. Other values
  // are answered NOT_COVERED.
  string product_sector = 3 [
    (buf.validate.field).string.pattern = "^([a-zA-Z0-9_-]{0,16})?$",
    (sebuf.http.query) = { name: "product_sector" }
  ];
  // Number of years to look back from the newest seeded year, inclusive of
  // both endpoints (years = 10 returns 11 calendar years). 0 selects the
  // default of 10; the maximum is 30, which is the full seeded window.
  int32 years = 4 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 30,
    (sebuf.http.query) = { name: "years" }
  ];
}

// Response containing tariff trend datapoints.
message GetTariffTrendsResponse {
  // Tariff data points ordered by year ascending.
  repeated TariffDataPoint datapoints = 1;
  // ISO 8601 time the data was fetched from WTO or WITS.
  string fetched_at = 2;
  // True when datapoints could not be served because of a fault — a seeded
  // reporter whose cache entry is gone, or a cache read that failed. False when
  // datapoints are served AND when the request names a combination that is
  // simply not part of seeded coverage, which is a contract answer rather than
  // an outage.
  bool upstream_unavailable = 3;
  // Optional effective tariff snapshot for countries with additional coverage
  // (currently US only, from FRED customs duties / goods imports).
  EffectiveTariffRate effective_tariff_rate = 4;
  // UNSPECIFIED when datapoints are served; otherwise why they are not, so a
  // caller can tell a coverage gap from a fault without parsing prose.
  TariffTrendUnavailableReason unavailable_reason = 5;
  // First and last calendar year covered by `datapoints`. Both are 0 when no
  // datapoints are returned. This is the effective window after slicing to
  // `years`, which may be narrower than the requested lookback when the seed
  // starts later.
  int32 coverage_start_year = 6;
  int32 coverage_end_year = 7;
}
