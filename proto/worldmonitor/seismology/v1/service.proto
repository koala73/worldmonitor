syntax = "proto3";

package worldmonitor.seismology.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/seismology/v1/list_earthquakes.proto";

// SeismologyService provides APIs for earthquake monitoring data sourced from USGS and Earthquakes Canada (NRCan).
service SeismologyService {
  option (sebuf.http.service_config) = {base_path: "/api/seismology/v1"};

  // ListEarthquakes returns M4.5+ earthquakes from the past 7 days from USGS and Earthquakes Canada (NRCan), flagging quakes within 100 km of nuclear test sites.
  rpc ListEarthquakes(ListEarthquakesRequest) returns (ListEarthquakesResponse) {
    option (sebuf.http.config) = {path: "/list-earthquakes", method: HTTP_METHOD_GET};
  }
}
