syntax = "proto3";
package worldmonitor.intelligence.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

message GetCountryHistoryRequest {
  // Assigned ISO 3166-1 alpha-2 country. Empty archives remain empty.
  string country = 1 [(sebuf.http.query) = {name: "country", required: true}, (buf.validate.field).string.pattern = "^[A-Z]{2}$"];
  // UTC calendar days including today. Defaults to 7. The server clamps to
  // the verified caller's retention depth, free 7, Pro 90, API/Enterprise 365.
  int32 days = 2 [(sebuf.http.query) = {name: "days"}, (buf.validate.field).int32.gte = 0];
}

message CountryHistoryScore {
  double score = 1;
  // Exact source methodology/cache identity at capture time.
  string version = 2;
  int64 observed_at = 3 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
}

message CountryHistoryEvent {
  string title = 1;
  string link = 2;
  string source = 3;
  string category = 4;
}

message CountryHistoryPoint {
  string date = 1;
  int64 captured_at = 2 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // Absent means unavailable. A numeric zero is an observed zero.
  CountryHistoryScore cii = 3;
  CountryHistoryScore resilience = 4;
  repeated CountryHistoryEvent top_events = 5;
  repeated string key_signals = 6;
  // Breaks include missing calendar days, missing scores and version changes.
  // Consumers must not join a trend line across a break.
  bool cii_version_break = 7;
  bool resilience_version_break = 8;
}

message GetCountryHistoryResponse {
  string country = 1;
  int32 requested_days = 2;
  int32 allowed_days = 3;
  int32 effective_days = 4;
  int32 returned_days = 5;
  repeated CountryHistoryPoint points = 6;
  // Missing or failed storage reads must never be interpreted as quiet days.
  bool upstream_unavailable = 7;
  // True when the last successful daily archive publication is over 36h old.
  bool stale = 8;
  int64 fetched_at = 9 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
}
