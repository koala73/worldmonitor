syntax = "proto3";
package worldmonitor.intelligence.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/intelligence/v1/classify_event.proto";
import "worldmonitor/intelligence/v1/deduct_situation.proto";
import "worldmonitor/intelligence/v1/get_company_enrichment.proto";
import "worldmonitor/intelligence/v1/get_country_facts.proto";
import "worldmonitor/intelligence/v1/get_country_intel_brief.proto";
import "worldmonitor/intelligence/v1/get_country_risk.proto";
import "worldmonitor/intelligence/v1/get_country_history.proto";
import "worldmonitor/intelligence/v1/get_country_signal_observations.proto";
import "worldmonitor/intelligence/v1/get_pizzint_status.proto";
import "worldmonitor/intelligence/v1/get_risk_scores.proto";
import "worldmonitor/intelligence/v1/list_security_advisories.proto";
import "worldmonitor/intelligence/v1/list_company_signals.proto";
import "worldmonitor/intelligence/v1/search_sec_filings.proto";
import "worldmonitor/intelligence/v1/list_material_events.proto";
import "worldmonitor/intelligence/v1/list_gps_interference.proto";
import "worldmonitor/intelligence/v1/list_oref_alerts.proto";
import "worldmonitor/intelligence/v1/list_satellites.proto";
import "worldmonitor/intelligence/v1/list_telegram_feed.proto";
import "worldmonitor/intelligence/v1/list_x_feed.proto";
import "worldmonitor/intelligence/v1/search_gdelt_documents.proto";
import "worldmonitor/intelligence/v1/get_gdelt_topic_timeline.proto";
import "worldmonitor/intelligence/v1/list_cross_source_signals.proto";
import "worldmonitor/intelligence/v1/list_market_implications.proto";
import "worldmonitor/intelligence/v1/get_social_velocity.proto";
import "worldmonitor/intelligence/v1/list_wsb_tickers.proto";
import "worldmonitor/intelligence/v1/get_country_energy_profile.proto";
import "worldmonitor/intelligence/v1/compute_energy_shock.proto";
import "worldmonitor/intelligence/v1/get_country_port_activity.proto";
import "worldmonitor/intelligence/v1/get_country_coverage.proto";
import "worldmonitor/intelligence/v1/get_china_decision_signals.proto";
import "worldmonitor/intelligence/v1/get_regional_snapshot.proto";
import "worldmonitor/intelligence/v1/get_regime_history.proto";
import "worldmonitor/intelligence/v1/get_regional_brief.proto";
import "worldmonitor/intelligence/v1/search_intel_history.proto";
import "worldmonitor/intelligence/v1/get_intel_timeline.proto";
import "worldmonitor/intelligence/v1/get_similar_events.proto";

// IntelligenceService provides APIs for technical and strategic intelligence.
service IntelligenceService {
  option (sebuf.http.service_config) = {base_path: "/api/intelligence/v1"};

  // Read one bounded country-qualified observation family or eligible flight page for the country panel, with source clocks and coverage.
  rpc GetCountrySignalObservations(GetCountrySignalObservationsRequest) returns (GetCountrySignalObservationsResponse) {
    option (sebuf.http.config) = {path: "/get-country-signal-observations", method: HTTP_METHOD_GET};
  }

  // Retrieve composite country risk scores and strategic assessments by region, with component contributions and advisory context for geopolitical risk monitoring.
  rpc GetRiskScores(GetRiskScoresRequest) returns (GetRiskScoresResponse) {
    option (sebuf.http.config) = {
      path: "/get-risk-scores"
      method: HTTP_METHOD_GET
    };
  }

  // GetPizzintStatus returns the Pentagon Pizza Index from pizzint.watch and, on request, GDELT country-pair tension scores with supporting evidence.
  rpc GetPizzintStatus(GetPizzintStatusRequest) returns (GetPizzintStatusResponse) {
    option (sebuf.http.config) = {
      path: "/get-pizzint-status"
      method: HTTP_METHOD_GET
    };
  }

  // ClassifyEvent has an LLM assign a news headline a threat level and one of 14 event categories, cached for 24 hours.
  rpc ClassifyEvent(ClassifyEventRequest) returns (ClassifyEventResponse) {
    option (sebuf.http.config) = {path: "/classify-event", method: HTTP_METHOD_GET};
  }

  // GetCountryHistory returns daily snapshots of a country's CII and resilience scores, top events, and key signals, with depth set by the caller's plan.
  rpc GetCountryHistory(GetCountryHistoryRequest) returns (GetCountryHistoryResponse) {
    option (sebuf.http.config) = {
      path: "/get-country-history"
      method: HTTP_METHOD_GET
    };
  }

  // GetCountryRisk returns a country's Country Instability Index score, its travel advisory level, and the number of sanctions entries tied to it.
  rpc GetCountryRisk(GetCountryRiskRequest) returns (GetCountryRiskResponse) {
    option (sebuf.http.config) = {
      path: "/get-country-risk"
      method: HTTP_METHOD_GET
    };
  }

  // GetCountryIntelBrief generates a strategic brief for a specific country.
  rpc GetCountryIntelBrief(GetCountryIntelBriefRequest) returns (GetCountryIntelBriefResponse) {
    option (sebuf.http.config) = {
      path: "/get-country-intel-brief"
      method: HTTP_METHOD_GET
    };
  }

  // GetCountryCoverage returns the country panel's visible coverage timeline:
  // clustered news incidents reconciled against first-party structured records,
  // with per-producer freshness so an empty list is never silent.
  rpc GetCountryCoverage(GetCountryCoverageRequest) returns (GetCountryCoverageResponse) {
    option (sebuf.http.config) = {
      path: "/get-country-coverage"
      method: HTTP_METHOD_GET
    };
  }

  // SearchGdeltDocuments returns up to 20 articles from the first seeded GDELT topic that matches a query, or recent articles for a country:XX query.
  rpc SearchGdeltDocuments(SearchGdeltDocumentsRequest) returns (SearchGdeltDocumentsResponse) {
    option (sebuf.http.config) = {
      path: "/search-gdelt-documents"
      method: HTTP_METHOD_GET
    };
  }

  // DeductSituation runs LLM reasoning over a user query and geographic context, with matching prediction market odds.
  rpc DeductSituation(DeductSituationRequest) returns (DeductSituationResponse) {
    option (sebuf.http.config) = {path: "/deduct-situation"};
  }

  // ListSatellites returns CelesTrak two-line element sets (TLE) for tracked satellites, for client-side propagation, refreshed every 2h and filterable by country.
  rpc ListSatellites(ListSatellitesRequest) returns (ListSatellitesResponse) {
    option (sebuf.http.config) = {
      path: "/list-satellites"
      method: HTTP_METHOD_GET
    };
  }

  // ListGpsInterference returns daily gpsjam.org H3 hexes rated low, medium, or high by the share of aircraft reporting GPS/GNSS problems, filterable by region.
  rpc ListGpsInterference(ListGpsInterferenceRequest) returns (ListGpsInterferenceResponse) {
    option (sebuf.http.config) = {
      path: "/list-gps-interference"
      method: HTTP_METHOD_GET
    };
  }

  // ListOrefAlerts returns active Israeli Home Front Command Red Alert sirens from Tzeva Adom, with oref.org.il as fallback, or alert history in MODE_HISTORY.
  rpc ListOrefAlerts(ListOrefAlertsRequest) returns (ListOrefAlertsResponse) {
    option (sebuf.http.config) = {
      path: "/list-oref-alerts"
      method: HTTP_METHOD_GET
    };
  }

  // ListTelegramFeed returns recent OSINT messages from monitored Telegram channels via the relay, filterable by topic or channel, up to 200 per request.
  rpc ListTelegramFeed(ListTelegramFeedRequest) returns (ListTelegramFeedResponse) {
    option (sebuf.http.config) = {
      path: "/list-telegram-feed"
      method: HTTP_METHOD_GET
    };
  }

  // ListXFeed retrieves curated public news-account posts from monitored X
  // accounts. Returns permalink plus derived facts only — post text is R4.
  rpc ListXFeed(ListXFeedRequest) returns (ListXFeedResponse) {
    option (sebuf.http.config) = {
      path: "/list-x-feed"
      method: HTTP_METHOD_GET
    };
  }

  // GetCompanyEnrichment aggregates a per-company intelligence composite: SEC EDGAR
  // identity and recent filings (via authoritative ticker-to-CIK resolution), market
  // profile and earnings surprises from Finnhub, and recent news mentions.
  rpc GetCompanyEnrichment(GetCompanyEnrichmentRequest) returns (GetCompanyEnrichmentResponse) {
    option (sebuf.http.config) = {
      path: "/get-company-enrichment"
      method: HTTP_METHOD_GET
    };
  }

  // ListCompanySignals discovers classified intelligence signals for a company from
  // authoritative sources: SEC 8-K material events and recent news mentions, with
  // per-type summary rollups. Fiscal period ends are not used as event timestamps.
  rpc ListCompanySignals(ListCompanySignalsRequest) returns (ListCompanySignalsResponse) {
    option (sebuf.http.config) = {
      path: "/list-company-signals"
      method: HTTP_METHOD_GET
    };
  }

  // SearchSecFilings runs a full-text search over SEC EDGAR filings with optional
  // form-type and date-range filters.
  rpc SearchSecFilings(SearchSecFilingsRequest) returns (SearchSecFilingsResponse) {
    option (sebuf.http.config) = {
      path: "/search-sec-filings"
      method: HTTP_METHOD_GET
    };
  }

  // ListMaterialEvents returns the pre-seeded stream of recent SEC 8-K material-event
  // filings (M&A, executive changes, restatements, bankruptcies) across all filers.
  rpc ListMaterialEvents(ListMaterialEventsRequest) returns (ListMaterialEventsResponse) {
    option (sebuf.http.config) = {
      path: "/list-material-events"
      method: HTTP_METHOD_GET
    };
  }

  // GetCountryFacts returns a country's head of state, population, area, capital, languages, and currencies from Wikidata plus its Wikipedia summary.
  rpc GetCountryFacts(GetCountryFactsRequest) returns (GetCountryFactsResponse) {
    option (sebuf.http.config) = {path: "/get-country-facts", method: HTTP_METHOD_GET};
  }

  // ListSecurityAdvisories returns travel and health advisories from the US State Department, UK FCDO, Smartraveller, CDC, ECDC, and WHO with per-country levels.
  rpc ListSecurityAdvisories(ListSecurityAdvisoriesRequest) returns (ListSecurityAdvisoriesResponse) {
    option (sebuf.http.config) = {path: "/list-security-advisories", method: HTTP_METHOD_GET};
  }

  // GetGdeltTopicTimeline returns 14-day GDELT tone and volume timelines for one topic: military, cyber, nuclear, sanctions, intelligence, or maritime.
  rpc GetGdeltTopicTimeline(GetGdeltTopicTimelineRequest) returns (GetGdeltTopicTimelineResponse) {
    option (sebuf.http.config) = {path: "/get-gdelt-topic-timeline", method: HTTP_METHOD_GET};
  }

  // ListCrossSourceSignals returns signals from GPS jamming, unrest, OREF, market, cyber, and other feeds, ranked by severity, with composite escalation zones.
  rpc ListCrossSourceSignals(ListCrossSourceSignalsRequest) returns (ListCrossSourceSignalsResponse) {
    option (sebuf.http.config) = {path: "/list-cross-source-signals", method: HTTP_METHOD_GET};
  }

  // ListMarketImplications returns AI-generated trade-implication cards from live world state.
  rpc ListMarketImplications(ListMarketImplicationsRequest) returns (ListMarketImplicationsResponse) {
    option (sebuf.http.config) = {path: "/list-market-implications", method: HTTP_METHOD_GET};
  }

  // ListWsbTickers ranks the top 50 tickers mentioned on r/wallstreetbets, r/stocks, and r/investing by velocity.
  rpc ListWsbTickers(ListWsbTickersRequest) returns (ListWsbTickersResponse) {
    option (sebuf.http.config) = {path: "/list-wsb-tickers", method: HTTP_METHOD_GET};
  }

  // GetSocialVelocity returns hot posts from r/worldnews and r/geopolitics ranked by a velocity score of upvotes, ratio, and recency, refreshed every 3 hours.
  rpc GetSocialVelocity(GetSocialVelocityRequest) returns (GetSocialVelocityResponse) {
    option (sebuf.http.config) = {path: "/get-social-velocity", method: HTTP_METHOD_GET};
  }

  // GetCountryEnergyProfile returns a country's power mix, JODI oil and gas balances, IEA stock cover, Ember electricity, gas storage, prices, and SPR policy.
  rpc GetCountryEnergyProfile(GetCountryEnergyProfileRequest) returns (GetCountryEnergyProfileResponse) {
    option (sebuf.http.config) = {path: "/get-country-energy-profile", method: HTTP_METHOD_GET};
  }

  // ComputeEnergyShockScenario models the oil, gas, or combined supply deficit a country faces when 10 to 100 percent of a chokepoint's flow is disrupted.
  rpc ComputeEnergyShockScenario(ComputeEnergyShockScenarioRequest) returns (ComputeEnergyShockScenarioResponse) {
    option (sebuf.http.config) = {path: "/compute-energy-shock", method: HTTP_METHOD_GET};
  }

  // GetCountryPortActivity returns up to 25 IMF PortWatch ports for a country with 30-day tanker calls, trend versus the prior 30 days, and tanker DWT.
  rpc GetCountryPortActivity(GetCountryPortActivityRequest) returns (CountryPortActivityResponse) {
    option (sebuf.http.config) = {path: "/get-country-port-activity", method: HTTP_METHOD_GET};
  }

  // GetChinaDecisionSignals composes the six launched China decision-parity
  // domains into one bounded provenance-preserving public snapshot.
  rpc GetChinaDecisionSignals(GetChinaDecisionSignalsRequest) returns (GetChinaDecisionSignalsResponse) {
    option (sebuf.http.config) = {path: "/get-china-decision-signals", method: HTTP_METHOD_GET};
  }

  // Written every 6h by scripts/seed-regional-snapshots.mjs; the handler only
  // reads canonical state. (Detached: kept out of the public spec.)

  // GetRegionalSnapshot returns the latest RegionalSnapshot for a region,
  // refreshed every 6h. Premium-gated.
  rpc GetRegionalSnapshot(GetRegionalSnapshotRequest) returns (GetRegionalSnapshotResponse) {
    option (sebuf.http.config) = {path: "/get-regional-snapshot", method: HTTP_METHOD_GET};
  }

  // GetRegimeHistory returns the region's regime transition log newest-first.
  // Entries are append-only from the seed writer, recorded only when
  // diffRegionalSnapshot reports regime_changed. Premium-gated.
  rpc GetRegimeHistory(GetRegimeHistoryRequest) returns (GetRegimeHistoryResponse) {
    option (sebuf.http.config) = {path: "/get-regime-history", method: HTTP_METHOD_GET};
  }

  // GetRegionalBrief returns the latest weekly intelligence brief for a region.
  // Written by scripts/seed-regional-briefs.mjs on a weekly cron. Premium-gated.
  rpc GetRegionalBrief(GetRegionalBriefRequest) returns (GetRegionalBriefResponse) {
    option (sebuf.http.config) = {path: "/get-regional-brief", method: HTTP_METHOD_GET};
  }

  // Store: convex/intelHistory.ts. (Detached: kept out of the public spec.)

  // SearchIntelHistory searches stored historical intelligence events by
  // semantic similarity to a free-text query. Each cache miss costs one
  // embeddings call, so the route has its own fail-closed rate policy.
  // Premium-gated.
  rpc SearchIntelHistory(SearchIntelHistoryRequest) returns (SearchIntelHistoryResponse) {
    option (sebuf.http.config) = {path: "/search-intel-history", method: HTTP_METHOD_POST};
  }

  // GetIntelTimeline returns the durable historical intelligence store
  // newest-first for one domain and/or country. Pure index read — no
  // embedding, no ranking. Premium-gated.
  rpc GetIntelTimeline(GetIntelTimelineRequest) returns (GetIntelTimelineResponse) {
    option (sebuf.http.config) = {path: "/get-intel-timeline", method: HTTP_METHOD_GET};
  }

  // GetSimilarEvents returns historical precedents for a described situation.
  // Same vector search as SearchIntelHistory over a longer free-text input,
  // so it is likewise embeddings-backed and rate-policied. Premium-gated.
  rpc GetSimilarEvents(GetSimilarEventsRequest) returns (GetSimilarEventsResponse) {
    option (sebuf.http.config) = {path: "/get-similar-events", method: HTTP_METHOD_POST};
  }
}
