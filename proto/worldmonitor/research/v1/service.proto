syntax = "proto3";

package worldmonitor.research.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/research/v1/list_arxiv_papers.proto";
import "worldmonitor/research/v1/list_trending_repos.proto";
import "worldmonitor/research/v1/list_hackernews_items.proto";
import "worldmonitor/research/v1/list_tech_events.proto";

// ResearchService provides APIs for academic papers, trending repos, and tech news.
service ResearchService {
  option (sebuf.http.service_config) = {base_path: "/api/research/v1"};

  // ListArxivPapers returns the newest arXiv papers in cs.AI, cs.CL and cs.CR, optionally filtered to one category, sorted by date, up to 100 per request.
  rpc ListArxivPapers(ListArxivPapersRequest) returns (ListArxivPapersResponse) {
    option (sebuf.http.config) = {path: "/list-arxiv-papers", method: HTTP_METHOD_GET};
  }

  // ListTrendingRepos returns daily trending GitHub repositories for Python, JavaScript or TypeScript from OSSInsight, with GitHub search as a fallback.
  rpc ListTrendingRepos(ListTrendingReposRequest) returns (ListTrendingReposResponse) {
    option (sebuf.http.config) = {path: "/list-trending-repos", method: HTTP_METHOD_GET};
  }

  // ListHackernewsItems returns up to 30 Hacker News stories from the top, new, best, ask, show or job feed, read from the official Hacker News Firebase API.
  rpc ListHackernewsItems(ListHackernewsItemsRequest) returns (ListHackernewsItemsResponse) {
    option (sebuf.http.config) = {path: "/list-hackernews-items", method: HTTP_METHOD_GET};
  }

  // Find technology events from Techmeme, dev.events and curated sources, filtering by type, map availability, result limit and upcoming days for event discovery.
  rpc ListTechEvents(ListTechEventsRequest) returns (ListTechEventsResponse) {
    option (sebuf.http.config) = {path: "/list-tech-events", method: HTTP_METHOD_GET};
  }
}
