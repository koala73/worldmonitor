syntax = "proto3";

package worldmonitor.economic.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/economic/v1/get_fred_series.proto";
import "worldmonitor/economic/v1/list_world_bank_indicators.proto";
import "worldmonitor/economic/v1/get_energy_prices.proto";
import "worldmonitor/economic/v1/get_macro_signals.proto";
import "worldmonitor/economic/v1/get_china_macro_snapshot.proto";
import "worldmonitor/economic/v1/get_china_activity_nowcast.proto";
import "worldmonitor/economic/v1/get_no2_activity.proto";
import "worldmonitor/economic/v1/get_energy_capacity.proto";
import "worldmonitor/economic/v1/get_bis_policy_rates.proto";
import "worldmonitor/economic/v1/get_bis_exchange_rates.proto";
import "worldmonitor/economic/v1/get_bis_credit.proto";
import "worldmonitor/economic/v1/get_fred_series_batch.proto";
import "worldmonitor/economic/v1/list_grocery_basket_prices.proto";
import "worldmonitor/economic/v1/list_bigmac_prices.proto";
import "worldmonitor/economic/v1/get_national_debt.proto";
import "worldmonitor/economic/v1/list_fuel_prices.proto";
import "worldmonitor/economic/v1/get_bls_series.proto";
import "worldmonitor/economic/v1/get_economic_calendar.proto";
import "worldmonitor/economic/v1/get_crude_inventories.proto";
import "worldmonitor/economic/v1/get_nat_gas_storage.proto";
import "worldmonitor/economic/v1/get_ecb_fx_rates.proto";
import "worldmonitor/economic/v1/get_eurostat_country_data.proto";
import "worldmonitor/economic/v1/get_eu_gas_storage.proto";
import "worldmonitor/economic/v1/get_eu_yield_curve.proto";
import "worldmonitor/economic/v1/get_eu_fsi.proto";
import "worldmonitor/economic/v1/get_economic_stress.proto";
import "worldmonitor/economic/v1/get_fao_food_price_index.proto";
import "worldmonitor/economic/v1/get_food_prices.proto";
import "worldmonitor/economic/v1/get_oil_stocks_analysis.proto";
import "worldmonitor/economic/v1/get_oil_inventories.proto";
import "worldmonitor/economic/v1/get_energy_crisis_policies.proto";
import "worldmonitor/economic/v1/list_global_tenders.proto";
import "worldmonitor/economic/v1/get_us_cpi_monthly.proto";
import "worldmonitor/economic/v1/get_us_treasury_par_yield_curve.proto";
import "worldmonitor/economic/v1/get_us_interest_rates.proto";
import "worldmonitor/economic/v1/get_world_cpi_monthly.proto";
import "worldmonitor/economic/v1/get_capital_flows.proto";
import "worldmonitor/economic/v1/get_government_yield_curve.proto";

// EconomicService provides APIs for macroeconomic data from FRED, World Bank, and EIA.
service EconomicService {
  option (sebuf.http.service_config) = {base_path: "/api/economic/v1"};

  // Retrieve a Federal Reserve Economic Data series by ID, with an observation limit, dated values, title, units and frequency for economic time-series analysis.
  rpc GetFredSeries(GetFredSeriesRequest) returns (GetFredSeriesResponse) {
    option (sebuf.http.config) = {path: "/get-fred-series", method: HTTP_METHOD_GET};
  }

  // Retrieve World Bank development indicators with country filters, country names, indicator codes and annual values for economic and development data analysis.
  rpc ListWorldBankIndicators(ListWorldBankIndicatorsRequest) returns (ListWorldBankIndicatorsResponse) {
    option (sebuf.http.config) = {path: "/list-world-bank-indicators", method: HTTP_METHOD_GET};
  }

  // Retrieve current EIA energy commodity prices for selected commodities, with names, units, price changes and observation times for energy market monitoring.
  rpc GetEnergyPrices(GetEnergyPricesRequest) returns (GetEnergyPricesResponse) {
    option (sebuf.http.config) = {path: "/get-energy-prices", method: HTTP_METHOD_GET};
  }

  // Review seven macro signals with bullish counts and BUY, CASH or UNKNOWN verdicts; unavailable cached data returns UNKNOWN to keep missing evidence explicit.
  rpc GetMacroSignals(GetMacroSignalsRequest) returns (GetMacroSignalsResponse) {
    option (sebuf.http.config) = {path: "/get-macro-signals", method: HTTP_METHOD_GET};
  }

  // GetChinaMacroSnapshot reads the normalized China macro and official release
  // calendar seeds. It never fans out to upstream providers on a cache miss.
  rpc GetChinaMacroSnapshot(GetChinaMacroSnapshotRequest) returns (GetChinaMacroSnapshotResponse) {
    option (sebuf.http.config) = {path: "/get-china-macro-snapshot", method: HTTP_METHOD_GET};
  }

  // GetChinaActivityNowcast compares the revision-aware official macro pulse
  // with reviewed proxy families using a deterministic, no-lookahead method.
  rpc GetChinaActivityNowcast(GetChinaActivityNowcastRequest) returns (GetChinaActivityNowcastResponse) {
    option (sebuf.http.config) = {path: "/get-china-activity-nowcast", method: HTTP_METHOD_GET};
  }

  // GetNo2Activity returns Sentinel-5P NO2 year-over-year activity direction for 167 countries and 32 industrial clusters, filterable by country, region and kind.
  rpc GetNo2Activity(GetNo2ActivityRequest) returns (GetNo2ActivityResponse) {
    option (sebuf.http.config) = {path: "/get-no2-activity", method: HTTP_METHOD_GET};
  }

  // Retrieve cached EIA installed capacity series by energy source, with annual megawatt values for comparing available solar, wind and coal generation capacity.
  rpc GetEnergyCapacity(GetEnergyCapacityRequest) returns (GetEnergyCapacityResponse) {
    option (sebuf.http.config) = {path: "/get-energy-capacity", method: HTTP_METHOD_GET};
  }

  // Retrieve BIS central bank policy rates with country, central bank, observation date and previous rate for comparing monetary policy across available countries.
  rpc GetBisPolicyRates(GetBisPolicyRatesRequest) returns (GetBisPolicyRatesResponse) {
    option (sebuf.http.config) = {path: "/get-bis-policy-rates", method: HTTP_METHOD_GET};
  }

  // GetBisExchangeRates retrieves the latest monthly real effective exchange rate from BIS WS_EER, with monthly change, for 12 economies including the euro area.
  rpc GetBisExchangeRates(GetBisExchangeRatesRequest) returns (GetBisExchangeRatesResponse) {
    option (sebuf.http.config) = {path: "/get-bis-exchange-rates", method: HTTP_METHOD_GET};
  }

  // GetBisCredit retrieves the latest quarterly credit-to-GDP ratio and prior quarter from BIS WS_TC for 12 economies, including the US, euro area and China.
  rpc GetBisCredit(GetBisCreditRequest) returns (GetBisCreditResponse) {
    option (sebuf.http.config) = {path: "/get-bis-credit", method: HTTP_METHOD_GET};
  }

  // Retrieve multiple Federal Reserve Economic Data series in one request, with dated observations and series metadata, plus requested and fetched result counts.
  rpc GetFredSeriesBatch(GetFredSeriesBatchRequest) returns (GetFredSeriesBatchResponse) {
    option (sebuf.http.config) = {path: "/get-fred-series-batch", method: HTTP_METHOD_POST};
  }

  // ListGroceryBasketPrices compares the weekly USD cost of a 10-item grocery basket (rice, eggs, milk, bread and more) across 24 countries, with weekly change.
  rpc ListGroceryBasketPrices(ListGroceryBasketPricesRequest) returns (ListGroceryBasketPricesResponse) {
    option (sebuf.http.config) = {path: "/list-grocery-basket-prices", method: HTTP_METHOD_GET};
  }

  // ListBigMacPrices retrieves weekly Big Mac prices in local currency and USD for 49 countries via Exa web search, with cheapest, priciest and weekly change.
  rpc ListBigMacPrices(ListBigMacPricesRequest) returns (ListBigMacPricesResponse) {
    option (sebuf.http.config) = {path: "/list-bigmac-prices", method: HTTP_METHOD_GET};
  }

  // GetNationalDebt estimates government debt in USD by country from IMF WEO debt-to-GDP and GDP with a deficit-based growth rate; US uses Treasury debt data.
  rpc GetNationalDebt(GetNationalDebtRequest) returns (GetNationalDebtResponse) {
    option (sebuf.http.config) = {path: "/get-national-debt", method: HTTP_METHOD_GET};
  }

  // ListFuelPrices retrieves weekly retail gasoline and diesel prices in USD for 30+ countries from official sources such as the EU Oil Bulletin and US EIA.
  rpc ListFuelPrices(ListFuelPricesRequest) returns (ListFuelPricesResponse) {
    option (sebuf.http.config) = {path: "/list-fuel-prices", method: HTTP_METHOD_GET};
  }

  // GetBlsSeries returns a BLS labor series, private nonfarm payrolls (USPRIV) or the employment cost index (ECIALLCIV), mirrored from FRED with recent history.
  rpc GetBlsSeries(GetBlsSeriesRequest) returns (GetBlsSeriesResponse) {
    option (sebuf.http.config) = {path: "/get-bls-series", method: HTTP_METHOD_GET};
  }

  // GetEconomicCalendar returns scheduled FOMC and ECB rate decisions, US CPI, payrolls, GDP, PCE and retail sales, and Eurostat releases, filtered by date range.
  rpc GetEconomicCalendar(GetEconomicCalendarRequest) returns (GetEconomicCalendarResponse) {
    option (sebuf.http.config) = {path: "/get-economic-calendar", method: HTTP_METHOD_GET};
  }

  // GetCrudeInventories retrieves the 8 most recent weeks of US commercial crude oil inventories excluding the SPR (EIA series WCESTUS1) with the latest period.
  rpc GetCrudeInventories(GetCrudeInventoriesRequest) returns (GetCrudeInventoriesResponse) {
    option (sebuf.http.config) = {path: "/get-crude-inventories", method: HTTP_METHOD_GET};
  }

  // GetNatGasStorage retrieves the 8 most recent weeks of US natural gas working gas storage from EIA (NW2_EPG0_SWO_R48_BCF).
  rpc GetNatGasStorage(GetNatGasStorageRequest) returns (GetNatGasStorageResponse) {
    option (sebuf.http.config) = {path: "/get-nat-gas-storage", method: HTTP_METHOD_GET};
  }

  // Retrieve daily ECB reference exchange rates for the euro against major currencies, with one-day changes, dates and availability status for currency analysis.
  rpc GetEcbFxRates(GetEcbFxRatesRequest) returns (GetEcbFxRatesResponse) {
    option (sebuf.http.config) = {path: "/get-ecb-fx-rates", method: HTTP_METHOD_GET};
  }

  // GetEurostatCountryData retrieves HICP inflation, unemployment and quarterly GDP growth from Eurostat for 10 EU member states, including Germany and France.
  rpc GetEurostatCountryData(GetEurostatCountryDataRequest) returns (GetEurostatCountryDataResponse) {
    option (sebuf.http.config) = {path: "/get-eurostat-country-data", method: HTTP_METHOD_GET};
  }

  // GetEuGasStorage returns EU gas storage fill % from GIE AGSI+, with day-over-day change, injection or withdrawal trend, and up to five days of history.
  rpc GetEuGasStorage(GetEuGasStorageRequest) returns (GetEuGasStorageResponse) {
    option (sebuf.http.config) = {path: "/get-eu-gas-storage", method: HTTP_METHOD_GET};
  }

  // GetEuYieldCurve retrieves the latest ECB euro area AAA government bond yield curve (Svensson spot rates) at the 1Y, 2Y, 5Y, 10Y, 20Y and 30Y tenors.
  rpc GetEuYieldCurve(GetEuYieldCurveRequest) returns (GetEuYieldCurveResponse) {
    option (sebuf.http.config) = {path: "/get-eu-yield-curve", method: HTTP_METHOD_GET};
  }

  // GetEuFsi retrieves the ECB Composite Indicator of Systemic Stress (CISS) for the euro area: latest daily value, a year of daily history and a staleness flag.
  rpc GetEuFsi(GetEuFsiRequest) returns (GetEuFsiResponse) {
    option (sebuf.http.config) = {path: "/get-eu-fsi", method: HTTP_METHOD_GET};
  }

  // Review the Economic Stress Index from six FRED series, with its 0-100 composite score, component readings, missing-data flags and snapshot time for context.
  rpc GetEconomicStress(GetEconomicStressRequest) returns (GetEconomicStressResponse) {
    option (sebuf.http.config) = {path: "/get-economic-stress", method: HTTP_METHOD_GET};
  }

  // GetFaoFoodPriceIndex retrieves 12 months of the FAO Food Price Index with meat, dairy, cereals, oils and sugar sub-indices, plus monthly and annual change.
  rpc GetFaoFoodPriceIndex(GetFaoFoodPriceIndexRequest) returns (GetFaoFoodPriceIndexResponse) {
    option (sebuf.http.config) = {path: "/get-fao-food-price-index", method: HTTP_METHOD_GET};
  }

  // GetFoodPrices returns local-currency market prices with exact prior-week comparisons, plus dated GIEWS and Tunisia context. Missing comparisons are explicitly unavailable. Market, market type, product, origin, unit and currency must match; levels are not comparable across countries.
  rpc GetFoodPrices(GetFoodPricesRequest) returns (GetFoodPricesResponse) {
    option (sebuf.http.config) = {path: "/get-food-prices", method: HTTP_METHOD_GET};
  }

  // GetOilStocksAnalysis ranks IEA members by oil stock days of net-import cover against the 90-day obligation, with Europe, Asia-Pacific and North America data.
  rpc GetOilStocksAnalysis(GetOilStocksAnalysisRequest) returns (GetOilStocksAnalysisResponse) {
    option (sebuf.http.config) = {path: "/get-oil-stocks-analysis", method: HTTP_METHOD_GET};
  }

  // GetOilInventories returns recent oil-inventory series: US crude weeks, the SPR snapshot, natural-gas weeks, EU gas storage, and IEA stocks.
  rpc GetOilInventories(GetOilInventoriesRequest) returns (GetOilInventoriesResponse) {
    option (sebuf.http.config) = {path: "/get-oil-inventories", method: HTTP_METHOD_GET};
  }

  // GetEnergyCrisisPolicies retrieves government responses to the 2026 energy crisis from the IEA policy tracker, filterable by country code and policy category.
  rpc GetEnergyCrisisPolicies(GetEnergyCrisisPoliciesRequest) returns (GetEnergyCrisisPoliciesResponse) {
    option (sebuf.http.config) = {path: "/get-energy-crisis-policies", method: HTTP_METHOD_GET};
  }

  // ListGlobalTenders returns the Pro-gated, paginated, seed-backed canonical procurement feed.
  rpc ListGlobalTenders(ListGlobalTendersRequest) returns (ListGlobalTendersResponse) {
    option (sebuf.http.config) = {path: "/list-global-tenders", method: HTTP_METHOD_GET};
  }

  // GetUsCpiMonthly returns seasonally adjusted US CPI-U for headline, core, food, energy, shelter, and services. Month-over-month and year-over-year changes are computed from that index. history=false is the latest month. history=true is every month from 1947.
  rpc GetUsCpiMonthly(GetUsCpiMonthlyRequest) returns (GetUsCpiMonthlyResponse) {
    option (sebuf.http.config) = {path: "/get-us-cpi-monthly", method: HTTP_METHOD_GET};
  }

  // GetUsTreasuryParYieldCurve returns the daily Treasury par yield curve, 1-month through 30-year. A missing tenor was not published that day. history=false is the latest business day. history=true is every business day since 1990.
  rpc GetUsTreasuryParYieldCurve(GetUsTreasuryParYieldCurveRequest) returns (GetUsTreasuryParYieldCurveResponse) {
    option (sebuf.http.config) = {path: "/get-us-treasury-par-yield-curve", method: HTTP_METHOD_GET};
  }

  // GetUsInterestRates returns the effective federal funds rate, target range, H.15 Treasury yields, and SOFR. history=false is the latest point of each series. history=true is the full history. This is not the Treasury par curve.
  rpc GetUsInterestRates(GetUsInterestRatesRequest) returns (GetUsInterestRatesResponse) {
    option (sebuf.http.config) = {path: "/get-us-interest-rates", method: HTTP_METHOD_GET};
  }

  // GetCapitalFlows returns where money enters and leaves about 230 economies, and between any two, from official statistics. Per country: IMF balance-of-payments gross inflows and outflows by FDI, portfolio and other investment (quarterly where reported, annual otherwise) with derived Forbes and Warnock surge, stop, flight and retrenchment states; BIS cross-border deposits and borrowing of non-bank residents; IMF portfolio holdings of the country's securities; and IMF direct-investment positions. With country and counterpart: both directions of the pair across bank deposits and lending (with eight quarters of adjusted flows), portfolio holdings and direct investment (with both sides' figures), each leg marked reported, not_itemized or not_published. A person changing residence is not a balance-of-payments flow, so wealth migration does not appear.
  rpc GetCapitalFlows(GetCapitalFlowsRequest) returns (GetCapitalFlowsResponse) {
    option (sebuf.http.config) = {path: "/get-capital-flows", method: HTTP_METHOD_GET};
  }

  // GetWorldCpiMonthly returns one national CPI series per country, worldwide. The per-country source is chosen by precedence (national overlay, then HICP for Europe, then IMF, then OECD) with a staleness fall-through, so each row carries its source, frequency and index base. Month-over-month and year-over-year changes are computed from that index; levels are not comparable across sources. history=false is the latest period per country. history=true is the stored 10-year window.
  rpc GetWorldCpiMonthly(GetWorldCpiMonthlyRequest) returns (GetWorldCpiMonthlyResponse) {
    option (sebuf.http.config) = {path: "/get-world-cpi-monthly", method: HTTP_METHOD_GET};
  }

  // GetGovernmentYieldCurve returns one sovereign market's daily yield curve from its official national publisher, or the OECD monthly 10Y benchmark when no daily curve is covered. Yields keep their publisher's measure and are never converted.
  rpc GetGovernmentYieldCurve(GetGovernmentYieldCurveRequest) returns (GetGovernmentYieldCurveResponse) {
    option (sebuf.http.config) = {path: "/get-government-yield-curve", method: HTTP_METHOD_GET};
  }
}
