syntax = "proto3";

package worldmonitor.scorecard.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/scorecard/v1/get_bloc_scorecard.proto";
import "worldmonitor/scorecard/v1/get_five_factor_scorecard.proto";
import "worldmonitor/scorecard/v1/list_five_factor_scorecards.proto";

service ScorecardService {
  option (sebuf.http.service_config) = {base_path: "/api/scorecard/v1"};

  // GetFiveFactorScorecard returns one country's 1-5 scores for food, energy, demographics, technology and defense, with per-pillar input evidence and coverage.
  rpc GetFiveFactorScorecard(GetFiveFactorScorecardRequest) returns (GetFiveFactorScorecardResponse) {
    option (sebuf.http.config) = {path: "/get-five-factor-scorecard", method: HTTP_METHOD_GET};
  }

  // ListFiveFactorScorecards returns pillar scores, bands and input coverage for every country in the seeded five-factor snapshot, plus methodology version.
  rpc ListFiveFactorScorecards(ListFiveFactorScorecardsRequest) returns (ListFiveFactorScorecardsResponse) {
    option (sebuf.http.config) = {path: "/list-five-factor-scorecards", method: HTTP_METHOD_GET};
  }

  // GetBlocScorecard aggregates five-factor pillar scores for a preset bloc such as EU27, NATO or BRICS, or 2-30 custom countries, listing excluded members.
  rpc GetBlocScorecard(GetBlocScorecardRequest) returns (GetBlocScorecardResponse) {
    option (sebuf.http.config) = {path: "/get-bloc-scorecard", method: HTTP_METHOD_GET};
  }
}
