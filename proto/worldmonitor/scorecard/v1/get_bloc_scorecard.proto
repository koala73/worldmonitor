syntax = "proto3";

package worldmonitor.scorecard.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/scorecard/v1/scorecard.proto";

message GetBlocScorecardRequest {
  // Official bloc preset: eu, nato, asean, or brics. Omit when members is provided.
  string preset = 1 [(sebuf.http.query) = { name: "preset" }];
  // Custom ISO 3166-1 alpha-2 country members. Omit when preset is provided.
  repeated string members = 2 [(sebuf.http.query) = { name: "members" }];
}

message GetBlocScorecardResponse {
  FiveFactorBlocScorecard scorecard = 1;
  bool unavailable = 2;
  string unavailable_reason = 3;
}
