syntax = "proto3";

package worldmonitor.wildfire.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";
import "worldmonitor/core/v1/geo.proto";

// FireDetection represents a satellite-detected active fire from NASA FIRMS.
message FireDetection {
  // Unique detection identifier.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];
  // Geographic location of the fire detection.
  worldmonitor.core.v1.GeoCoordinates location = 2;
  // Brightness temperature in Kelvin.
  double brightness = 3;
  // Fire radiative power in MW.
  double frp = 4;
  // Detection confidence level.
  FireConfidence confidence = 5;
  // Satellite that detected the fire (e.g., "MODIS", "VIIRS", "LANDSAT").
  string satellite = 6;
  // Time the fire was detected, as Unix epoch milliseconds.
  int64 detected_at = 7 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // Monitored region name (e.g., "Ukraine", "Russia", "Iran").
  string region = 8;
  // Day or night detection ("D" or "N").
  string day_night = 9;
  // Whether the thermal signature suggests a possible explosion rather than a fire
  // (FRP > 80 MW and brightness > 380 K).
  bool possible_explosion = 10;

  // Fields 11-16 carry agency-reported fires (CWFIS national, BC Wildfire
  // Service) alongside satellite FIRMS detections. The seeder has emitted them
  // since #6613/#6614; declaring them here is what makes them visible to typed
  // clients, the SDK and the OpenAPI spec rather than travelling as untyped
  // extras that a strict decoder is free to drop.

  // Producer of the row: "firms" for satellite detections, "cwfis" / "bcws" for
  // agency-reported fires. Absent means FIRMS, for rows written before this field.
  string source = 11;
  // Agency fire classification, e.g. "wildfire", "prescribed", "outOfControl".
  // Empty for satellite detections, which classify nothing.
  string kind = 12;
  // Whether the row should page. Prescribed burns are reported fires but are
  // NOT emergencies, and must not be treated as such by a consumer.
  bool emergency = 13;
  // Agency's own identifier for the fire, stable across ticks. Empty for FIRMS.
  string agency_fire_id = 14;
  // Reporting agency code (e.g. "BC", "AB", "ON"). Empty for FIRMS.
  string agency_code = 15;
  // Reported fire size in HECTARES. 0 when unknown or not applicable — FIRMS
  // detections report radiative power, not area. Named to match the key the
  // seeder actually emits: a proto field the payload never populates is worse
  // than no field, because consumers see it in the schema and get nothing.
  double fire_size = 16;
}

// FireConfidence represents the confidence level of a fire detection.
enum FireConfidence {
  // Unspecified confidence.
  FIRE_CONFIDENCE_UNSPECIFIED = 0;
  // Low confidence detection.
  FIRE_CONFIDENCE_LOW = 1;
  // Nominal confidence detection.
  FIRE_CONFIDENCE_NOMINAL = 2;
  // High confidence detection.
  FIRE_CONFIDENCE_HIGH = 3;
}
