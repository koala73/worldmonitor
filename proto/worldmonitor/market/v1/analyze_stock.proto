syntax = "proto3";

package worldmonitor.market.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

// How a headline's publish time was mapped onto a US equity trading date.
// Bookkeeping only — never a claim that the headline moved the tape.
enum HeadlineAlignmentRule {
  // Alignment was not attempted, or the publish timestamp was unusable.
  HEADLINE_ALIGNMENT_RULE_UNSPECIFIED = 0;
  // Published during the regular session; aligns to that same trading date.
  HEADLINE_ALIGNMENT_RULE_REGULAR_SESSION_SAME_TRADING_DAY = 1;
  // Published in pre-market; aligns to that same trading date.
  HEADLINE_ALIGNMENT_RULE_PREMARKET_SAME_TRADING_DAY = 2;
  // Published after the close; aligns to the next trading date.
  HEADLINE_ALIGNMENT_RULE_AFTER_HOURS_NEXT_TRADING_DAY = 3;
  // Published on a weekend or holiday; aligns to the next trading date.
  HEADLINE_ALIGNMENT_RULE_NON_SESSION_NEXT_TRADING_DAY = 4;
  // Published after midnight but before pre-market on a trading date; aligns
  // to that same date, which opens hours later.
  HEADLINE_ALIGNMENT_RULE_OVERNIGHT_SAME_TRADING_DAY = 5;
}

message StockAnalysisHeadline {
  string title = 1;
  string source = 2;
  string link = 3;
  int64 published_at = 4 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // US equity session at publish time: "regular", "pre", "post", or "closed".
  // Empty when published_at is invalid or US hours do not apply.
  string market_session_at_publish = 5;
  // NYSE/Nasdaq trading date this headline aligns to (YYYY-MM-DD). Empty when unaligned.
  string aligned_trading_date = 6;
  // Bookkeeping rule only. Never a causal claim. Carried as a closed enum so a
  // consumer can switch exhaustively instead of matching undocumented strings.
  HeadlineAlignmentRule alignment_rule = 7;
}

message AnalyzeStockRequest {
  // Stock ticker symbol to analyze.
  string symbol = 1 [(sebuf.http.query) = { name: "symbol" },
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];

  // Optional company display name used to disambiguate the symbol.
  string name = 2 [
    (sebuf.http.query) = { name: "name" },
    (buf.validate.field).string.max_len = 120
  ];

  // Whether to include recent news in the stock analysis.
  bool include_news = 3 [(sebuf.http.query) = { name: "include_news" }];
}

message AnalyzeStockResponse {
  bool available = 1;
  string symbol = 2;
  string name = 3;
  string display = 4;
  string currency = 5;

  double current_price = 6;
  double change_percent = 7;
  // Technical-analysis score (0-100), retained as a stable pair with signal
  // for clients that predate the fundamentals-blended rating.
  double signal_score = 8;
  // Technical-only signal paired with signal_score. New clients should use
  // rating_signal with composite_score for the surfaced investment rating.
  string signal = 9;
  string trend_status = 10;
  string volume_status = 11;
  string macd_status = 12;
  string rsi_status = 13;
  string summary = 14;
  string action = 15;
  string confidence = 16;
  string technical_summary = 17;
  string news_summary = 18;
  string why_now = 19;

  repeated string bullish_factors = 20;
  repeated string risk_factors = 21;
  repeated double support_levels = 22;
  repeated double resistance_levels = 23;
  repeated StockAnalysisHeadline headlines = 24;

  double ma5 = 25;
  double ma10 = 26;
  double ma20 = 27;
  double ma60 = 28;
  double bias_ma5 = 29;
  double bias_ma10 = 30;
  double bias_ma20 = 31;
  double volume_ratio_5d = 32;
  double rsi_12 = 33;
  double macd_dif = 34;
  double macd_dea = 35;
  double macd_bar = 36;

  string provider = 37;
  string model = 38;
  bool fallback = 39;
  bool news_searched = 40;
  string generated_at = 41;
  string analysis_id = 42;
  int64 analysis_at = 43 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  double stop_loss = 44;
  double take_profit = 45;
  string engine_version = 46;

  AnalystConsensus analyst_consensus = 47;
  PriceTarget price_target = 48;
  repeated UpgradeDowngrade recent_upgrades = 49;

  double dividend_yield = 50;
  double trailing_annual_dividend_rate = 51;
  int64 ex_dividend_date = 52 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  optional double payout_ratio = 53;
  reserved 54;
  reserved "five_year_avg_dividend_yield";
  string dividend_frequency = 55;
  double dividend_cagr = 56;

  // US-equity trading session at analysis time: "regular", "pre", "post" or
  // "closed". Empty when session detection does not apply (non-US symbols).
  string market_session = 57;
  // Latest pre/post-market price from Yahoo extended-hours candles. Only set
  // when market_session is "pre" or "post" and extended data is available.
  optional double extended_price = 58;
  // Extended-hours change % vs the last regular-session close. Only set when
  // extended_price is set.
  optional double extended_change_percent = 59;

  // Quality / growth / leverage fundamentals parsed from Yahoo's financialData
  // module (already fetched for price targets). Any field may be unset.
  Fundamentals fundamentals = 60;

  // Fundamental health score (0-100) blended from the quality/growth/leverage
  // fundamentals above. Unset when too few fundamentals are available to score,
  // in which case composite_score falls back to signal_score.
  optional double fundamental_score = 61;
  // Blend of signal_score (technicals) and fundamental_score that drives
  // rating_signal, so a Strong buy/sell no longer fires on price action alone.
  // Equals signal_score when fundamental_score is unset.
  double composite_score = 62;

  // Next scheduled earnings date (YYYY-MM-DD) plus consensus EPS / revenue for
  // the symbol, joined from the market:earnings-calendar:v1 seed. Unset when the
  // symbol has no upcoming (not-yet-reported) entry in the seed's ~2-week window.
  // (61-62 are taken by a concurrent PR; using 63-65 to avoid a field collision.)
  optional string next_earnings_date = 63;
  optional double consensus_eps = 64;
  optional double consensus_revenue = 65;

  // LLM-derived news sentiment for the analyzed symbol: a signed score in
  // [-1, 1] (-1 very bearish, 0 neutral / no material news, +1 very bullish),
  // emitted by the same overlay model that already reads the headlines — no
  // extra call. Omitted when the analysis falls back to rules (no LLM overlay).
  // (69 avoids a field collision with in-flight PRs: 61-62 blend fundamentals
  // into the rating, 63-65 are the merged earnings join, 66-68 are the in-flight
  // risk-analytics PR.)
  optional double news_sentiment = 69;

  // Risk analytics computed from the 6-month daily candles already fetched for
  // the technical snapshot (no extra upstream call).
  // (66-68 avoid a field collision: 61-62 are claimed by the in-flight PR that
  // blends fundamentals into the rating, and 63-65 by the merged earnings join.)
  //
  // Annualized realized volatility — sample stdev of daily log returns × √252 —
  // as a fractional ratio where 0.25 means 25%. 0 when history is insufficient.
  double realized_volatility = 66;
  // Wilder's 14-period Average True Range, in the response currency's price
  // units. 0 when history is insufficient.
  double atr = 67;
  // Maximum peak-to-trough drawdown over the window, as a non-positive fractional
  // ratio where -0.25 means a 25% decline. 0 for a monotonically rising series.
  double max_drawdown = 68;

  // Fundamentals-blended signal paired with composite_score. Kept separate
  // from the legacy technical-only signal/signal_score pair so already-loaded
  // web, desktop, and API clients never render a mixed-version rating.
  string rating_signal = 70;
  // Fundamentals-blended narrative paired with rating_signal/composite_score.
  // Legacy summary remains paired with signal/signal_score during rollout.
  string rating_summary = 71;
  // Fundamentals-blended action paired with rating_signal/composite_score.
  // Legacy action remains paired with signal/signal_score during rollout.
  string rating_action = 72;
  // Fundamentals-blended confidence paired with rating_signal/composite_score.
  // Legacy confidence remains paired with signal/signal_score during rollout.
  string rating_confidence = 73;
  // Fundamentals-blended explanation paired with rating_signal/composite_score.
  // Legacy why_now remains paired with signal/signal_score during rollout.
  string rating_why_now = 74;
  // Fundamentals-aware positive factors supporting the composite rating.
  // Legacy bullish_factors remain technical-only during rollout.
  repeated string rating_bullish_factors = 75;
  // Fundamentals-aware risks supporting the composite rating.
  // Legacy risk_factors remain technical-only during rollout.
  repeated string rating_risk_factors = 76;
}

message Fundamentals {
  // Fractional ratio where 0.25 means 25%.
  optional double profit_margin = 1;
  // Fractional ratio where 0.25 means 25%.
  optional double gross_margin = 2;
  // Fractional ratio where 0.25 means 25%.
  optional double operating_margin = 3;
  // Fractional ratio where 0.25 means 25%.
  optional double return_on_equity = 4;
  // Fractional ratio where 0.25 means 25%.
  optional double return_on_assets = 5;
  // Fractional ratio where 0.25 means 25%.
  optional double revenue_growth = 6;
  // Fractional ratio where 0.25 means 25%.
  optional double earnings_growth = 7;
  // Normalized debt/equity ratio where 1.5 means debt is 1.5x equity.
  optional double debt_to_equity = 8;
  // Latest Yahoo financialData value denominated in financial_currency.
  optional double total_cash = 9;
  // Latest Yahoo financialData value denominated in financial_currency.
  optional double total_debt = 10;
  // Latest Yahoo financialData value denominated in financial_currency.
  optional double free_cashflow = 11;
  // Latest Yahoo financialData value denominated in financial_currency.
  optional double ebitda = 12;
  // ISO 4217 currency used by the company's financial statements. This can
  // differ from AnalyzeStockResponse.currency for ADRs and cross-listings.
  optional string financial_currency = 13;
}

message AnalystConsensus {
  int32 strong_buy = 1;
  int32 buy = 2;
  int32 hold = 3;
  int32 sell = 4;
  int32 strong_sell = 5;
  int32 total = 6;
  string period = 7;
}

message PriceTarget {
  optional double high = 1;
  optional double low = 2;
  optional double mean = 3;
  optional double median = 4;
  optional double current = 5;
  int32 number_of_analysts = 6;
}

message UpgradeDowngrade {
  string firm = 1;
  string to_grade = 2;
  string from_grade = 3;
  string action = 4;
  int64 epoch_grade_date = 5 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
}
