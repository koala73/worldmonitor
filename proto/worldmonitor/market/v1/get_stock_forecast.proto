syntax = "proto3";

package worldmonitor.market.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";
import "worldmonitor/market/v1/stock_data.proto";

message GetStockForecastRequest {
  // Exchange security symbol; every returned record must match this value.
  string symbol = 1 [
    (sebuf.http.query) = {name: "symbol"},
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];
  // Requested forecast horizon when a versioned model path is available.
  string horizon = 2 [(sebuf.http.query) = {name: "horizon"}];
}

message GetStockForecastResponse {
  StockForecast forecast = 1;
  DataProvenance provenance = 2;
}
