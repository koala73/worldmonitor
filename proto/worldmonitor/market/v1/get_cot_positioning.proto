syntax = "proto3";

package worldmonitor.market.v1;

import "sebuf/http/annotations.proto";

message GetCotPositioningRequest {}

message CotInstrument {
  string name = 1;
  string code = 2;
  string report_date = 3;
  int64 asset_manager_long = 4;
  int64 asset_manager_short = 5;
  int64 leveraged_funds_long = 6;
  int64 leveraged_funds_short = 7;
  int64 dealer_long = 8;
  int64 dealer_short = 9;
  double net_pct = 10;
  // Non-reportable positions are the CFTC series closest to small traders.
  // They are a residual category, not a direct measurement of all retail flow.
  int64 small_trader_long = 11;
  int64 small_trader_short = 12;
  // False for cache rows written before the non-reportable fields were added.
  bool small_trader_available = 13;
}

message GetCotPositioningResponse {
  repeated CotInstrument instruments = 1;
  string report_date = 2;
  // True when the upstream or seed-backed variant is unavailable; empty payload fields
  // are graceful degradation, not confirmed zero data.
  bool unavailable = 3;
}
