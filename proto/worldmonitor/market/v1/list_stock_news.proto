syntax = "proto3";

package worldmonitor.market.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";
import "worldmonitor/market/v1/stock_data.proto";

message ListStockNewsRequest {
  // Exchange security symbol; every returned record must match this value.
  string symbol = 1 [
    (sebuf.http.query) = {name: "symbol"},
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];
  // Maximum number of source-linked articles; zero uses the server default.
  int32 limit = 2 [
    (sebuf.http.query) = {name: "limit"},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100
  ];
}

message ListStockNewsResponse {
  string symbol = 1;
  repeated StockNewsItem items = 2;
  DataProvenance provenance = 3;
}
