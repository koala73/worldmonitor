syntax = "proto3";

package worldmonitor.market.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";
import "worldmonitor/market/v1/stock_data.proto";

message SearchStocksRequest {
  string query = 1 [
    (sebuf.http.query) = {name: "query"},
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];
  int32 limit = 2 [
    (sebuf.http.query) = {name: "limit"},
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 20
  ];
}

message SearchStocksResponse {
  repeated StockSearchResult results = 1;
  DataProvenance provenance = 2;
}
