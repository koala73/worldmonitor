      <div style="max-width:800px;margin:0 auto;padding:40px 20px;font-family:system-ui,sans-serif;color:#e5e5e5;background:#0a0a0a;">
        <p>Ask it, subscribe to it, build on it. WM Analyst chat across 30+ live services, an AI digest delivered daily, twice-daily, or weekly to Slack, Discord, Telegram, Email, or webhook, a custom widget builder, and MCP for Claude and GPT.</p>
        <p>Pro is built on top of the free <a href="https://www.worldmonitor.app/dashboard" style="color:#4ade80;">World Monitor</a> dashboard — try it first, then upgrade for the AI analyst layer. You can also explore the specialized variants: <a href="https://tech.worldmonitor.app/" style="color:#4ade80;">Tech Monitor</a>, <a href="https://finance.worldmonitor.app/" style="color:#4ade80;">Finance Monitor</a>, <a href="https://commodity.worldmonitor.app/" style="color:#4ade80;">Commodity Monitor</a>, and <a href="https://happy.worldmonitor.app/" style="color:#4ade80;">Happy Monitor</a>.</p>
        <p>Pro ingests data from <a href="https://finnhub.io/" style="color:#4ade80;" rel="noopener noreferrer">Finnhub</a>, <a href="https://fred.stlouisfed.org/" style="color:#4ade80;" rel="noopener noreferrer">FRED</a>, <a href="https://acleddata.com/" style="color:#4ade80;" rel="noopener noreferrer">ACLED</a>, <a href="https://ucdp.uu.se/" style="color:#4ade80;" rel="noopener noreferrer">UCDP</a>, <a href="https://firms.modaps.eosdis.nasa.gov/" style="color:#4ade80;" rel="noopener noreferrer">NASA FIRMS</a>, <a href="https://aisstream.io/" style="color:#4ade80;" rel="noopener noreferrer">AISStream</a>, <a href="https://opensky-network.org/" style="color:#4ade80;" rel="noopener noreferrer">OpenSky</a>, and 25+ other live services. Background and analysis on the <a href="https://www.worldmonitor.app/blog/" style="color:#4ade80;">World Monitor Blog</a>; full source on <a href="https://github.com/koala73/worldmonitor" style="color:#4ade80;" rel="noopener noreferrer">GitHub (AGPL-3.0)</a>.</p>
        <h3>Three pillars</h3>
        <ul>
          <li><strong>Ask it</strong> — WM Analyst chat. All 30+ services queryable in plain English.</li>
          <li><strong>Subscribe to it</strong> — AI digest on your schedule: daily, twice-daily, or weekly. Slack, Discord, Telegram, Email, webhook.</li>
          <li><strong>Build on it</strong> — Custom Widget Builder (HTML/CSS/JS + AI) and MCP for Claude, GPT, custom LLMs.</li>
        </ul>
        <h3>What's included in Pro</h3>
        <ul>
          <li>WM Analyst chat — query all 30+ services conversationally</li>
          <li>AI digest with daily/twice-daily/weekly cadence (up to 30 ranked items per send), multi-channel delivery, AES-256 encrypted</li>
          <li>Real-time alerts for critical events</li>
          <li>Custom Widget Builder — HTML/CSS/JS with AI-assisted modification</li>
          <li>MCP connectors for Claude, GPT, and custom LLMs</li>
          <li>Equity research, stock analysis, and backtesting</li>
          <li>Flight search and price comparison</li>
          <li>Market watchlist, macro and central bank tracking</li>
        </ul>

          <dt>Is World Monitor still free?</dt>
