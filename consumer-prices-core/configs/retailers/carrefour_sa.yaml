retailer:
  slug: carrefour_sa
  name: Carrefour Saudi Arabia
  marketCode: sa
  currencyCode: SAR
  adapter: search
  baseUrl: https://www.carrefourksa.com/mafsau/en
  enabled: true # re-enabled 2026-03-23: #2148 fixed OOS prompt (returns null price instead of carousel fallback); may have low coverage if most products still OOS

  searchConfig:
    numResults: 5
    queryTemplate: "{canonicalName} grocery carrefour saudi {currency}"
    allowedHosts:
      - www.carrefourksa.com
    urlPathContains: /p/
    # Carrefour MAF storefronts hydrate product data late: at the default
    # settle the sibling carrefouruae.com page captured as a 2.2KB breadcrumb
    # shell (extractor: missing-price on every candidate) vs 32KB with an 8s
    # wait. Same MAF frontend here, same 2026-08-08 missing-price signature.
    renderWaitMs: 8000
    extractionFallback: exa
    requireStrictValidator: true

  rateLimit:
    requestsPerMinute: 10
    maxConcurrency: 1
    delayBetweenRequestsMs: 6000

  discovery:
    mode: search
    maxPages: 20
    seeds: []
