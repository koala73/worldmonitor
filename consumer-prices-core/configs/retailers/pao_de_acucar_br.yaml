retailer:
  slug: pao_de_acucar_br
  name: Pão de Açúcar Brazil
  marketCode: br
  currencyCode: BRL
  adapter: search
  baseUrl: https://www.paodeacucar.com
  enabled: true

  searchConfig:
    # Exa's draws for this domain are unstable: the 2026-08-08 02:00 scrape
    # drew store-flyer PDFs (/img/uploads/*.pdf) and content.paodeacucar.com
    # marketing pages for 7 of 11 items — 0 in-policy URLs each — while the
    # identical queries minutes later drew 4-5/5 live /produto/ pages. Search
    # wide so one bad ranking can't zero the item; extraction stays bounded.
    numResults: 10
    maxExtractionCandidates: 4
    urlPathContains: /produto/
    queryTemplate: "{canonicalName} supermercado Brasil {currency} preço"

  rateLimit:
    requestsPerMinute: 10
    maxConcurrency: 1
    delayBetweenRequestsMs: 6000

  discovery:
    mode: search
    maxPages: 20
    seeds: []
