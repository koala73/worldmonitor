retailer:
  slug: pao_de_acucar_br
  name: Pão de Açúcar Brazil
  marketCode: br
  currencyCode: BRL
  adapter: search
  baseUrl: https://www.paodeacucar.com
  enabled: true

  searchConfig:
    # Exa's draws for this domain are unstable: the 2026-08-08 02:00 scrape
    # drew store-flyer PDFs (/img/uploads/*.pdf) and content.paodeacucar.com
    # marketing pages for 7 of 11 items — 0 in-policy URLs each — while the
    # identical queries minutes later drew 4-5/5 live /produto/ pages. Search
    # wide so one bad ranking can't zero the item; extraction stays bounded.
    numResults: 10
    maxExtractionCandidates: 4
    urlPathContains: /produto/
    queryTemplate: "{canonicalName} supermercado Brasil {currency} preço"
    # This storefront hydrates product data late, the same shape carrefour_sa
    # documents. At the default settle Firecrawl returns a shell and extracts
    # productName AND price as null — not a price-selector miss but an empty
    # page — which surfaced as missing-price on 11/11 items and dragged BR to a
    # 0.45 completion ratio (COVERAGE_DEGRADED, #6841).
    #
    # Probed live 2026-08-17 on two product URLs:
    #   waitFor=0      -> {"productName":null,"price":null}
    #   waitFor=8000   -> "Leite Pasteurizado ... Xandô Garrafa 1l"  R$ 9.49
    #   waitFor=15000  -> identical
    #
    # Necessary but NOT sufficient: the full basket goes 0/11 -> 3/11, so 8 items
    # still miss. A 15000 comparison run scored 2/11 — do not read that as 8000
    # being better. This retailer's draws are unstable (see above), so a 3-vs-2
    # difference across single runs is inside that variance. 8000 is kept as the
    # cheaper settle with no evidence the longer one helps; the remaining
    # failures are tracked in #6841 and are more likely discovery or basket
    # matching than hydration (a 15000 run matched Água Mineral to a 12-pack at
    # R$44.28 instead of the single 1,5L bottle at R$2.89).
    renderWaitMs: 8000
    # 2026-09-02: Exa recovered current rice and oil pages with matching title,
    # size, BRL, and same-call R$ evidence. A price-less milk page stayed closed.
    extractionFallback: exa

  rateLimit:
    requestsPerMinute: 10
    maxConcurrency: 1
    delayBetweenRequestsMs: 6000

  discovery:
    mode: search
    maxPages: 20
    # Exa ranks unrelated /produto/ pages for these broad basket names. Try a
    # known qualifying page first, then keep the normal bounded search fallback
    # when a product is removed or has no printed price.
    seeds:
      - id: eggs_12
        url: https://www.paodeacucar.com/produto/123706
        category: eggs
      - id: milk_1l
        url: https://www.paodeacucar.com/produto/164065
        category: dairy
      - id: bread_white
        url: https://www.paodeacucar.com/produto/144583/pao
        category: bread
      - id: rice_1kg
        url: https://www.paodeacucar.com/produto/102639/arroz-branco-tipo-1-qualita-pacote-1kg
        category: rice
      - id: cooking_oil_soy_900ml
        url: https://www.paodeacucar.com/produto/124153/oleo-de-soja-soya-garrafa-900ml
        category: cooking_oil
      - id: tomatoes_1kg
        url: https://www.paodeacucar.com/produto/198376/tomate-italiano-selecionado-qualita-1kg
        category: tomatoes
      - id: water_1_5l
        url: https://www.paodeacucar.com/produto/99466/agua-mineral-natural-sem-gas-crystal-garrafa-15l
        category: water
      - id: sugar_1kg
        url: https://www.paodeacucar.com/produto/162802/acucar-cristalcucar-uniao-pacote-1kg
        category: sugar
      - id: yogurt_500g
        url: https://www.paodeacucar.com/produto/1619280
        category: dairy
