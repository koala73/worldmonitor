# =============================================================================
# World Monitor — Docker / Podman Compose
# =============================================================================
# Self-contained stack: app + Redis + AIS relay.
#
# Quick start:
#   cp .env.example .env        # add your API keys
#   docker compose up -d --build
#
# The app will be available at http://localhost:3000
# =============================================================================

services:

  worldmonitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: worldmonitor:latest
    container_name: worldmonitor
    ports:
      - "${WM_PORT:-3000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Daily artifacts produced by host-side seeders and served same-origin.
      # Lands outside /assets|/data|/map-styles|/textures, so nginx's SPA
      # catch-all serves it with no-cache — which is what a file that changes
      # daily needs (/data/ is Cache-Control immutable).
      - ./data-live:/usr/share/nginx/html/live:ro
    environment:
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
      LOCAL_API_PORT: "46123"
      LOCAL_API_MODE: "docker"
      LOCAL_API_CLOUD_FALLBACK: "false"
      WS_RELAY_URL: "http://ais-relay:3004"
      # LLM provider (any OpenAI-compatible endpoint)
      LLM_API_URL: "${LLM_API_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      # Ollama on the Docker host — provider chain tries ollama first; llm.ts
      # appends /v1/chat/completions to this base URL (AMD-003: local LLM).
      OLLAMA_API_URL: "${OLLAMA_API_URL:-}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      # Data source API keys (optional — features degrade gracefully)
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      ACLED_ACCESS_TOKEN: "${ACLED_ACCESS_TOKEN:-}"
      NASA_FIRMS_API_KEY: "${NASA_FIRMS_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      AVIATIONSTACK_API: "${AVIATIONSTACK_API:-}"
      # Keys read at runtime by the in-container API routes (server/worldmonitor/*) —
      # without these the .env values never reach the app in docker mode.
      COINGECKO_API_KEY: "${COINGECKO_API_KEY:-}"
      ICAO_API_KEY: "${ICAO_API_KEY:-}"
      WINDY_API_KEY: "${WINDY_API_KEY:-}"
      WTO_API_KEY: "${WTO_API_KEY:-}"
      OTX_API_KEY: "${OTX_API_KEY:-}"
      URLHAUS_AUTH_KEY: "${URLHAUS_AUTH_KEY:-}"
      ABUSEIPDB_API_KEY: "${ABUSEIPDB_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      WINGBITS_API_KEY: "${WINGBITS_API_KEY:-}"
      # stock-news-search reads the plural form; .env carries a single key.
      EXA_API_KEYS: "${EXA_API_KEY:-}"
      # Warm-ping / seed-refresh auth — gateway validates against these (gateway.ts).
      WORLDMONITOR_RELAY_KEY: "${WORLDMONITOR_RELAY_KEY:-}"
      WORLDMONITOR_SEED_REFRESH_KEY: "${WORLDMONITOR_SEED_REFRESH_KEY:-}"
      # Self-host premium unlock: VALID_KEYS is the server-side allowlist
      # (enterprise kind — bypasses entitlements); API_KEY is the same value,
      # injected into the SPA at container start (docker/entrypoint.sh) so the
      # browser sends X-WorldMonitor-Key on premium paths and panel gating opens.
      WORLDMONITOR_VALID_KEYS: "${WORLDMONITOR_VALID_KEYS:-}"
      WORLDMONITOR_API_KEY: "${WORLDMONITOR_API_KEY:-}"
      # ── God's Eye View (src/gev/, served at /api/gev/*) ─────────────────
      # GEV_GOOGLE_API_KEY and GEV_TOMTOM_API_KEY keep the fork's existing
      # .env spelling; server/gev/gev-api-paths.mjs maps them to the names
      # upstream reads (GOOGLE_MAPS_API_KEY / TOMTOM_API_KEY), and the root
      # vite.config.ts does the same for the browser half.
      #
      # GOOGLE + CESIUM are CLIENT-EXPOSED by design — Google's Map Tiles API
      # and Cesium ion are called from the browser. Restrict them at the
      # provider (HTTP referrer for Google; a public assets:read ion token
      # with URL restrictions) rather than trying to hide them.
      GEV_GOOGLE_API_KEY: "${GEV_GOOGLE_API_KEY:-}"
      CESIUM_ION_TOKEN: "${CESIUM_ION_TOKEN:-}"
      # Server-side only — the browser fetches /api/gev/* and never sees these.
      GEV_TOMTOM_API_KEY: "${GEV_TOMTOM_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENSKY_CLIENT_ID: "${OPENSKY_CLIENT_ID:-}"
      OPENSKY_CLIENT_SECRET: "${OPENSKY_CLIENT_SECRET:-}"
      # Opt-in per-IP throttles on the two endpoints that spend real money.
      # Unset means unlimited; set these whenever the stack is not localhost.
      GEV_RATELIMIT_GOOGLE_PER_MIN: "${GEV_RATELIMIT_GOOGLE_PER_MIN:-}"
      GEV_RATELIMIT_OPENAI_PER_MIN: "${GEV_RATELIMIT_OPENAI_PER_MIN:-}"
    # Docker secrets (recommended for API keys — keeps them out of docker inspect).
    # Create secrets/ dir with one file per key, then uncomment below.
    # See SELF_HOSTING.md or docker-compose.override.yml for details.
    # secrets:
    #   - GROQ_API_KEY
    #   - AISSTREAM_API_KEY
    #   - FINNHUB_API_KEY
    #   - FRED_API_KEY
    #   - NASA_FIRMS_API_KEY
    #   - LLM_API_KEY
    # Override the image healthcheck: it probes `localhost`, which resolves to IPv6
    # ::1 where nginx isn't listening → false "unhealthy". 127.0.0.1 forces IPv4.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      redis-rest:
        condition: service_started
      ais-relay:
        condition: service_started
    restart: unless-stopped

  ais-relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: worldmonitor-ais-relay:latest
    container_name: worldmonitor-ais-relay
    environment:
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      # OpenSky OAuth for the relay's /opensky proxy (military flights panel).
      OPENSKY_CLIENT_ID: "${OPENSKY_CLIENT_ID:-}"
      OPENSKY_CLIENT_SECRET: "${OPENSKY_CLIENT_SECRET:-}"
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required — generate with: openssl rand -hex 32}"
      # Authenticates the relay's warm-pings to the gateway (matches gateway's key).
      WORLDMONITOR_RELAY_KEY: "${WORLDMONITOR_RELAY_KEY:-}"
      PORT: "3004"
    restart: unless-stopped

  redis:
    image: docker.io/redis:7-alpine
    container_name: worldmonitor-redis
    # --requirepass closes off the network so any future sidecar / compromised
    # dependency added to the worldmonitor network can't read or write cache
    # entries without the password. Defense-in-depth alongside the REST token.
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD required — generate with: openssl rand -hex 32}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redis-rest:
    build:
      context: docker
      dockerfile: Dockerfile.redis-rest
    image: worldmonitor-redis-rest:latest
    container_name: worldmonitor-redis-rest
    ports:
      - "127.0.0.1:8079:80"
    environment:
      SRH_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
      # Defense-in-depth: the redis service's --requirepass already fails
      # compose validation if REDIS_PASSWORD is unset, but the explicit
      # :? here protects against a future PR removing --requirepass or
      # copying this connection string into a new service.
      SRH_CONNECTION_STRING: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required — generate with: openssl rand -hex 32}@redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

# Docker secrets — uncomment and point to your secret files.
# Example: echo "gsk_abc123" > secrets/groq_api_key.txt
# secrets:
#   GROQ_API_KEY:
#     file: ./secrets/groq_api_key.txt
#   AISSTREAM_API_KEY:
#     file: ./secrets/aisstream_api_key.txt
#   FINNHUB_API_KEY:
#     file: ./secrets/finnhub_api_key.txt
#   FRED_API_KEY:
#     file: ./secrets/fred_api_key.txt
#   NASA_FIRMS_API_KEY:
#     file: ./secrets/nasa_firms_api_key.txt
#   LLM_API_KEY:
#     file: ./secrets/llm_api_key.txt

volumes:
  redis-data:
